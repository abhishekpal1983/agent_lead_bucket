<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call Now 2.0</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F7FA;color:#0A2540;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.hdr{background:#0A2540;padding:13px 22px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.hdr h1{font-size:17px;font-weight:600;color:#fff;letter-spacing:-.01em}
.hdr p{font-size:12.5px;color:#93A7BC}
.hdr a{color:#8FD3E4 !important}
.hdr a:hover{color:#fff !important}
.livebadge{background:#FF7A59;color:#fff;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:5px;letter-spacing:.02em}
.mebadge{background:#12304F;color:#9FD9E8;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:5px}
.wrap{max-width:1760px;margin:0 auto;padding:16px 22px 46px}
.bar{background:#fff;border:1px solid #DCE4EC;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:13px;flex-wrap:wrap;align-items:center}
.bar label{font-size:11px;color:#4A5A6A;font-weight:600;display:block;margin-bottom:3px;letter-spacing:.03em}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;border-top:1px solid #EFF3F7;padding-top:9px;margin-top:2px}
select,input[type=search],input[type=number]{border:1px solid #DCE4EC;border-radius:7px;padding:6px 10px;font-size:13px;background:#fff;font-family:inherit;min-width:140px;color:#0A2540}
select:hover,input:hover{border-color:#C2CFDB}
select:focus,input:focus{outline:none;border-color:#0091AE;box-shadow:0 0 0 3px #DCEDF6}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid #DCE4EC;background:#fff;border-radius:18px;padding:4px 12px;font-size:12.5px;font-weight:500;cursor:pointer;color:#425B76}
.chipb:hover{background:#EDF4F8;border-color:#B7DEE8}
.chipb.on{background:#0A2540;color:#fff;border-color:#0A2540}
.btn{border:1px solid #DCE4EC;background:#fff;border-radius:7px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:#37475A}
.btn:hover{background:#F4F7FA}
.btn.p{background:#0091AE;color:#fff;border-color:#0091AE}
.btn.p:hover{background:#00758C}
.mstrip{display:grid;grid-template-columns:190px minmax(0,1fr);gap:10px;margin-bottom:12px;align-items:stretch}
@media(max-width:960px){.mstrip{grid-template-columns:1fr}}
.mhero{background:#0A2540;border-radius:10px;padding:13px 16px;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.mhero:hover{background:#123152}
.mhero .v{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.mhero .l{font-size:12.5px;color:#93A7BC;margin-top:2px}
.mhero .s{font-size:11.5px;color:#9FB6CC;margin-top:8px;border-top:1px solid #1E3D5F;padding-top:7px;line-height:1.5}
.mgroups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
@media(max-width:900px){.mgroups{grid-template-columns:1fr}}
.mgroup{background:#fff;border:1px solid #DCE4EC;border-top:3px solid #0091AE;border-radius:10px;padding:10px 13px 11px;display:flex;flex-direction:column}
.mgroup .mrow{margin-top:auto}
.mgroup.alert{border-top-color:#FF7A59;background:#FEF8F6;border-color:#F0C0B2}
.mgroup h4{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#3F5163;font-weight:600;margin-bottom:9px}
.mrow{display:flex;gap:18px;flex-wrap:wrap;row-gap:10px}
.mitem{cursor:pointer;min-width:54px;border-radius:7px;padding:2px 6px;margin:-2px -6px}
.mitem:hover{background:#EDF4F8}
.mitem .v{font-size:24px;font-weight:600;letter-spacing:-.02em;color:#0A2540;line-height:1.15}
.mitem .l{font-size:12px;color:#566575;margin-top:2px}
.mitem.z .v{color:#B7C2CD}
.mitem.r .v{color:#8C2D12}.mitem.c .v{color:#0A5346}.mitem.a .v{color:#7A4A08}
.prog{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.prog .big{font-size:21px;font-weight:600;color:#0A2540;letter-spacing:-.02em}
.prog .of{font-size:12.5px;color:#566575}
.prog .pc{margin-left:auto;font-size:12.5px;font-weight:600;color:#0A5346}
.track{height:7px;border-radius:4px;background:#E7EEF4;overflow:hidden;margin-bottom:9px;display:flex}
.track i{display:block;height:7px}
.track i.done{background:#0091AE}
.track i.miss{background:#FF7A59}
.csync{background:#fff;border:1px solid #DCE4EC;border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:13px;color:#37475A}
.csync summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
.csync summary::-webkit-details-marker{display:none}
.csync .cbody{margin-top:10px;padding-top:10px;border-top:1px solid #EFF3F7;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sec{background:#fff;border:1px solid #DCE4EC;border-radius:10px;margin-bottom:13px;padding:13px 16px}
.sec h2{font-size:15px;font-weight:600;margin-bottom:3px;color:#0A2540}
.sec .sub{font-size:12.5px;color:#566575;margin-bottom:10px;line-height:1.55}
.sec.hero{padding:15px 17px;border-top:3px solid #0091AE}
.sec.mini{padding:12px 14px}
.sec.mini .sub{font-size:12px;margin-bottom:9px}
.sec.mini table{font-size:13.5px;table-layout:fixed;width:100%}
.sec.mini td{padding:8px 12px;overflow:hidden;text-overflow:ellipsis}
.sec.mini th{padding:8px 12px;white-space:normal;line-height:1.25;vertical-align:bottom;text-align:right}
.sec.mini th:first-child,.sec.mini td:first-child{width:200px;text-align:left}
.sec.mini th.n,.sec.mini td.n,.sec.mini td.cell{text-align:right}
.sec.mini .sub3{white-space:nowrap;text-align:right}
.sec.mini tbody tr:nth-child(odd) td{background:#FAFCFD}
.sec.mini tbody tr:nth-child(odd) td:first-child{background:#FAFCFD}
.sec.mini tbody tr:hover td{background:#EDF4F8}
.sec.mini tbody tr:hover td:first-child{background:#EDF4F8}
.sec.mini .sub3{font-size:11px}
.sec.mini .tw{max-height:none}
.tw{max-height:76vh;overflow:auto;border:1px solid #DCE4EC;border-radius:9px}
table{border-collapse:separate;border-spacing:0;font-size:13.5px;width:100%}
th{background:#EDF2F7;padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:#3F5163;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:3;border-bottom:1px solid #D3DEE9}
th:first-child{left:0;z-index:4}
td{padding:9px 12px;border-bottom:1px solid #EFF3F7;white-space:nowrap;color:#0A2540}
td:first-child{position:sticky;left:0;background:#fff;z-index:2;border-left:3px solid transparent}
tr:last-child td{border-bottom:none}
tr.tot td{background:#EDF2F7;font-weight:600;border-top:2px solid #D3DEE9;vertical-align:top}
tr.tot td:first-child{background:#EDF2F7}
tr.alert td:first-child{border-left-color:#FF7A59}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.cell{text-align:right;cursor:pointer;font-variant-numeric:tabular-nums}
td.cell:hover{box-shadow:inset 0 0 0 2px #0091AE}
td.cell.sel,.sec.mini tbody tr td.cell.sel,.sec.mini tbody tr:nth-child(odd) td.cell.sel,.sec.mini tbody tr:hover td.cell.sel{background:#0A2540 !important;color:#fff;font-weight:600}
td.cell.sel *{color:#fff !important}
td.z{color:#B7C2CD}
.cg{color:#0A5346}.cr{color:#8C2D12}.ca{color:#7A4A08}.mut{color:#6B7A8A}
.sub3{font-size:11px;font-weight:400;color:#566575;margin-top:2px;white-space:nowrap}
.sub3+.sub3{margin-top:1px}
.sub3 b{font-weight:600;cursor:pointer}
.sub3 b:hover{text-decoration:underline}
.sub3 .d{color:#3F5163}.sub3 .c{color:#0A5346}.sub3 .m{color:#8C2D12}
.st{font-size:12px;font-weight:500;padding:2px 9px;border-radius:6px;white-space:nowrap;display:inline-block}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;margin-right:4px;display:inline-block}
.tag.f{background:#EDE9FE;color:#4B2E9E}
.tag.s{background:#DDEFEA;color:#0A5346}
.tag.i{background:#DCEDF6;color:#0B4A66}
.tag.o{background:#FBE2D8;color:#8C2D12}
.tag.p{background:#EAEFF4;color:#3F5163}
.tag.rf{background:#FF7A59;color:#fff}
.tag.src{background:#fff;color:#566575;border:1px solid #DCE4EC}
.tag.paid{background:#0A5346;color:#fff}
.tag.opt{background:#3F5163;color:#fff}
.pill{background:#FF7A59;color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;display:inline-block;font-variant-numeric:tabular-nums}
.pill.w{background:#B8791A}
.ph{font-variant-numeric:tabular-nums;color:#0A2540}
.ico{color:#0091AE;text-decoration:none;font-weight:600;margin-left:7px}
.ico:hover{text-decoration:underline}
.a2{color:#0091AE;text-decoration:none;font-weight:600}
.a2:hover{text-decoration:underline}
#loading{padding:60px;text-align:center;color:#566575}
.spin{width:28px;height:28px;border:3px solid #DCE4EC;border-top-color:#0091AE;border-radius:50%;margin:0 auto 12px;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:#FDF3E7;color:#7A4A08;border:1px solid #EFD3AE;border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.rowlink{cursor:pointer}
.rowlink:hover td{background:#F4F7FA}
.rowlink:hover td:first-child{background:#F4F7FA}
.mbar{display:inline-block;height:6px;border-radius:3px;background:#0091AE;vertical-align:middle;margin-right:7px;min-width:2px}
tr.det td{background:#F4F7FA;white-space:normal;font-size:12.5px;color:#37475A;padding:10px 14px;line-height:1.6}
tr.det b{color:#0A2540}
.exp{cursor:pointer;color:#0091AE;font-weight:700;user-select:none}

/* v2 only: the three group tables are wider than v1's, and the footer needs to read as a
   summary rather than another row of data. */
.sec.mini th:first-child,.sec.mini td:first-child{width:168px}
tfoot td{background:#0A2540;color:#fff;border-bottom:none;position:sticky;bottom:0;z-index:3}
tfoot td:first-child{background:#0A2540;color:#fff}
tfoot td .sub3{color:#93A7BC}
tfoot tr:first-child td{background:#12304F}
tfoot tr:first-child td:first-child{background:#12304F}
.chips{margin-bottom:2px}
/* The two column groups are different questions, so they get a hard divider and their
   own ground colour. Without it the eye runs straight from a timing count into a reason
   count and reads them as one row of the same thing. */
/* The two groups are told apart by a rule and a faint tint. Anything heavier fights the
   heatmap shading, which is the thing actually carrying meaning in these cells. */
th.gA{background:#E4EDF9;color:#2A5EA8}td.gA{background:#EEF4FC}
th.gB{background:#FAEFD8;color:#8A6414}td.gB{background:#FDF6E7}
th.gC{background:#E3F2E9;color:#1C6B4E}td.gC{background:#EDF7F0}
th.gD{background:#E9EEF3;color:#4A5A6A}td.gD{background:#F2F5F8}
th.gh{background:#fff}
thead tr.grp th{top:0;z-index:4;text-align:left;font-size:10px;letter-spacing:.09em;border-bottom:none}
thead tr.colh th{top:23px;z-index:3}
tr.tot td.gB{background:#F2E8D2}tr.tot td.gC{background:#DEEBE3}tr.tot td.gD{background:#D6DEE7}
tr.tot.grand td.gB{background:#1A2E4A}tr.tot.grand td.gC{background:#14304A}tr.tot.grand td.gD{background:#152A44}
th.edge,td.edge{border-left:2px solid #C2D2E0}
.sec.mini th{white-space:normal;line-height:1.25;vertical-align:bottom;text-align:right}
.sec.mini th:first-child,.sec.mini td:first-child{width:172px;text-align:left}
.sec.mini table{table-layout:auto}
/* Subtotal and total rows carry a fill so they read as summaries rather than as one more
   stage, and they are clickable like any other cell. */
tr.tot.sub td{background:#DCE7F0;border-top:2px solid #B9CBDC}
tr.tot.sub td:first-child{background:#DCE7F0}
tr.tot.sub td.gA{background:#D2DFEC}
tr.tot.grand td{background:#0A2540;color:#fff;border-top:2px solid #0A2540}
tr.tot.grand td:first-child{background:#0A2540;color:#fff}
tr.tot.grand td.gA{background:#12304F}
tr.tot.grand .sub3,tr.tot.grand .sub3 b{color:#AFC3D6}
tr.tot.grand td.z{color:#5C728A}
tr.tot td.cell:hover{box-shadow:inset 0 0 0 2px #0091AE}
tr.tot .sub3{font-weight:400}
/* Every table scrolls inside its own card rather than pushing the page down forever, and
   the rows are tight enough to see a floor's worth of work without scrolling at all. */
tr.det td{padding:8px 12px}
.st{margin:0}
tr.rowlink.on td{background:#DCEDF6}
tr.rowlink.on td:first-child{background:#DCEDF6;border-left:3px solid #0091AE}
.mbar{background:#0091AE}
.det td{white-space:normal}
.fsub{margin:2px 0 10px}
.fhd{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#566575;margin-bottom:7px}
.qa{margin-bottom:9px}
.qa .q{color:#4A6785;font-size:12.5px;margin-bottom:2px}
.qa .a{color:#0A2540;font-size:14px;font-weight:500;line-height:1.4}
</style>
<link rel="stylesheet" href="/theme.css">
<style>
/* Loaded after theme.css on purpose. The shared theme sets its rules with !important, so
   anything density related has to come last or it silently loses. That is why the compact
   rows and the scrolling tables looked like they had not shipped. */
.wrap table th{padding:5px 10px !important;font-size:10px !important;letter-spacing:.05em !important}
.wrap table{font-size:12.5px !important}
.wrap table td{padding:4px 10px !important;line-height:1.3 !important;font-size:12.5px !important}
.wrap table td a{font-size:12.5px !important}
.wrap .ph{font-size:12px !important}
.wrap .ico{font-size:11.5px !important;margin-left:6px !important}
.wrap .exp{font-size:13px !important}
.wrap .sec.mini td,.wrap .sec.mini th{padding:4px 10px !important}
.wrap .tw{max-height:52vh !important;overflow:auto !important}
.wrap .tw.scrolly{max-height:300px !important}
.wrap .sub3{font-size:10px !important;line-height:1.2 !important;margin-top:0 !important}
/* Effort bands read as four blocks, not eight look-alike numbers. The header carries the
   band's own colour and the column beneath it a faint wash of the same, so the eye lands
   on the block first and the number second. Same four hues as the cells: red is barely
   tried, amber some effort, green at benchmark, indigo over-worked. */
.wrap th.bd{font-size:9px !important;letter-spacing:.06em !important;line-height:1.15 !important;
  padding:5px 8px !important;border-bottom:2px solid currentColor !important}
.wrap th.bd .sub3{font-size:9.5px !important;font-weight:700 !important;opacity:.85;color:inherit !important}
.wrap th.bd-low{background:#FDECEA !important;color:#8C2D12 !important}
.wrap th.bd-avg{background:#FDF3E2 !important;color:#7A4A08 !important}
.wrap th.bd-bench{background:#E6F3EC !important;color:#0A5346 !important}
.wrap th.bd-high{background:#EDE9FE !important;color:#4B2E9E !important}
.wrap td.bd-low{background:#FEF7F5}
.wrap td.bd-avg{background:#FEFAF3}
.wrap td.bd-bench{background:#F4FAF7}
.wrap td.bd-high{background:#F8F6FE}
.wrap tr:hover td.bd-low{background:#FDECEA}
.wrap tr:hover td.bd-avg{background:#FDF3E2}
.wrap tr:hover td.bd-bench{background:#E6F3EC}
.wrap tr:hover td.bd-high{background:#EDE9FE}
.wrap tr.sub2 td{background:#FBFCFE}
.wrap tr.sub2 td:first-child{padding-left:26px !important;font-size:12px !important}
/* ---- bands ------------------------------------------------------------------------
   Controls stay put while the table scrolls under them, so a filter is never more than
   a glance away. The shadow only appears once the bar is actually stuck. */
/* Deliberately not sticky. It was pinned so a filter was always in reach; a fifth of the
   screen held back on every table below is too much to pay for that. */
.wrap .headband > .heroside > .bar{margin:6px 0 0 !important;padding:6px 8px !important}
.wrap .headband > .heroside > .hnote{margin-top:6px !important}
/* Wide by nature, so the stage and owner chips get the whole width under the band. */
.wrap .bar.chipbar{padding-top:8px !important;padding-bottom:8px !important;margin-bottom:0 !important}
/* Dropdowns left, chips right, view tabs under both. */
.wrap .ctlgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;
  align-items:start;margin-bottom:8px}
.wrap .ctlgrid.solo{grid-template-columns:1fr}
.wrap .ctlgrid > .bar{margin-bottom:0 !important;height:100%}
/* Half the width, so the dropdowns pair up instead of stringing out across a row. */
.wrap .headband .bar.ctl > div{flex:1 1 44% !important;min-width:0}
.wrap .headband .bar.ctl > div:last-child{flex:1 1 100% !important;margin-left:0 !important;text-align:left}
.wrap .headband .bar.chipbar{align-items:flex-start !important}
.wrap .headband .bar.chipbar .barlbl{align-self:flex-start;margin-top:3px}
@media (max-width:1250px){ .wrap .ctlgrid{grid-template-columns:1fr} }

/* ---- the band, held to the height of the cards ------------------------------------
   The controls were taller than the four cards beside them, so the band ended in a hole
   and the tables started lower than they needed to. Everything here is shrunk to the
   same end: the cards set the height, the controls fit inside it. */
.wrap .headband .bar.ctl{padding:9px 11px !important}
.wrap .headband .bar.ctl > div > label{font-size:9.5px !important;margin-bottom:2px !important;
  letter-spacing:.03em}
.wrap .headband .bar.ctl select,.wrap .headband .bar.ctl .segbtn{
  padding:4px 8px !important;font-size:12px !important;border-radius:7px !important}
.wrap .headband .bar.ctl{gap:7px 9px !important}
.wrap .headband .bar.ctl .btn{padding:4px 10px !important;font-size:12px !important}
.wrap .headband .fresh{margin-top:2px}

/* Chips: two labelled rows, small, tight. Thirteen stages have to fit half a band. */
.wrap .chipset{display:block;width:100%}
.wrap .chipset + .chipset{margin-top:6px;padding-top:6px;border-top:1px solid var(--line2,#EFF3F7)}
.wrap .chipset .barlbl{display:flex;margin-bottom:4px}
.wrap .headband .chips{gap:4px !important}
.wrap .headband .chipb{padding:2px 8px !important;font-size:10.5px !important;border-radius:14px !important}
.wrap .headband .bar.chipbar{padding:9px 11px !important}

/* ---- the control cards ------------------------------------------------------------
   Three white boxes with grey chips gave no clue which one did what, and none of them
   looked like part of the same page as the tables below. Each now carries the indigo
   rule that means "this is a control", the labels carry a tick of the same, and the
   chips wear the meaning they filter on. Colour here is never decoration: a stage chip
   is the colour that stage is in every table, and an owner chip is the colour that
   owner state is everywhere else. */
.wrap .bar.ctl{border-top:2px solid #4F46E5 !important;background:
  linear-gradient(180deg,#FBFBFF 0%,#fff 42%) !important}
.wrap .barlbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:#4B2E9E;flex:0 0 auto;align-self:center;display:flex;align-items:center;gap:5px}
.wrap .barlbl:before{content:"";width:3px;height:11px;border-radius:2px;background:#6D4BD8}
.wrap .bar.chipbar .barlbl+.chips{margin-right:14px}

/* Stage chips carry their own stage colour, solid when chosen. */
.wrap .chipb.stagechip{border:1px solid transparent !important;font-weight:600 !important}
.wrap .chipb.stagechip:hover{filter:brightness(.96)}
.wrap .chipb.stagechip.on{font-weight:700 !important;box-shadow:0 1px 2px rgba(10,37,64,.18)}
.wrap .chipb.all{background:#EEF0FE;color:#3B2FA8;border-color:#DDD9FA;font-weight:600}
.wrap .chipb.all.on{background:#4F46E5;color:#fff;border-color:#4F46E5}

/* Owner chips say what they mean: working, gone, needs routing, nobody. */
.wrap .chipb.own{font-weight:600}
.wrap .chipb.own-all{background:#EEF0FE;color:#3B2FA8;border-color:#DDD9FA}
.wrap .chipb.own-all.on{background:#4F46E5;color:#fff;border-color:#4F46E5}
.wrap .chipb.own-ok{background:#E6F3EC;color:#0A5346;border-color:#CBE6D9}
.wrap .chipb.own-ok.on{background:#0A5346;color:#fff;border-color:#0A5346}
.wrap .chipb.own-gone{background:#FBE2D8;color:#8C2D12;border-color:#F3CDBE}
.wrap .chipb.own-gone.on{background:#8C2D12;color:#fff;border-color:#8C2D12}
.wrap .chipb.own-route{background:#FDF3E2;color:#7A4A08;border-color:#F0DCB8}
.wrap .chipb.own-route.on{background:#7A4A08;color:#fff;border-color:#7A4A08}
.wrap .chipb.own-none{background:#EDF1F5;color:#3F5163;border-color:#DAE2EA}
.wrap .chipb.own-none.on{background:#3F5163;color:#fff;border-color:#3F5163}

/* The filter labels above each dropdown, tied to the same family. */
.wrap .bar.ctl > div > label{color:#4A5A6A !important;font-weight:600 !important}
.wrap .bar.ctl select:focus,.wrap .bar.ctl .segsearch:focus{outline:none;border-color:#4F46E5;
  box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.wrap .bar.ctl select{border-color:#DCE4EC}
/* A dropdown that is actually filtering something should look different from one that is not. */

   the whole model can be exercised locally against fixtures before it goes anywhere.
   server.js supplies the leads; everything below only reads plain objects. */

// Sunday off by default. A follow-up that lands on a non-working day rolls forward to the
// next working day as due, rather than being counted as a miss nobody could have made.
const DEFAULT_WORK_DAYS = "1,2,3,4,5,6";
const IST_OFFSET = 5.5 * 3600000;

function workDaySet(spec){
  const s = {};
  String(spec || DEFAULT_WORK_DAYS).split(",").forEach(function(x){
    const n = parseInt(String(x).trim(), 10);
    if (n >= 0 && n <= 6) s[n] = true;
  });
  return s;
}
function istDayIndex(ms){ return Math.floor((ms + IST_OFFSET) / 86400000); }
function istDayStart(idx){ return idx * 86400000 - IST_OFFSET; }
function istWeekday(idx){
  // 1970-01-01 was a Thursday, so day index 0 is weekday 4.
  return (((idx + 4) % 7) + 7) % 7;
}
function dayBoundsFor(nowMs){
  const idx = istDayIndex(nowMs);
  return { idx: idx, start: istDayStart(idx), end: istDayStart(idx + 1) };
}
// How many working days a lead has had to be called since its follow-up fell due, not
// counting today. Zero means it has not yet had a chance and is not overdue.
function workDaysMissed(fuIdx, todayIdx, work){
  let n = 0;
  for (let i = fuIdx; i < todayIdx; i++) if (work[istWeekday(i)]) n++;
  return n;
}

const STAGE_DNP = "dnp_did_not_pick";
const STAGE_DNP_OTHER = "dnp_other";
const STAGE_FRESH = "__fresh";
const STAGE_IFC = "IFC";
// A refill on a lead that already bought, or one that was disqualified, is noise.
const REFILL_EXCLUDED = ["deal_won", "disqualified"];

/* Has this lead filled the form again since anyone last spoke to it. That is a lead
   asking a second time into silence, which is why it outranks the stage it is sitting in.
   A form with no call at all also counts. */
function isRefill(r){
  if (!r.formLast) return false;
  if (REFILL_EXCLUDED.indexOf(r.stage) >= 0) return false;
  if (!r.last) return true;
  return r.formLast > r.last;
}

function timingOf(r, day, work){
  if (!r.fu) return r.stage === STAGE_FRESH ? "newlead" : "nofu";
  const fuIdx = istDayIndex(r.fu);
  if (fuIdx > day.idx) return "sched";
  if (fuIdx === day.idx) return "due";
  // The day itself must have crossed, and at least one working day must have passed.
  // A 2pm follow-up on the 6th is due all of the 6th and overdue on the 7th, and a
  // Sunday follow-up is simply due on Monday.
  return workDaysMissed(fuIdx, day.idx, work) > 0 ? "over" : "due";
}

const REASONS = ["form", "score", "intl", "fresh", "refill", "ifc", "needs", "over", "nofu"];

function reasonsOf(r, timing, opts){
  const scoreMin = (opts && opts.scoreMin) || 6;
  return {
    form: !!(r.forms && r.forms.length),
    score: (r.score || 0) >= scoreMin,
    intl: !!r.intl,
    fresh: r.stage === STAGE_FRESH,
    refill: isRefill(r),
    ifc: r.stage === STAGE_IFC && (timing === "due" || timing === "over"),
    // Nobody is working this lead: it has no owner, or the owner is deactivated. v1 shows
    // these and so must v2, or a whole bucket of work quietly stops existing.
    needs: !!r.needsOwner,
    over: timing === "over",
    nofu: timing === "nofu"
  };
}

const SEC_ACTION = "n";     // needs action today
const SEC_AHEAD = "a";      // has a future follow-up
const SEC_PARKED = "d";     // DNP with no priority signal, held apart on purpose

function sectionOf(r, timing, why){
  const priority = why.form || why.score || why.intl || why.fresh || why.refill;
  // A DNP lead with no priority signal is never presented as today's work and never
  // inflates overdue or no-FU. It gets its own section so the calls made on it are
  // still visible.
  if ((r.stage === STAGE_DNP || r.stage === STAGE_DNP_OTHER) && !priority) return SEC_PARKED;
  if (timing === "sched") return SEC_AHEAD;
  if (timing === "due" || timing === "over" || timing === "nofu" || timing === "newlead") {
    if (priority || why.ifc || timing === "due" || timing === "over" || timing === "nofu" || timing === "newlead") {
      return SEC_ACTION;
    }
  }
  return SEC_AHEAD;
}

function classify(r, day, opts){
  const work = (opts && opts.work) || workDaySet();
  const timing = timingOf(r, day, work);
  const why = reasonsOf(r, timing, opts);
  return {
    id: r.id,
    stage: r.stage,
    sec: sectionOf(r, timing, why),
    t: timing,
    why: why,
    owner: r.owner || "",
    creator: r.creator || "",
    source: r.source || "",
    // Parking buckets and unassigned leads are shown but never counted, exactly as v1
    // treats them. Dropping them from the pool made a real pile of work invisible.
    counted: r.counted !== false,
    fuIdx: r.fu ? istDayIndex(r.fu) : null,
    lateBy: r.fu ? workDaysMissed(istDayIndex(r.fu), day.idx, work) : 0
  };
}

// ---- packing, so a day's base is a few hundred kB rather than a few MB -------------
function pack(c){
  let mask = 0;
  REASONS.forEach(function(k, i){ if (c.why[k]) mask |= (1 << i); });
  return [c.stage, c.sec, c.t, mask, c.owner, c.creator, c.source || "", c.counted === false ? "0" : "1"].join("|");
}
// A base entry is a packed string until something has to change it, after which it is
// a plain object. Every reader goes through this so neither shape can surprise it.
function read(v){ return typeof v === "string" ? unpack(v) : v; }

/* ---- routing done during the day -------------------------------------------------

   A lead nobody was working is shown but not counted: no owner at all, or an owner who
   has left. That is a routing job for a manager, not a call for an agent, so it must
   not sit in the denominator making the floor look slow.

   The moment a manager routes it to a working agent, the job is done and the lead
   becomes real work for whoever now holds it. It enters the totals, and the credit for
   any call on it follows the new owner, because the morning owner was nobody.

   This is the ONLY thing allowed to change after 00:05, and it can only ever ADD. A
   lead counted this morning is never taken out, whatever happens to its owner later,
   because a denominator that can shrink can be gamed. Three things change and nothing
   else: it starts counting, the credit moves, and it stops asking to be routed. Its
   stage row, its section and its timing are exactly as written this morning.

   Parking buckets are untouched: they have a real, working owner, so they were never
   asking to be routed and `needs` was never set on them. They stay out by design. */
function promote(c, cur, opts){
  if (c.counted) return c;                 // never demote
  if (!c.why.needs) return c;              // not a routing case, so not ours to change
  if (!cur || !cur.owner) return c;        // still nobody
  const countable = (opts && opts.countable) || function(){ return true; };
  if (!countable(String(cur.owner))) return c;   // routed to a parking bucket, or to someone else who has left
  return Object.assign({}, c, {
    counted: true, owner: String(cur.owner), promoted: true,
    why: Object.assign({}, c.why, { needs: false })
  });
}

/* A lead whose owner had already left when the list was written should never have been
   counted: nobody was working it, so nobody can be measured on it. Rule 11.

   Locks written before that rule was implemented still carry `counted: true` on those
   leads. This corrects them on read, so a list captured under the old behaviour reports
   the same numbers as one captured under the new. From the next lock it is a no-op.

   It is deliberately narrow. It fires ONLY where the morning list already recorded that
   nobody was working the lead. A lead held by a working agent at 00:05 whose agent is
   deactivated at noon is never demoted, because a denominator that shrinks during the
   day for reasons outside an agent's control is worse than one that is slightly wrong. */
function correctBase(base, opts){
  const countable = (opts && opts.countable) || function(){ return true; };
  const out = {};
  let corrected = 0;
  Object.keys(base).forEach(function(id){
    const c = read(base[id]);
    // needs was set at 00:05: nobody was working this lead when the list was written.
    if (!c.counted || !c.why.needs || !c.owner || countable(c.owner)) { out[id] = base[id]; return; }
    corrected++;
    out[id] = Object.assign({}, c, { counted: false });
  });
  return { base: out, corrected: corrected };
}

/* Applied once, before anything filters or counts, so every number on the page and
   every drill behind it sees the same set. Returns a new base, never mutating the
   stored one, plus how many moved, which the page shows so a denominator that grew
   during the day is visible rather than mysterious. */
function promoteBase(base, liveAll, opts){
  const out = {};
  let promoted = 0;
  Object.keys(base).forEach(function(id){
    const c = read(base[id]);
    if (c.counted || !c.why.needs) { out[id] = base[id]; return; }
    const next = promote(c, (liveAll && liveAll[id]) || null, opts);
    if (next.promoted) { promoted++; out[id] = next; } else { out[id] = base[id]; }
  });
  return { base: out, promoted: promoted };
}

function unpack(v){
  const a = String(v).split("|");
  const mask = parseInt(a[3], 10) || 0;
  const why = {};
  REASONS.forEach(function(k, i){ why[k] = !!(mask & (1 << i)); });
  // a[6] is absent on a list locked by an older build, which is harmless: it reads as
  // no source rather than throwing.
  return { stage: a[0], sec: a[1], t: a[2], why: why, owner: a[4] || "", creator: a[5] || "",
    source: a[6] || "", counted: a[7] !== "0" };
}

/* How hard a lead has actually been worked. Two numbers matter and they answer different
   questions: total attempts in the current stage says whether the lead has had a fair go,
   attempts by the current owner says whether this agent has done their share of it. */
const EFFORT_BANDS = [
  { key: "low",   label: "Barely tried",   min: 0,  max: 3,        cls: "r" },
  { key: "avg",   label: "Some effort",    min: 4,  max: 6,        cls: "a" },
  { key: "bench", label: "At benchmark",   min: 7,  max: 10,       cls: "g" },
  { key: "high",  label: "Over-worked",    min: 11, max: Infinity, cls: "p" }
];
function effortBand(n){
  const v = Math.max(0, n || 0);
  for (let i = 0; i < EFFORT_BANDS.length; i++) {
    if (v >= EFFORT_BANDS[i].min && v <= EFFORT_BANDS[i].max) return EFFORT_BANDS[i];
  }
  return EFFORT_BANDS[EFFORT_BANDS.length - 1];
}
function effortCounts(){
  const o = {};
  EFFORT_BANDS.forEach(function(b){ o[b.key] = 0; });
  return o;
}

// ---- aggregation -------------------------------------------------------------------
const TIMING = ["due", "over", "nofu", "newlead", "sched"];
const COLUMNS = ["form", "score", "intl", "fresh", "refill", "ifc", "needs", "any", "all"];

function hit(c, col){
  if (col === "all") return true;
  if (col === "any") {
    // needsOwner is a reason to act, but on its own it is a routing job rather than a
    // call, so it does not make a lead part of the priority queue by itself.
    return !!(c.why.form || c.why.score || c.why.intl || c.why.fresh || c.why.refill || c.why.ifc);
  }
  return !!c.why[col];
}
function cell(){
  const o = {};
  TIMING.forEach(function(k){ o[k] = 0; o[k + "W"] = 0; });
  COLUMNS.forEach(function(k){ o[k] = 0; o[k + "W"] = 0; });
  return o;
}
function addTo(o, c, worked){
  o[c.t]++; if (worked) o[c.t + "W"]++;
  COLUMNS.forEach(function(k){
    if (!hit(c, k)) return;
    o[k]++; if (worked) o[k + "W"]++;
  });
}

/* One pass over the frozen base. `live` is the current pool by id, used only to ask
   whether the lead has been called today and where it has moved to. The base itself is
   never rewritten, which is what keeps "100 due, 60 worked" honest through the day. */
/* `liveAll` is optional and is the whole pool, not just the qualifying part. A lead that
   leaves the qualifying pool during the day keeps its place on the morning list, so the
   call made on it has to keep its place too. Without this, work disappears. */
function aggregate(base, live, day, stageOrder, liveAll){
  const sections = { n: {}, a: {}, d: {} };
  const totals = { n: cell(), a: cell(), d: cell() };
  const excluded = { n: cell(), a: cell(), d: cell() };
  const move = { called: 0, stage: 0, fu: 0, owner: 0, gone: 0, still: 0 };
  const byAgent = {};
  stageOrder.forEach(function(s){
    sections.n[s] = cell(); sections.a[s] = cell(); sections.d[s] = cell();
  });

  Object.keys(base).forEach(function(id){
    const c = read(base[id]);
    const cur = live[id] || null;
    const seen = cur || (liveAll && liveAll[id]) || null;
    const worked = !!(seen && seen.last >= day.start && seen.last < day.end);
    if (!sections.n[c.stage]) {
      sections.n[c.stage] = cell(); sections.a[c.stage] = cell(); sections.d[c.stage] = cell();
    }
    // Shown but not counted: they appear per agent so the pile is visible, and they are
    // kept out of every headline total so one parking bucket cannot swamp the floor.
    if (c.counted) {
      addTo(sections[c.sec][c.stage], c, worked);
      addTo(totals[c.sec], c, worked);
    } else {
      addTo(excluded[c.sec], c, worked);
    }

    // Accountability follows the morning owner. If a lead is handed over at 4pm the
    // base does not move, so nobody's percentage improves by reshuffling.
    const aid = c.owner || "none";
    if (!byAgent[aid]) byAgent[aid] = { n: cell(), a: cell(), d: cell(), counted: c.counted,
      offBase: 0, offBaseCalls: 0 };
    byAgent[aid].counted = c.counted;
    addTo(byAgent[aid][c.sec], c, worked);

    if (worked) move.called++;
    if (cur && cur.stage !== c.stage) move.stage++;
    if (cur && cur.owner !== c.owner) move.owner++;
    if (!cur) move.gone++;
    if (cur && !worked && cur.stage === c.stage && cur.owner === c.owner) move.still++;
  });

  return { sections: sections, totals: totals, excluded: excluded, movement: move, byAgent: byAgent };
}

/* Work done today on leads that were not in this morning's list at all: created today,
   or moved into the pool. Without this, coverage and effort never reconcile and the
   HubSpot total always looks bigger than the dashboard. */
function offBase(base, liveRows, day){
  const out = [];
  liveRows.forEach(function(r){
    if (base[r.id]) return;
    if (!(r.last >= day.start && r.last < day.end)) return;
    out.push(r);
  });
  return out;
}

var GRP={due:"gA",over:"gA",nofu:"gA",newlead:"gA",sched:"gA",
  form:"gB",score:"gB",intl:"gB",

var HEAT={gA:"47,111,228",gB:"184,121,26",gC:"28,107,78",gD:"90,107,125"};
var GRPHEAD=[["gA","Call today",5],["gB","Priority signals",3],["gC","New information",3],["gD","Totals",3]];

function head(){
  var g="<tr class='grp'><th class='gh'></th>";
  GRPHEAD.forEach(function(x){ g+="<th class='gh "+x[0]+" edge' colspan='"+x[2]+"'>"+x[1]+"</th>"; });
  var h="<tr class='colh'><th>Stage</th>";
  TIMING.concat(COLS).forEach(function(c){
    h+="<th class='n "+GRP[c[0]]+(EDGE[c[0]]?" edge":"")+"'>"+c[1]+"</th>";});
  return "<thead>"+g+"</tr>"+h+"</tr></thead>";}
function cellHtml(c,key,sec,stage,isT,i,mx){
  var on=PICK&&PICK.stage===stage&&PICK.sec===sec&&(isT?PICK.t===key:(PICK.col===key&&!PICK.t));
  var arg=isT?{stage:stage,sec:sec,t:key}:{stage:stage,sec:sec,col:key};
  var cls="cell "+GRP[key]+(EDGE[key]?" edge":"")+(on?" sel":"");
  var tot=c[key],w=c[key+"W"];
  var click=" onclick='pick("+JSON.stringify(arg).replace(/"/g,"&quot;")+")'";
  if(!tot)return "<td class='"+cls+" z'"+click+">0</td>";
  // The heatmap used one fixed blue, which painted straight over the group tint and left
  // only the empty cells showing their colour. Shade in the group's own hue instead, so
  // the band survives the shading.
  var heat=mx&&mx[key]?Math.sqrt(tot/mx[key]):0;
  var rgb=HEAT[GRP[key]]||HEAT.gA;
  var bg=(!on&&heat>0)?" style='background:rgba("+rgb+","+(0.06+0.26*heat).toFixed(3)+")'":"";
  var p=Math.round(100*w/tot);
  return "<td class='"+cls+"'"+bg+click+">"+fmt(tot)+
    "<div class='sub3'><b class='"+(p>=60?"c":(p>0?"d":"m"))+"'>"+fmt(w)+"</b> called &middot; "+p+"%</div></td>";}

  var mx=heats(rows,TIMING.map(function(t){return t[0];}).concat(COLS.map(function(t){return t[0];})),sec);
  return rows.map(function(s){
    var c=s[sec],h="<tr><td>"+chip(s.stage,s.label)+"</td>";
    TIMING.forEach(function(t,i){h+=cellHtml(c,t[0],sec,s.stage,true,i,mx);});
    COLS.forEach(function(t,i){h+=cellHtml(c,t[0],sec,s.stage,false,i,mx);});
    return h+"</tr>";}).join("");}

/* How old the numbers are, in words rather than a timestamp nobody can subtract in
   their head. It reads the incremental sync, not the last full rebuild: the full rebuild
   only happens on a restart, so reporting that made a perfectly healthy ten minute sync
   look like it had been asleep for five hours.

   Amber past twice the sync interval, red past four times or on an error, because at
   that point Reload cannot help and somebody needs to be told. */
function since(t){
  if(!t)return null;
  var m=Math.round((Date.now()-new Date(t).getTime())/60000);
  if(m<1)return "just now";
  if(m===1)return "1 min ago";
  if(m<60)return m+" min ago";
  var h=Math.floor(m/60);
  return h+(h===1?" hour ":" hours ")+(m%60)+" min ago";}

function freshness(){
  if(J.loadedAt==="fixtures")return "<div class='fresh'>made-up test data</div>";
  var every=isCalls?(J.callsEvery||3):(J.syncEvery||10);
  // caughtUpTo is how far through HubSpot's changes we have actually got. leadsAt is only
  // when a run last finished, and a run that finishes having covered nothing still looks
  // healthy by that measure. Prefer coverage; fall back only if it is not reported.
  /* Report the sweep the numbers rest on. Calls are asked for directly, every few
     minutes; the general "what changed" sweep matters for stage and owner moves, which
     do not shift today's counts, so quoting it here would answer a question nobody on
     this page is asking. */
  var basis=J.callsAt||J.caughtUpTo||J.leadsAt;
  var isCalls=!!J.callsAt;
  var mins=basis?Math.round((Date.now()-new Date(basis).getTime())/60000):null;
  var cls=(J.callsError||J.syncError||J.syncOff||(mins!=null&&mins>every*4))?"bad":
          ((mins!=null&&mins>every*2)?"warn":"");
  var msg=J.syncOff?"automatic sync is off"
    :((J.callsError||J.syncError)?"last sync failed":(mins==null?"leads not synced yet":
      (isCalls?"calls up to date as of "+since(basis)
             :(J.caughtUpTo?"up to date as of "+since(basis):"leads "+since(basis)))));
  return "<div class='fresh "+cls+"' title='"+
    (isCalls?"Calls are asked for directly every "+every+" minutes. ":"Leads refresh every "+every+" minutes. ")+
    ". Full rebuild "+(J.fullAt?new Date(J.fullAt).toLocaleTimeString("en-IN"):"not yet")+
    ". Today&#39;s list built "+(J.listBuiltAt?new Date(J.listBuiltAt).toLocaleTimeString("en-IN"):"not yet")+".'>"+
    esc(msg)+
    (J.listBuiltAt?" &middot; list built "+esc(since(J.listBuiltAt)):"")+"</div>";}

  if(r.why.ifc)t.push("<span class='tag p' title='Said interested in future and that date has arrived'>IFC due</span>");
  if(r.why.fresh)t.push("<span class='tag p' title='Brand new, nobody has worked it'>Fresh</span>");
  if(r.source)t.push("<span class='tag src' title='Lead source'>"+esc(srcLabel(r.source))+"</span>");
  if(r.bookTitle)t.push("<span class='tag src' title='Last Topmate booking'>"+esc(String(r.bookTitle).slice(0,30))+"</span>");
  return t.join(" ");
}
/* Re-read one lead from HubSpot on demand.

   The sweep runs every ten minutes and that is usually fine, but an agent who has just
   rung somebody should not have to take the page's word for it, and a manager checking a
   number should be able to settle it in one click. One contact, one call, straight into
   the same place the sweep writes to. */
var RFRESH={};
function refreshLead(id,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  if(RFRESH[id]==="busy")return;
  RFRESH[id]="busy"; draw();
  fetch("/api/callnow2/lead/"+encodeURIComponent(id)+"/refresh",{method:"POST"})
    .then(asJson)
    .then(function(j){
      RFRESH[id]=j.lead&&j.lead.left?"left":"done";
      // Re-read the drill so the row shows what HubSpot just told us, rather than a
      // number patched in by hand that could disagree with the rest of the page.
      loadLeads();
      setTimeout(function(){ if(RFRESH[id]!=="busy"){delete RFRESH[id];draw();} },6000);})
    .catch(function(e){ RFRESH[id]="fail:"+e.message; draw(); });}

function refreshBtn(id){
  var st=RFRESH[id];
  if(st==="busy")return "<span class='rfr busy' title='Asking HubSpot'>\u2026</span>";
  if(st==="done")return "<span class='rfr ok' title='Re-read from HubSpot just now'>\u2713</span>";
  if(st==="left")return "<span class='rfr ok' title='Re-read: this lead no longer qualifies, it keeps its place on today&#39;s list'>\u2713</span>";
  if(st&&st.indexOf("fail:")===0)return "<span class='rfr bad' title='"+esc(st.slice(5))+"'>!</span>";
  return "<button class='rfr' title='Re-read this lead from HubSpot now' onclick='refreshLead("+
    JSON.stringify(id).replace(/"/g,"&quot;")+",event)'>\u21bb</button>";}

    return (r.name+" "+r.creator+" "+r.ownerName).toLowerCase().indexOf(q)>=0;}):L.rows.slice();
  // Already called sinks to the bottom: the top of the list is always what is left.
  // Sorting a column overrides that, because then you asked for a different order.
  if(SORT.k){
    var pick=function(r){
      switch(SORT.k){
        case "name": return String(r.name||"").toLowerCase();
        case "phone": return String(r.phone||"");

        case "days": return r.stageEntered||0;
        default: return 0;
      }};

  } else {
    rows.sort(function(a,b){ return (a.worked?1:0)-(b.worked?1:0); });
  }
  /* An agent works one list: their own. Every column that answers "whose is this" is
     noise on their screen and is what pushed the table off the right edge. They keep
     what they act on; the rest moves into the row expander, so nothing is lost and
     nothing has to be scrolled sideways to reach. */
  var mine=J.scoped&&J.role==="agent";
  var COLDEF=mine
    ? [["","",0],["#","",0],["name","Lead",1],["phone","Phone",1],["","",0],

    : [["","",0],["#","",0],["name","Lead",1],["phone","Phone",1],["","",0],
       ["stage","Stage",1],["why","Why call",0],["fu","Follow-up",1],["last","Last call",1],["","",0],
       ["owner","Agent this morning",1],["creator","Creator",1],
       ["calls","Calls",1],["own","By owner",1],["days","Days",1]];
  h+="<div class='qrow"+(SEL?" open":"")+(mine?" mine":"")+"' id='qrow'><div class='q'><div class='tw'><table><thead><tr>"+
    COLDEF.map(function(c,i){
      var num=(mine?false:i>=12)||i===3;
      if(!c[2])return "<th"+(num?" class='n'":"")+">"+esc(c[1])+"</th>";
      var on=SORT.k===c[0];

        JSON.stringify(c[0]).replace(/"/g,"&quot;")+")'>"+esc(c[1])+
        "<span class='ar'>"+(on?(SORT.d>0?"\u25b2":"\u25bc"):"\u21c5")+"</span></th>";
    }).join("")+"</tr></thead><tbody>";
  rows.forEach(function(r,i){
    var digits=String(r.phone||"").replace(/[^0-9]/g,"");
    var moved=r.movedStage?"<div class='sub3'>now "+esc(STAGE_LABEL[r.nowStage]||r.nowStage)+"</div>":"";
    h+="<tr class='rowlink b-"+esc(r.bandOwner||"low")+(r.worked?" done":"")+(SEL===r.id?" sel":"")+"' onclick='pickLead("+JSON.stringify(r.id).replace(/"/g,"&quot;")+")'>"+
      "<td class='exp' onclick='event.stopPropagation();toggleDet("+JSON.stringify(r.id).replace(/"/g,"&quot;")+")'>"+
        (OPEN[r.id]?"&minus;":"+")+"</td>"+
      "<td class='z'>"+(i+1)+"</td>"+
      "<td>"+(r.worked?"<span class='tick' title='Called today'>&#10003;</span>":"")+
        "<a class='a2' href='"+hsl(r.id)+"' target='_blank' rel='noopener' onclick='event.stopPropagation()'>"+esc(r.name)+" &nearr;</a>"+
        (r.gone?" <span class='tag p' title='Was on this morning list, has since left the tracked pool'>left the list</span>":"")+"</td>"+
      "<td class='n' data-l='Phone'>"+(r.phone?"<span class='ph'>"+esc(r.phone)+"</span>":"<span class='z'>none</span>")+"</td>"+
      "<td>"+(digits?"<a class='wa' href='https://wa.me/"+digits+"' target='_blank' rel='noopener' title='Open WhatsApp' onclick='event.stopPropagation()'>WA</a>":"")+"</td>"+
      "<td data-l='Stage'>"+chip(r.openStage)+moved+"</td>"+
      "<td data-l='Why call'>"+(whyTags(r)||"<span class='z'>–</span>")+"</td>"+
      "<td data-l='Follow-up'>"+tm(r.fu)+"</td><td data-l='Last call'>"+tm(r.last)+"</td>"+
      "<td class='n'>"+refreshBtn(r.id)+"</td>"+
      (mine?"":
        "<td>"+esc(r.ownerName)+(r.ownerInactive?" <span class='tag o'>INACTIVE</span>":"")+
          (r.counted===false?" <span class='tag p'>not counted</span>":"")+"</td>"+
        "<td>"+esc(r.creator||"–")+"</td>"+
        "<td class='n'><b class='"+bandCls(r.band)+"' title='"+bandTitle(r.band)+", counting every agent'>"+fmt(r.calls)+"</b></td>"+
        "<td class='n'><b class='"+bandCls(r.bandOwner)+"' title='"+bandTitle(r.bandOwner)+", this agent only'>"+fmt(r.own)+"</b></td>"+
        "<td class='n'>"+(r.stageEntered?days(r.stageEntered)+"d":"<span class='z'>–</span>")+"</td>")+
      "</tr>";
    if(OPEN[r.id])h+="<tr class='det'><td colspan='14'><div class='detbox'>"+detBody(r)+"</div></td></tr>";
  });
  if(!rows.length)h+="<tr><td colspan='14' class='z'>Nothing matches that search.</td></tr>";
  h+="</tbody></table></div></div>"+leadCard(rows)+"</div></div>";
  return h;}

       (RFRESH[r.id]&&String(RFRESH[r.id]).indexOf("fail:")===0?"Refresh failed, try again":

      "<button class='expbtn' onclick='toggleCard(1)'><span id='cx1'>+</span> AI call summary</button>"+
      "<div id='cb1' hidden class='expbody'>"+(r.aiSummary?esc(r.aiSummary):"<span class='z'>Nothing recorded.</span>")+"</div>"+

function whyBody(r){
  var bits=[];
  bits.push("Sitting in "+esc(STAGE_LABEL[r.openStage]||r.openStage)+
    (r.stageEntered?" for "+days(r.stageEntered)+"d":"")+" &middot; "+fmt(r.calls)+" dial(s) in the stage, "+
    fmt(r.own)+" by this agent");
  if(r.formSubs&&r.formSubs.length)bits.push(formBlock(r.formSubs));
  else if(r.forms&&r.forms.length)bits.push("<b>Form:</b> "+esc(r.forms.join(", ")));
  if(r.bookTitle)bits.push("<b>Last booking:</b> "+esc(r.bookTitle)+(r.bookAt?" on "+esc(tmp(r.bookAt)):""));
  if(r.outcome)bits.push("<b>Last call outcome:</b> "+esc(r.outcome));
  if(r.whyText)bits.push("<b>Why the score:</b> "+esc(r.whyText));
  return bits.join("<br>");}

    .then(function(j){OUTBUSY=false;OUT=j;draw();})
    .catch(function(e){OUTBUSY=false;OUT={error:e.message};draw();});}
function addCreator(u,btn){

    .then(function(j){
      CSYNC=false;

      if(j&&j.truncated)alert("Added "+u+", but only "+fmt(j.added)+" of "+fmt(j.hubspotTotal)+

    .then(function(){OUT=null;load();}).catch(function(e){alert(e.message);});}

// The one number that matters, and how the morning list has moved since midnight.
/* Data quality, stated on the page rather than hidden in a log. Two different questions:
   is this page consistent with itself, and is it consistent with HubSpot. */
// Movement, stated so the parts add to the list. Chips that did not add to anything were
// impossible to check and easy to misread.
function movementTable(){
  var m=J.movement||{}, T=J.totals||{};
  var onList=(T.n.all||0)+(T.a.all||0)+(T.d.all||0)+
    ((J.excluded?J.excluded.n.all+J.excluded.a.all+J.excluded.d.all:0));
  var called=m.called||0, gone=m.gone||0, still=m.still||0;
  var rows=[
    ["Called today", called, "Somewhere on the list"],
    ["Moved stage", m.stage||0, "Still counted where it started"],
    ["Next call date changed", m.fu||0, "Still counted where it started"],
    ["Given to another agent", m.owner||0, "Still credited to this morning's agent"],
    ["Routed to an agent today", J.promoted||0, "Nobody was working it this morning, so it now counts for whoever took it"],
    ["No longer in the list", gone, "Left the tracked pool during the day"],
    ["Nothing happened", still, "Not called, not moved, not reassigned"]
  ];
  return "<div class='sec mini ac ac-move'><h2>What happened to this morning's list</h2>"+
    "<div class='sub'>Every lead that was on the list at midnight, and what has become of it. "+
    "A lead can appear in more than one row: it can be called and also move stage.</div>"+
    "<div class='tw'><table><thead><tr><th>Since midnight</th><th class='n'>Leads</th><th>Note</th></tr></thead><tbody>"+
    rows.map(function(r){
      return "<tr><td>"+esc(r[0])+"</td><td class='n'><b>"+fmt(r[1])+"</b></td>"+
        "<td class='mut'>"+esc(r[2])+"</td></tr>";}).join("")+
    "<tr class='tot'><td><b>On the list at midnight</b></td><td class='n'><b>"+fmt(onList)+
    "</b></td><td class='mut'>Nothing joins after the lock</td></tr>"+
    "</tbody></table></div>"+
    (J.offBase&&J.offBase.leads?"<div class='sub' style='margin-top:8px'><b>"+fmt(J.offBase.leads)+
      "</b> more leads were called today that were never on this list. They are in the fourth card above.</div>":"")+
    "</div>";}

/* The pool a manager can hand out: fresh leads nobody is working, split by creator.

   Not scoped by agent, because these leads have no agent. A manager sees the creators
   mapped to their team, a VP sees the floor, an agent sees nothing: assigning is not
   their job and the list would only be noise to them. */
function assignPanel(){
  if(J.scoped&&J.role==="agent")return "";
  var a=ASSIGN;
  if(!a||!a.allowed)return "";
  var t=a.totals||{unassigned:0,left:0,total:0,assignedToday:0};
  if(!t.total&&!t.assignedToday)return "";
  var rows=a.rows||[];
  var h="<div class='sec mini ac ac-pool'><h2>Fresh leads waiting to be assigned</h2>"+
    "<div class='sub'>Fresh leads on this morning's list that nobody is working: no owner at all, "+
    "or an owner who has left. They are shown everywhere but counted nowhere until somebody takes them, "+
    "so this is the pool to hand out from. Split by creator."+
    (a.scoped?" Your team's creators only.":"")+"</div>"+
    "<div class='tw' style='max-height:300px'><table><thead><tr>"+
    "<th>Creator</th><th class='n'>No owner</th><th class='n'>Owner left</th>"+
    "<th class='n'>To assign</th><th class='n'>Done today</th></tr></thead><tbody>";
  rows.forEach(function(r){
    h+="<tr><td>"+esc(r.u)+
      (r.holders&&r.holders.length?"<div class='mut' style='font-size:11px' title='held by "+
        esc(r.holders.map(function(x){return x.name+" ("+x.n+")";}).join(", "))+"'>held by "+
        r.holders.slice(0,3).map(function(x){return esc(x.name)+" ("+fmt(x.n)+")";}).join(", ")+
        (r.holders.length>3?" and "+fmt(r.holders.length-3)+" more":"")+"</div>":"")+"</td>"+
      "<td class='n'>"+fmt(r.unassigned)+"</td>"+
      "<td class='n'>"+fmt(r.left)+"</td>"+
      "<td class='n'><b>"+fmt(r.total)+"</b></td>"+
      "<td class='n "+(r.assignedToday?"":"mut")+"'>"+(r.assignedToday?fmt(r.assignedToday):"\u2013")+"</td></tr>";
  });
  h+="<tr class='tot'><td><b>All creators</b></td><td class='n'><b>"+fmt(t.unassigned)+
    "</b></td><td class='n'><b>"+fmt(t.left)+"</b></td><td class='n'><b>"+fmt(t.total)+
    "</b></td><td class='n'><b>"+(t.assignedToday?fmt(t.assignedToday):"\u2013")+"</b></td></tr>";
  h+="</tbody></table></div>"+
    "<div class='sub' style='margin:8px 0 0'>The moment one of these is given to a working agent it "+
    "starts counting, and the calls on it are credited to that agent. Assigned today shows how many "+
    "have already moved.</div></div>";
  return h;}

function quality(){
  if(!J.isVP)return "";
  var c=J.checks, d=J.drift;
  if(!c&&!d)return "";
  var bad=c?c.checks.filter(function(x){return !x.ok;}):[];
  var h="";
  if(bad.length){
    h+="<div class='warn' style='border-color:#D98080;background:#FDECEA;color:#8C2D12'>"+
      "<b>These numbers do not add up.</b> "+fmt(bad.length)+" internal check"+(bad.length>1?"s":"")+" failed, so "+
      "treat this page as broken until it is fixed:<ul style='margin:6px 0 0 18px;padding:0'>"+
      bad.map(function(x){return "<li>"+esc(x.label)+(x.detail?" &mdash; "+esc(x.detail):"")+"</li>";}).join("")+
      "</ul></div>";
  }
  if(d&&d.level!=="ok"){
    h+="<div class='warn'>HubSpot has <b>"+fmt(d.hubspot)+"</b> leads called today, this app can see <b>"+
      fmt(d.ours)+"</b>, a gap of "+d.pct+"%. Some gap is expected, this page only holds tracked creators and "+
      "certain stages, but "+(d.level==="bad"?"this is large enough to be worth checking":"it is drifting")+
      ". Checked "+new Date(d.at).toLocaleTimeString("en-IN")+
      (d.leadsSyncedAt?" &middot; leads last updated "+new Date(d.leadsSyncedAt).toLocaleTimeString("en-IN"):"")+".</div>";
  }
  return h;}
function qualityPanel(){
  if(!J.isVP)return "";
  var c=J.checks;
  if(!c)return "";
  var d=J.drift;
  var h="<div class='sec mini'><h2>Data quality "+
    "<span class='tag "+(c.ok?"s":"o")+"' style='margin-left:6px'>"+(c.ok?"all clear":"failing")+"</span></h2>"+
    "<div class='sub'>These run on every build of this page, not when someone remembers to check. "+
    "A number that is quietly wrong is worse than a page that is visibly broken.</div>"+
    "<div class='tw'><table><thead><tr><th></th><th>What is checked</th><th>Detail</th></tr></thead><tbody>"+
    c.checks.map(function(x){
      return "<tr><td style='width:26px'>"+(x.ok?"<span class='tick'>&#10003;</span>":
        "<span class='tag o'>fail</span>")+"</td><td>"+esc(x.label)+"</td>"+
        "<td class='mut' style='white-space:normal'>"+esc(x.detail||"")+"</td></tr>";}).join("")+
    (d?"<tr><td style='width:26px'>"+(d.level==="ok"?"<span class='tick'>&#10003;</span>":"<span class='tag o'>"+d.pct+"%</span>")+
      "</td><td>Agrees with HubSpot on how many were called today</td>"+
      "<td class='mut' style='white-space:normal'>HubSpot "+fmt(d.hubspot)+", this app "+fmt(d.ours)+
      ". Checked "+new Date(d.at).toLocaleTimeString("en-IN")+"</td></tr>":"")+
    "</tbody></table></div>"+
    "<div class='sub' style='margin-top:8px'>Checked at "+new Date(c.at).toLocaleTimeString("en-IN")+
    ". For the full accounting of every call HubSpot logged today, use <b>Check what is outside</b> above.</div></div>";
  return h;}

function hero(){
  var T=J.totals||{}, off=(J.offBase&&J.offBase.leads)||0;
  // One card per group. Numerator is what was called today, denominator is what the list
  // locked with. Same population top and bottom, every time.
  var card=function(cls,label,sec,note,extra){
    var c=T[sec]||{}, pool=c.all||0, done=c.allW||0;
    var p=pool?Math.round(100*done/pool):0;
    return "<div class='hcard "+cls+"'><div class='k'>"+label+"</div>"+
      "<div class='big'>"+fmt(done)+"<span class='of'>/ "+fmt(pool)+"</span>"+
      "<span class='pctpill'>"+p+"%</span></div>"+
      "<div class='track'><i style='width:"+p+"%'></i></div>"+
      (extra||"<div class='foot'>"+note+"</div>")+"</div>";};
  /* The headline card carries its own breakdown. "8 of 2,432" tells an agent nothing
     about where to start; due today at 10 of 50 and overdue at 3 of 1,200 tells them
     exactly that, and it is the same arithmetic split four ways rather than a new
     number to reconcile. */
  var split=function(){
    var c=T.n||{};
    var parts=[["due","Due today"],["over","Overdue"],["nofu","No FU"],["newlead","Fresh"]];
    var rows=parts.filter(function(p){ return (c[p[0]]||0)>0; }).map(function(p){
      var tot=c[p[0]]||0, did=c[p[0]+"W"]||0;
      var pc=tot?Math.round(100*did/tot):0;
      return "<div class='hsplit'><span class='l'>"+p[1]+"</span>"+
        "<span class='v'><b>"+fmt(did)+"</b>/"+fmt(tot)+"</span>"+
        "<span class='t'><i style='width:"+pc+"%'></i></span></div>";});
    return rows.length?"<div class='hsplits'>"+rows.join("")+"</div>":"";};

  var h="<div class='herorow'>"+
    card("h1","Call today","n","Due today, overdue, no FU, fresh",split())+
    card("h2","Booked for a later date","a","Called anyway, not owed today")+
    card("h3","DNPs","d","Called anyway, nothing asked for")+
    "<div class='hcard h4'><div class='k'>Outside the list</div>"+
    "<div class='big'>"+fmt(off)+"</div>"+
    "<div class='track'><i style='width:0%'></i></div>"+
    "<div class='foot'>Calls today on leads the list did not hold</div></div>"+
    "</div>";
  return h;}

/* The fine print about the list, kept apart from the cards so the view tabs can sit
   between them, right under Call today where the choice belongs. */
function lockNote(){
  return "<div class='hnote'>"+
    (J.frozen?("Locked "+new Date(J.frozenAt).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})+
      " with "+fmt(J.baseSize)+" leads. "):"List not locked yet. ")+
    "The list is fixed at midnight, so these move only because of what the floor did today."+
    "</div>";}

/* A strip, not a card. In a card the tabs took one line and their description took
   another, right aligned, which left a band of white between them for no reason. On one
   line the description is a caption to the choice, which is what it is. */
function viewTabs(){
  var note=VIEW==="matrix"?"Every stage against every reason to call":
           VIEW==="queue"?"The leads themselves, worst first":
           "One card per stage, click a line to open those leads";
  return "<div class='viewstrip'><span class='seg'>"+
    ["matrix","queue","board"].map(function(v){
      var lbl=v.charAt(0).toUpperCase()+v.slice(1);
      return "<button class='"+(VIEW===v?"on":"")+"' onclick='setView(\""+v+"\")'>"+lbl+"</button>";
    }).join("")+"</span><span class='vnote' title='"+esc(note)+"'>"+esc(note)+"</span></div>";}

// One card per stage. Clicking a line opens those leads in the queue.
function boardView(){
  var rows=J.stages.filter(function(s){return s.n.all>0;});
  if(!rows.length)return "<div class='sec mini'><div class='z'>Nothing to call today.</div></div>";
  var cards=rows.map(function(s){
    var c=s.n, t=c.due+c.over+c.nofu+c.newlead||1;
    var seg=function(k,label,cls,v){
      return "<div class='brk' onclick='pick({stage:"+JSON.stringify(s.stage).replace(/"/g,"&quot;")+
        ",sec:\"n\",t:"+JSON.stringify(k).replace(/"/g,"&quot;")+"})'><span class='sw "+cls+"'></span>"+
        label+"<span class='v'>"+fmt(v)+"</span></div>";};
    return "<div class='bcard'><div class='top'>"+chip(s.stage,s.label)+
      "<span class='instage'>"+fmt(c.all)+" in stage</span></div>"+
      "<div class='h2n'>"+fmt(c.any)+"<span>any priority</span></div>"+
      "<div class='stack'><i class='s1' style='width:"+(100*c.due/t)+"%'></i>"+
      "<i class='s2' style='width:"+(100*c.over/t)+"%'></i>"+
      "<i class='s3' style='width:"+(100*(c.nofu+c.newlead)/t)+"%'></i></div>"+
      seg("due","Due today","s1",c.due)+seg("over","Overdue","s2",c.over)+
      seg("nofu","No follow-up","s3",c.nofu)+
      "<div class='brk' onclick='pick({stage:"+JSON.stringify(s.stage).replace(/"/g,"&quot;")+
        ",sec:\"n\",col:\"score\"})'><span class='sw s4'></span>Score &ge;6<span class='v'>"+fmt(c.score)+"</span></div>"+
      "</div>";}).join("");
  return "<div class='sec'><h2>Board view</h2>"+
    "<div class='sub'>One card per stage. The bar splits what is due today, what is overdue and what has no next step. "+
    "Click any line to open those leads.</div><div class='board'>"+cards+"</div></div>";}

/* The same effort question asked of a stage and of a creator.

   A per-agent list answers "who is not trying". It cannot answer "which stage is
   everyone stalling in" or "whose leads are these", and those have different fixes: a
   stage where everything is barely tried is a process problem, one creator's leads
   barely tried is a routing or a lead quality problem.

   Counted leads only, so this ties to the headline totals. The agent table below
   deliberately carries the parking buckets too, which is why the two do not sum. */
var SUMBY="stage", SUMOPEN={};
function setSumBy(v){ SUMBY=v; SUMOPEN={}; draw(); }
function togSum(k){ SUMOPEN[k]=!SUMOPEN[k]; draw(); }

function bandCells(e,B,go){
  var t=B.reduce(function(x,b){return x+e[b.key];},0);
  var h=B.map(function(b){
    var n=e[b.key];
    return "<td class='n cell bd-"+b.key+(n?"":" z")+"' onclick='"+go(b.key)+"'>"+
      (n?"<b class='"+b.cls+"'>"+fmt(n)+"</b>":"0")+"</td>";}).join("");
  var pc=t?Math.round(100*e.low/t):0;
  return h+"<td class='n'><b class='"+(pc>=70?"m":(pc>=40?"d":"c"))+"'>"+pc+"%</b></td>";}

function summaryPanel(){
  if(J.scoped&&J.role==="agent")return "";
  if(!A)return "";
  var B=A.effortBands||J.effortBands;
  if(!B)return "";
  var byStage=SUMBY==="stage";
  var rows=((byStage?A.byStage:A.byCreator)||[]).filter(function(r){return r.n>0;});
  if(!rows.length)return "";
  var range=function(b){ return b.max==null?(b.min+"+"):(b.min+" to "+b.max); };
  var q=function(o){ return "pick("+JSON.stringify(o).replace(/"/g,"&quot;")+")"; };
  var esq=function(v){ return esc(String(v)).replace(/'/g,"\\'"); };

  var h="<div class='sec mini ac ac-eff'><h2>Where the effort is going</h2>"+
    "<div class='sub'>Of the leads that need a call today, how hard each one has been worked. "+
    "By stage tells you where the floor stalls; by creator tells you whose leads are being left. "+
    (byStage?"Click a row to split it by agent. ":"Click a creator to scope the page to them. ")+
    "Click any number for those leads. Counted leads only, so it ties to the totals above.</div>"+
    "<div class='chips' style='margin-bottom:9px'>"+
    "<button class='chipb"+(byStage?" on":"")+"' onclick='setSumBy(\"stage\")'>By stage</button>"+
    "<button class='chipb"+(byStage?"":" on")+"' onclick='setSumBy(\"creator\")'>By creator</button>"+
    "<button class='chipb"+(CHURN_BY==="owner"?" on":"")+"' onclick='setChurnBy(\"owner\")'>By the agent who holds it</button>"+
    "<button class='chipb"+(CHURN_BY==="total"?" on":"")+"' onclick='setChurnBy(\"total\")'>By anyone, in the stage</button>"+
    "</div>"+
    "<div class='tw scrolly'><table><thead><tr>"+
    "<th>"+(byStage?"Stage":"Creator")+"</th><th class='n'>Call today</th>"+
    B.map(function(b){return "<th class='n bd bd-"+b.key+"'>"+esc(b.label)+
      "<div class='sub3'>"+range(b)+"</div></th>";}).join("")+
    "<th class='n'>Barely tried</th></tr></thead><tbody>";

  var tot={n:0}; B.forEach(function(b){tot[b.key]=0;});
  rows.forEach(function(r){
    var e=r.effort[CHURN_BY];
    tot.n+=r.n; B.forEach(function(b){tot[b.key]+=e[b.key];});
    var key=byStage?r.stage:r.u, open=!!SUMOPEN[key];
    h+="<tr class='rowlink'>"+
      "<td onclick=\""+(byStage?"togSum(&#39;"+esq(key)+"&#39;)":"Q.creator=&#39;"+esq(key)+"&#39;;load()")+"\">"+
      (byStage?"<span class='car'>"+(open?"\u25be":"\u25b8")+"</span>":"")+
      esc(byStage?(r.label||r.stage):r.u)+"</td>"+
      "<td class='n'>"+fmt(r.n)+"</td>"+
      bandCells(e,B,function(bk){
        return byStage ? q({stage:r.stage,band:bk,bandBy:CHURN_BY,sec:"n"})
                       : "Q.creator=&#39;"+esq(r.u)+"&#39;;load()";})+
      "</tr>";
    if(byStage&&open){
      var ag=(r.agents||[]).filter(function(x){return x.n>0;});
      if(!ag.length)h+="<tr class='sub2'><td colspan='"+(B.length+3)+"' class='mut'>No agent holds any of these.</td></tr>";
      ag.forEach(function(x){
        h+="<tr class='sub2'><td>"+esc(x.name)+"</td><td class='n'>"+fmt(x.n)+"</td>"+
          bandCells(x.effort[CHURN_BY],B,function(bk){
            return q({stage:r.stage,agent:x.id,band:bk,bandBy:CHURN_BY,sec:"n"});})+"</tr>";});
    }
  });
  var tt=B.reduce(function(x,b){return x+tot[b.key];},0);
  var tpc=tt?Math.round(100*tot.low/tt):0;
  h+="<tr class='tot'><td><b>All "+(byStage?"stages":"creators")+"</b></td><td class='n'><b>"+fmt(tot.n)+"</b></td>"+
    B.map(function(b){return "<td class='n bd-"+b.key+"'><b>"+fmt(tot[b.key])+"</b></td>";}).join("")+
    "<td class='n'><b>"+tpc+"%</b></td></tr>";
  return h+"</tbody></table></div></div>";}

function churnPanel(){
  // A manager coaches on this; an agent should be working their list, not ranking
  // themselves against it. Same reason they do not get the agent table.
  if(J.scoped&&J.role==="agent")return "";
  if(!A||!A.agents||!A.agents.length)return "";
  var B=A.effortBands||J.effortBands;
  if(!B)return "";
  var rows=A.agents.filter(function(a){return a.n.all>0;});
  if(!rows.length)return "";
  var range=function(b){ return b.max==null?(b.min+"+"):(b.min+" to "+b.max); };
  var share=function(a){
    var e=a.effort[CHURN_BY],t=B.reduce(function(x,b){return x+e[b.key];},0);
    return t?e.low/t:0;};
  // Working agents first, worst churn at the top, then parking buckets, then anyone
  // deactivated. A deactivated agent's untouched pile is a reassignment job, not a
  // coaching conversation, so it must not head the list.
  var rank=function(a){ return (a.active?0:2)+(a.counted?0:1); };
  rows=rows.slice().sort(function(x,y){
    return rank(x)-rank(y) || share(y)-share(x) || y.n.all-x.n.all; });
  var h="<div class='sec mini ac ac-churn'><h2>Lead churn effort</h2>"+
    "<div class='sub'>Of the leads each agent is holding that need a call today, how many have barely been tried. "+
    "Sorted worst first. <b>By the agent who holds it</b> is the accountable number; <b>by anyone</b> tells you whether "+
    "the lead has had a go at all, which is how an inherited lead is told from a neglected one. Click any number for those leads.</div>"+
    "<div class='chips' style='margin-bottom:9px'>"+
    "<button class='chipb"+(CHURN_BY==="owner"?" on":"")+"' onclick='setChurnBy(\"owner\")'>By the agent who holds it</button>"+
    "<button class='chipb"+(CHURN_BY==="total"?" on":"")+"' onclick='setChurnBy(\"total\")'>By anyone, in the stage</button>"+
    "</div>"+
    "<div class='tw scrolly'><table><thead><tr><th>Agent</th><th class='n'>Call today</th>"+
    B.map(function(b){return "<th class='n bd bd-"+b.key+"'>"+esc(b.label)+
      "<div class='sub3'>"+range(b)+"</div></th>";}).join("")+
    "<th class='n'>Barely tried</th></tr></thead><tbody>";
  h+=rows.map(function(a){
    var e=a.effort[CHURN_BY];
    var t=B.reduce(function(x,b){return x+e[b.key];},0);
    var pc=t?Math.round(100*e.low/t):0;
    var flag=pc>=70?"m":(pc>=40?"d":"c");
    return "<tr class='rowlink"+(Q.agent===a.id?" on":"")+"'>"+
      "<td onclick=\"Q.agent='"+esc(a.id)+"';load()\">"+esc(a.name)+
        (a.counted?"":" <span class='tag p'>not counted</span>")+
        (a.active?"":" <span class='tag o'>INACTIVE</span>")+
        (a.team?"<div class='sub3'>"+esc(a.team)+"</div>":"")+"</td>"+
      "<td class='n'>"+fmt(a.n.all)+"</td>"+
      B.map(function(b){
        var n=e[b.key];
        var on=PICK&&PICK.band===b.key&&PICK.bandBy===CHURN_BY&&PICK.agent===a.id;
        if(!n)return "<td class='n cell z bd-"+b.key+"' onclick='pick({band:"+JSON.stringify(b.key).replace(/"/g,"&quot;")+
          ",bandBy:"+JSON.stringify(CHURN_BY).replace(/"/g,"&quot;")+",agent:"+JSON.stringify(a.id).replace(/"/g,"&quot;")+",sec:\"n\"})'>0</td>";
        return "<td class='n cell bd-"+b.key+(on?" sel":"")+"' onclick='pick({band:"+JSON.stringify(b.key).replace(/"/g,"&quot;")+
          ",bandBy:"+JSON.stringify(CHURN_BY).replace(/"/g,"&quot;")+",agent:"+JSON.stringify(a.id).replace(/"/g,"&quot;")+",sec:\"n\"})'>"+
          "<b class='"+b.cls+"'>"+fmt(n)+"</b></td>";}).join("")+
      "<td class='n'><b class='"+flag+"'>"+pc+"%</b></td></tr>";}).join("");
  return h+"</tbody></table></div></div>";}

var ASORT={k:"",d:1};
function aHead(k,label,cls){
  var on=ASORT.k===k;
  return "<th class='"+cls+" sortable"+(on?" on":"")+"' onclick='aSort("+
    JSON.stringify(k).replace(/"/g,"&quot;")+")'>"+esc(label)+
    "<span class='ar'>"+(on?(ASORT.d>0?"\u25b2":"\u25bc"):"\u21c5")+"</span></th>";}
function aSort(k){ if(ASORT.k===k)ASORT.d=-ASORT.d; else {ASORT.k=k;ASORT.d=1;} draw(); }
function agentTable(){
  if(!A||!A.agents||!A.agents.length)return "";
  var mx=0; A.agents.forEach(function(a){ if(a.n.all>mx)mx=a.n.all; });
  // Working agents first, then parking buckets, then anyone deactivated. A deactivated
  // agent's pile is a reassignment job, not a calling job, so it does not belong on top.
  var list=A.agents.slice().sort(function(x,y){
    var rx=(x.active?0:2)+(x.counted?0:1), ry=(y.active?0:2)+(y.counted?0:1);
    return rx-ry || y.n.all-x.n.all;
  });
  var h="<div class='sec mini ac ac-agent'><h2>Today's calling list by agent</h2>"+
    "<div class='sub'>Every lead on today's list, split by whoever held it this morning. Click a row to scope the whole page to that agent. "+
    "Rows marked <b>not counted</b> are parking buckets, shown for visibility but left out of every total above.</div>"+
    "<div class='tw scrolly'><table><thead><tr>"+
    aHead("name","Agent","")+aHead("all","Call today","n")+
    aHead("due","Due today","n gA edge")+aHead("over","Overdue","n gA")+aHead("nofu","No FU","n gA")+
    aHead("newlead","Fresh","n gA")+
    aHead("form","Form","n gB edge")+aHead("score","Score","n gB")+aHead("intl","Intl","n gB")+
    aHead("refill","Refilled","n gB")+
    aHead("called","Called","n")+aHead("later","Booked later","n")+aHead("dnp","DNP","n")+
    "</tr></thead><tbody>";
  var pill=function(v,cls){ return v?"<span class='pill"+(cls||"")+"'>"+fmt(v)+"</span>":"<span class='z'>0</span>"; };
  if(ASORT.k){
    var av=function(a){
      if(ASORT.k==="name")return String(a.name||"").toLowerCase();
      if(ASORT.k==="called")return a.n.dueW||0;
      if(ASORT.k==="later")return a.a.all||0;
      if(ASORT.k==="dnp")return a.d.all||0;
      return a.n[ASORT.k]||0;};
    list=list.slice().sort(function(x,y){
      var p=av(x),q=av(y); if(p<q)return -ASORT.d; if(p>q)return ASORT.d; return 0;});
  }
  list.forEach(function(a){
    var w=mx?Math.round(56*a.n.all/mx):0;
    var miss=a.n.due-a.n.dueW;
    h+="<tr class='rowlink"+(Q.agent===a.id?" on":"")+"' onclick=\"Q.agent='"+esc(a.id)+"';load()\">"+
      "<td>"+esc(a.name)+
        (a.counted?"":" <span class='tag p'>not counted</span>")+
        (a.active?"":" <span class='tag o'>INACTIVE</span>")+
        (a.team?"<div class='sub3'>"+esc(a.team)+"</div>":"")+"</td>"+
      "<td class='n'><span class='mbar' style='width:"+w+"px'></span><b>"+fmt(a.n.all)+"</b>"+
        "<div class='sub3'><b class='"+(a.n.allW?"c":"m")+"'>"+fmt(a.n.allW)+"</b> called</div></td>"+
      "<td class='n gA edge'>"+fmt(a.n.due)+"</td>"+
      "<td class='n gA'>"+pill(a.n.over)+"</td>"+
      "<td class='n gA'>"+pill(a.n.nofu," w")+"</td>"+
      "<td class='n gA'>"+fmt(a.n.newlead)+"</td>"+
      "<td class='n gB edge'>"+fmt(a.n.form)+"</td>"+
      "<td class='n gB'>"+fmt(a.n.score)+"</td>"+
      "<td class='n gB'>"+fmt(a.n.intl)+"</td>"+
      "<td class='n gB'>"+fmt(a.n.refill)+"</td>"+
      "<td class='n'>"+(miss>0?pill(miss)+"<div class='sub3'>missed of "+fmt(a.n.due)+" due</div>":fmt(a.n.dueW))+"</td>"+
      "<td class='n'>"+fmt(a.a.all)+"</td>"+
      "<td class='n'>"+fmt(a.d.all)+"</td></tr>";
  });
  return h+"</tbody></table></div></div>";}
function draw(){
  var el=document.getElementById("app");
  if(!J)return;
  if(J.error){
    var pr=J.progress,bar2="";
    if(pr&&pr.agents){var pcv=Math.round(100*pr.agentsDone/pr.agents);
      bar2="<div style='margin-top:9px'><div style='height:7px;background:#EFD3AE;border-radius:4px;overflow:hidden'>"+
        "<i style='display:block;height:7px;width:"+pcv+"%;background:#B8791A'></i></div>"+
        "<div style='margin-top:5px;font-size:11.5px'>"+(pr.phase?esc(pr.phase)+": ":"")+
        pr.agentsDone+" of "+pr.agents+" agents fetched &middot; "+
        fmt(pr.leadsSoFar)+" leads so far"+(pr.syncError?" &middot; error: "+esc(pr.syncError):"")+"</div></div>";}
    el.innerHTML="<div class='warn'>"+esc(J.error)+(J.building?" Checking again every fifteen seconds.":"")+
      (J.retry?" <button class='btn' onclick='load()'>Try again</button>":"")+
      (J.building&&J.isVP?" <button class='btn' onclick='rebuild(this)'>Build it now</button>":"")+bar2+"</div>";
    return;}
  var fx=document.getElementById("fxtag");
  if(fx)fx.innerHTML=(J.fixtures?"<span class='mebadge'>test data, not real</span>":"")+
    (J.scoped?"<span class='mebadge'>your leads</span>":"");
  var sub=document.getElementById("sub");
  if(sub&&J.scoped)sub.textContent="Your calling list, locked at midnight. It does not change during the day, so what you work against is fixed.";
  var nav=document.getElementById("vpnav");
  if(nav)nav.style.display=J.isVP?"flex":"none";
  // Four full width bars stacked on top of each other pushed the tables below the fold.
  // Two columns instead: controls on the left, the state of today's list on the right.
  // A VP gets the machinery: what the list is, what is held aside, how it compares to v1,
  // whether it adds up, and what is outside it. A manager or agent gets the work.
  /* Short cards flow in columns so a tall neighbour cannot leave a hole beside a short
     one. The wide tables sit below at full width, where they belong. */
  /* Left: what the list is and what has happened to it, which is one long story.
     Right: the two piles that are not in the totals, held aside and waiting to be
     assigned, which belong beside each other and fill the space the story leaves. */
  /* ---- four bands ----------------------------------------------------------------

     The page used to be eleven cards of equal weight in one long scroll, with the
     filters buried below the summaries, so you scrolled past the analysis to reach the
     control that changes it. One rule now: the work goes above the explanation of it.

       1  where today stands      hero cards, one strip
       2  controls                filters, stages, owner, views, pinned while you scroll
       3  the work                matrix, queue or board
       4  behind the numbers      every explanatory card, folded away until asked for

     Nothing was deleted; the cards below the fold are the same cards. */
  /* The head band: four cards two by two on the left, the controls beside them on the
     right. Four cards in a row were a full screen width of chrome for four numbers, and
     the filters sat under all of it. Side by side, the band is about half as tall and
     everything below it gets that height back. */
  /* The controls sit two abreast: the dropdowns on the left, the stage and owner chips
     on the right, with the view tabs underneath spanning both. Stacked, those three
     blocks were taller than the four cards beside them and left a hole under the cards;
     side by side they finish level and the tables start higher up the page.

     An agent gets neither chip row: the matrix already is their stage filter, and they
     only ever hold their own leads, so the owner row filters on a question they cannot
     answer. Their controls take the full width on their own. */
  var mineOnly=J.scoped&&J.role==="agent";
  /* The view tabs sit under Call today, not under the filters. Choosing between matrix,
     queue and board is the first decision after reading the headline, and it was three
     blocks away on the far side of the band.

     The band does not stick. Pinning it kept the filters in reach and cost a fifth of a
     laptop screen all the way down a long table, which is the wrong trade on the page
     people scroll most. */
  /* Three columns, not two with a grid inside one of them. Nesting meant the two inner
     blocks sized against each other rather than against the cards, so one of the three
     always finished short and left a band of white under it. As siblings they stretch to
     one height and the band has no hole in it. */
  var h=quality()+
    "<div class='headband"+(mineOnly?" solo":"")+"'>"+
      "<div class='heroside'>"+hero()+viewTabs()+lockNote()+"</div>"+
      barTop()+
      (mineOnly?"":barChips())+
    "</div>"+segNote();
  var matrix="";
  SECS.forEach(function(s,i){
    var last=i===SECS.length-1;
    matrix+="<div class='sec mini'><h2>"+s[1]+"</h2><div class='sub'>"+s[2]+"</div>"+
      "<div class='tw'><table>"+head()+"<tbody>"+body(s[0])+
      (J.stages.filter(function(x){return x[s[0]].all>0;}).length>1
        ? totRow(s[1],[J.totals[s[0]]],s[0],"sub") : "")+
      (last?totRow("Everything added up",[J.totals.n,J.totals.a,J.totals.d],"","grand"):"")+
      "</tbody></table></div></div>";});
  /* Stage and creator first: a manager reads the shape of the day before the names.
     The VP-only cards are NOT repeated here. They live in the block at the top of the
     page, and rendering them again drew every one of them twice. */
  h+="<div class='view"+(VIEW==="matrix"?" on":"")+"'>"+matrix+"</div>"+
     "<div class='view"+(VIEW==="queue"?" on":"")+"'>"+queueView()+"</div>"+
     "<div class='view"+(VIEW==="board"?" on":"")+"'>"+boardView()+"</div>";
  h+=behind();
  el.innerHTML=h;}

/* Everything that explains the numbers rather than being the numbers, in the order a
   manager asks for it, folded away so it cannot compete with the work. Open state is
   remembered, so someone who lives in these cards is not made to click every morning. */
var BEHIND=(function(){try{return localStorage.getItem("cn2_behind")==="1";}catch(e){return false;}})();
function toggleBehind(){BEHIND=!BEHIND;try{localStorage.setItem("cn2_behind",BEHIND?"1":"0");}catch(e){}draw();
  if(BEHIND)setTimeout(function(){var el=document.getElementById("behind");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},60);}

function behind(){
  var isAgent=J.scoped&&J.role==="agent";
  var cards=[];
  if(!isAgent){
    cards.push(["Effort and churn","<div class='vpwide'>"+summaryPanel()+churnPanel()+agentTable()+"</div>"]);
  }
  // movementTable and baseNote have no gate of their own: they were only ever drawn
  // inside a VP-only branch. The fold must keep that, or opening it hands a manager
  // machinery that was deliberately kept from them.
  var flow=[J.isVP?movementTable():"",J.isVP?baseNote():"",excludedNote(),assignPanel()].filter(Boolean);
  if(flow.length)cards.unshift(["Today's list",
    "<div class='vpflow'><div class='vpcol'>"+flow.filter(function(_,i){return i%2===0;}).join("")+"</div>"+
    "<div class='vpcol'>"+flow.filter(function(_,i){return i%2===1;}).join("")+"</div></div>"]);
  var extra=[qualityPanel(),creatorPanel()].filter(Boolean);
  if(extra.length)cards.push(["Data quality and tracked creators","<div class='vpwide'>"+extra.join("")+"</div>"]);
  if(!cards.length)return "";
  var n=cards.length;
  var h="<div id='behind' class='behind"+(BEHIND?" on":"")+"'>"+
    "<button class='behindbtn' onclick='toggleBehind()'>"+
    "<span class='car'>"+(BEHIND?"\u25be":"\u25b8")+"</span> Behind the numbers"+
    "<span class='mut'> &middot; "+n+" section"+(n>1?"s":"")+": how today's list was built, what is held aside, where the effort went</span>"+
    "</button>";
  if(BEHIND)h+="<div class='behindbody'>"+cards.map(function(c){
    return "<h3 class='behindh'>"+esc(c[0])+"</h3>"+c[1];}).join("")+"</div>";
  return h+"</div>";}
load();
setInterval(function(){if(!LOADING&&!LEADS)load();},10*60*1000);

</script>
