<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call Now v2</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F7FA;color:#0A2540;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.hdr{background:#0A2540;padding:13px 22px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.hdr h1{font-size:17px;font-weight:600;color:#fff;letter-spacing:-.01em}
.hdr p{font-size:12.5px;color:#93A7BC}
.hdr a{color:#8FD3E4 !important}
.hdr a:hover{color:#fff !important}
.livebadge{background:#FF7A59;color:#fff;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:5px;letter-spacing:.02em}
.mebadge{background:#12304F;color:#9FD9E8;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:5px}
.wrap{max-width:1760px;margin:0 auto;padding:16px 22px 46px}
.bar{background:#fff;border:1px solid #DCE4EC;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:13px;flex-wrap:wrap;align-items:center}
.bar label{font-size:11px;color:#4A5A6A;font-weight:600;display:block;margin-bottom:3px;letter-spacing:.03em}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;border-top:1px solid #EFF3F7;padding-top:9px;margin-top:2px}
select,input[type=search],input[type=number]{border:1px solid #DCE4EC;border-radius:7px;padding:6px 10px;font-size:13px;background:#fff;font-family:inherit;min-width:140px;color:#0A2540}
select:hover,input:hover{border-color:#C2CFDB}
select:focus,input:focus{outline:none;border-color:#0091AE;box-shadow:0 0 0 3px #DCEDF6}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid #DCE4EC;background:#fff;border-radius:18px;padding:4px 12px;font-size:12.5px;font-weight:500;cursor:pointer;color:#425B76}
.chipb:hover{background:#EDF4F8;border-color:#B7DEE8}
.chipb.on{background:#0A2540;color:#fff;border-color:#0A2540}
.btn{border:1px solid #DCE4EC;background:#fff;border-radius:7px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:#37475A}
.btn:hover{background:#F4F7FA}
.btn.p{background:#0091AE;color:#fff;border-color:#0091AE}
.btn.p:hover{background:#00758C}
.mstrip{display:grid;grid-template-columns:190px minmax(0,1fr);gap:10px;margin-bottom:12px;align-items:stretch}
@media(max-width:960px){.mstrip{grid-template-columns:1fr}}
.mhero{background:#0A2540;border-radius:10px;padding:13px 16px;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.mhero:hover{background:#123152}
.mhero .v{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.mhero .l{font-size:12.5px;color:#93A7BC;margin-top:2px}
.mhero .s{font-size:11.5px;color:#9FB6CC;margin-top:8px;border-top:1px solid #1E3D5F;padding-top:7px;line-height:1.5}
.mgroups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
@media(max-width:900px){.mgroups{grid-template-columns:1fr}}
.mgroup{background:#fff;border:1px solid #DCE4EC;border-top:3px solid #0091AE;border-radius:10px;padding:10px 13px 11px;display:flex;flex-direction:column}
.mgroup .mrow{margin-top:auto}
.mgroup.alert{border-top-color:#FF7A59;background:#FEF8F6;border-color:#F0C0B2}
.mgroup h4{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#3F5163;font-weight:600;margin-bottom:9px}
.mrow{display:flex;gap:18px;flex-wrap:wrap;row-gap:10px}
.mitem{cursor:pointer;min-width:54px;border-radius:7px;padding:2px 6px;margin:-2px -6px}
.mitem:hover{background:#EDF4F8}
.mitem .v{font-size:24px;font-weight:600;letter-spacing:-.02em;color:#0A2540;line-height:1.15}
.mitem .l{font-size:12px;color:#566575;margin-top:2px}
.mitem.z .v{color:#B7C2CD}
.mitem.r .v{color:#8C2D12}.mitem.c .v{color:#0A5346}.mitem.a .v{color:#7A4A08}
.prog{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.prog .big{font-size:21px;font-weight:600;color:#0A2540;letter-spacing:-.02em}
.prog .of{font-size:12.5px;color:#566575}
.prog .pc{margin-left:auto;font-size:12.5px;font-weight:600;color:#0A5346}
.track{height:7px;border-radius:4px;background:#E7EEF4;overflow:hidden;margin-bottom:9px;display:flex}
.track i{display:block;height:7px}
.track i.done{background:#0091AE}
.track i.miss{background:#FF7A59}
.csync{background:#fff;border:1px solid #DCE4EC;border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:13px;color:#37475A}
.csync summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
.csync summary::-webkit-details-marker{display:none}
.csync .cbody{margin-top:10px;padding-top:10px;border-top:1px solid #EFF3F7;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sec{background:#fff;border:1px solid #DCE4EC;border-radius:10px;margin-bottom:13px;padding:13px 16px}
.sec h2{font-size:15px;font-weight:600;margin-bottom:3px;color:#0A2540}
.sec .sub{font-size:12.5px;color:#566575;margin-bottom:10px;line-height:1.55}
.sec.hero{padding:15px 17px;border-top:3px solid #0091AE}
.sec.mini{padding:12px 14px}
.sec.mini .sub{font-size:12px;margin-bottom:9px}
.sec.mini table{font-size:13.5px;table-layout:fixed;width:100%}
.sec.mini td{padding:8px 12px;overflow:hidden;text-overflow:ellipsis}
.sec.mini th{padding:8px 12px;white-space:normal;line-height:1.25;vertical-align:bottom;text-align:right}
.sec.mini th:first-child,.sec.mini td:first-child{width:200px;text-align:left}
.sec.mini th.n,.sec.mini td.n,.sec.mini td.cell{text-align:right}
.sec.mini .sub3{white-space:nowrap;text-align:right}
.sec.mini tbody tr:nth-child(odd) td{background:#FAFCFD}
.sec.mini tbody tr:nth-child(odd) td:first-child{background:#FAFCFD}
.sec.mini tbody tr:hover td{background:#EDF4F8}
.sec.mini tbody tr:hover td:first-child{background:#EDF4F8}
.sec.mini .sub3{font-size:11px}
.sec.mini .tw{max-height:none}
.tw{max-height:76vh;overflow:auto;border:1px solid #DCE4EC;border-radius:9px}
table{border-collapse:separate;border-spacing:0;font-size:13.5px;width:100%}
th{background:#EDF2F7;padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:#3F5163;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:3;border-bottom:1px solid #D3DEE9}
th:first-child{left:0;z-index:4}
td{padding:9px 12px;border-bottom:1px solid #EFF3F7;white-space:nowrap;color:#0A2540}
td:first-child{position:sticky;left:0;background:#fff;z-index:2;border-left:3px solid transparent}
tr:last-child td{border-bottom:none}
tr.tot td{background:#EDF2F7;font-weight:600;border-top:2px solid #D3DEE9;vertical-align:top}
tr.tot td:first-child{background:#EDF2F7}
tr.alert td:first-child{border-left-color:#FF7A59}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.cell{text-align:right;cursor:pointer;font-variant-numeric:tabular-nums}
td.cell:hover{box-shadow:inset 0 0 0 2px #0091AE}
td.cell.sel,.sec.mini tbody tr td.cell.sel,.sec.mini tbody tr:nth-child(odd) td.cell.sel,.sec.mini tbody tr:hover td.cell.sel{background:#0A2540 !important;color:#fff;font-weight:600}
td.cell.sel *{color:#fff !important}
td.z{color:#B7C2CD}
.cg{color:#0A5346}.cr{color:#8C2D12}.ca{color:#7A4A08}.mut{color:#6B7A8A}
.sub3{font-size:11px;font-weight:400;color:#566575;margin-top:2px;white-space:nowrap}
.sub3+.sub3{margin-top:1px}
.sub3 b{font-weight:600;cursor:pointer}
.sub3 b:hover{text-decoration:underline}
.sub3 .d{color:#3F5163}.sub3 .c{color:#0A5346}.sub3 .m{color:#8C2D12}
.st{font-size:12px;font-weight:500;padding:2px 9px;border-radius:6px;white-space:nowrap;display:inline-block}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;margin-right:4px;display:inline-block}
.tag.f{background:#EDE9FE;color:#4B2E9E}
.tag.s{background:#DDEFEA;color:#0A5346}
.tag.i{background:#DCEDF6;color:#0B4A66}
.tag.o{background:#FBE2D8;color:#8C2D12}
.tag.p{background:#EAEFF4;color:#3F5163}
.tag.rf{background:#FF7A59;color:#fff}
.tag.src{background:#fff;color:#566575;border:1px solid #DCE4EC}
.tag.paid{background:#0A5346;color:#fff}
.tag.opt{background:#3F5163;color:#fff}
.pill{background:#FF7A59;color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;display:inline-block;font-variant-numeric:tabular-nums}
.pill.w{background:#B8791A}
.ph{font-variant-numeric:tabular-nums;color:#0A2540}
.ico{color:#0091AE;text-decoration:none;font-weight:600;margin-left:7px}
.ico:hover{text-decoration:underline}
.a2{color:#0091AE;text-decoration:none;font-weight:600}
.a2:hover{text-decoration:underline}
#loading{padding:60px;text-align:center;color:#566575}
.spin{width:28px;height:28px;border:3px solid #DCE4EC;border-top-color:#0091AE;border-radius:50%;margin:0 auto 12px;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:#FDF3E7;color:#7A4A08;border:1px solid #EFD3AE;border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.rowlink{cursor:pointer}
.rowlink:hover td{background:#F4F7FA}
.rowlink:hover td:first-child{background:#F4F7FA}
.mbar{display:inline-block;height:6px;border-radius:3px;background:#0091AE;vertical-align:middle;margin-right:7px;min-width:2px}
tr.det td{background:#F4F7FA;white-space:normal;font-size:12.5px;color:#37475A;padding:10px 14px;line-height:1.6}
tr.det b{color:#0A2540}
.exp{cursor:pointer;color:#0091AE;font-weight:700;user-select:none}

/* v2 only: the three group tables are wider than v1's, and the footer needs to read as a
   summary rather than another row of data. */
.sec.mini th:first-child,.sec.mini td:first-child{width:168px}
tfoot td{background:#0A2540;color:#fff;border-bottom:none;position:sticky;bottom:0;z-index:3}
tfoot td:first-child{background:#0A2540;color:#fff}
tfoot td .sub3{color:#93A7BC}
tfoot tr:first-child td{background:#12304F}
tfoot tr:first-child td:first-child{background:#12304F}
.chips{margin-bottom:2px}
/* The two column groups are different questions, so they get a hard divider and their
   own ground colour. Without it the eye runs straight from a timing count into a reason
   count and reads them as one row of the same thing. */
/* The two groups are told apart by a rule and a faint tint. Anything heavier fights the
   heatmap shading, which is the thing actually carrying meaning in these cells. */
th.gA{background:#E4EDF9;color:#2A5EA8}td.gA{background:#EEF4FC}
th.gB{background:#FAEFD8;color:#8A6414}td.gB{background:#FDF6E7}
th.gC{background:#E3F2E9;color:#1C6B4E}td.gC{background:#EDF7F0}
th.gD{background:#E9EEF3;color:#4A5A6A}td.gD{background:#F2F5F8}
th.gh{background:#fff}
thead tr.grp th{top:0;z-index:4;text-align:left;font-size:10px;letter-spacing:.09em;border-bottom:none}
thead tr.colh th{top:23px;z-index:3}
tr.tot td.gB{background:#F2E8D2}tr.tot td.gC{background:#DEEBE3}tr.tot td.gD{background:#D6DEE7}
tr.tot.grand td.gB{background:#1A2E4A}tr.tot.grand td.gC{background:#14304A}tr.tot.grand td.gD{background:#152A44}
th.edge,td.edge{border-left:2px solid #C2D2E0}
.sec.mini th{white-space:normal;line-height:1.25;vertical-align:bottom;text-align:right}
.sec.mini th:first-child,.sec.mini td:first-child{width:172px;text-align:left}
.sec.mini table{table-layout:auto}
/* Subtotal and total rows carry a fill so they read as summaries rather than as one more
   stage, and they are clickable like any other cell. */
tr.tot.sub td{background:#DCE7F0;border-top:2px solid #B9CBDC}
tr.tot.sub td:first-child{background:#DCE7F0}
tr.tot.sub td.gA{background:#D2DFEC}
tr.tot.grand td{background:#0A2540;color:#fff;border-top:2px solid #0A2540}
tr.tot.grand td:first-child{background:#0A2540;color:#fff}
tr.tot.grand td.gA{background:#12304F}
tr.tot.grand .sub3,tr.tot.grand .sub3 b{color:#AFC3D6}
tr.tot.grand td.z{color:#5C728A}
tr.tot td.cell:hover{box-shadow:inset 0 0 0 2px #0091AE}
tr.tot .sub3{font-weight:400}
/* Every table scrolls inside its own card rather than pushing the page down forever, and
   the rows are tight enough to see a floor's worth of work without scrolling at all. */
tr.det td{padding:8px 12px}
.st{margin:0}
tr.rowlink.on td{background:#DCEDF6}
tr.rowlink.on td:first-child{background:#DCEDF6;border-left:3px solid #0091AE}
.mbar{background:#0091AE}
.det td{white-space:normal}
.fsub{margin:2px 0 10px}
.fhd{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#566575;margin-bottom:7px}
.qa{margin-bottom:9px}
.qa .q{color:#4A6785;font-size:12.5px;margin-bottom:2px}
.qa .a{color:#0A2540;font-size:14px;font-weight:500;line-height:1.4}
</style>
<link rel="stylesheet" href="/theme.css">
<style>
/* Loaded after theme.css on purpose. The shared theme sets its rules with !important, so
   anything density related has to come last or it silently loses. That is why the compact
   rows and the scrolling tables looked like they had not shipped. */
.wrap table th{padding:5px 10px !important;font-size:10px !important;letter-spacing:.05em !important}
.wrap table{font-size:12.5px !important}
.wrap table td{padding:4px 10px !important;line-height:1.3 !important;font-size:12.5px !important}
.wrap table td a{font-size:12.5px !important}
.wrap .ph{font-size:12px !important}
.wrap .ico{font-size:11.5px !important;margin-left:6px !important}
.wrap .exp{font-size:13px !important}
.wrap .sec.mini td,.wrap .sec.mini th{padding:4px 10px !important}
.wrap .tw{max-height:52vh !important;overflow:auto !important}
.wrap .tw.scrolly{max-height:300px !important}
.wrap .sub3{font-size:10px !important;line-height:1.2 !important;margin-top:0 !important}
.wrap .st,.wrap .tag{padding:1px 6px !important;font-size:10.5px !important;font-weight:600 !important}
.wrap .sec{padding:12px 14px !important}
.wrap .sec h2{font-size:14px !important;margin-bottom:2px !important}
.wrap .sec .sub{font-size:12px !important;margin-bottom:8px !important}
.wrap .mbar{height:5px !important}
/* Four hero cards, one per group, sized in proportion rather than one big and one wide. */
.wrap .herorow{display:grid !important;grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  gap:11px !important;margin-bottom:8px !important}
.wrap .hcard{border-radius:12px;padding:13px 15px;color:#fff}
.wrap .hcard .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85}
.wrap .hcard .big{font-size:31px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0 1px;
  display:flex;align-items:baseline;gap:5px}
.wrap .hcard .of{font-size:14px;font-weight:500;opacity:.75}
.wrap .hcard .pctpill{margin-left:auto;background:rgba(255,255,255,.2);border-radius:6px;
  padding:2px 8px;font-size:11.5px;font-weight:700}
.wrap .hcard .track{height:5px;border-radius:4px;background:rgba(255,255,255,.25);margin:8px 0 7px;overflow:hidden}
.wrap .hcard .track i{display:block;height:5px;background:#fff;border-radius:4px}
.wrap .hcard .foot{font-size:10.5px;opacity:.8;line-height:1.4}
.wrap .hcard.h1{background:linear-gradient(135deg,#3B63E0,#3E2FA8)}
.wrap .hcard.h2{background:linear-gradient(135deg,#2F7DA8,#1E5B7E)}
.wrap .hcard.h3{background:linear-gradient(135deg,#8A5A6E,#5E3A4C)}
.wrap .hcard.h4{background:linear-gradient(135deg,#5A6B7D,#3B4756)}
.wrap .hnote{font-size:11.5px;color:#566575;margin:0 0 12px}
/* Short cards flow in columns, so a tall card cannot leave a hole beside a short one.
   Grid rows align to the tallest cell; columns do not, which is what this needs. */
.wrap .vpflow{column-count:3;column-gap:12px;margin-bottom:0}
.wrap .vpflow > *{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;
  width:100%;margin:0 0 12px !important;vertical-align:top}
.wrap .vpwide{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:13px}
.wrap .vpwide > *{margin:0 !important}
@media (max-width:1500px){ .wrap .vpflow{column-count:2} }
@media (max-width:1000px){ .wrap .vpflow{column-count:1} }
/* Filters as one row that uses the width, with the sync line pushed to the far right. */
.wrap .top .bar{display:flex !important;flex-wrap:wrap !important;gap:10px !important;
  align-items:flex-end !important}
.wrap .top .bar > div{flex:1 1 150px;min-width:0}
.wrap .top .bar select{width:100% !important;min-width:0 !important}
.wrap .top .bar > div:last-child{flex:0 0 auto;margin-left:auto;text-align:right}
.wrap .top .bar .chips{flex:1 1 100%}
.wrap .top{grid-template-columns:1fr !important}
/* Stage and owner chips: label and chips on one line, not stacked. */
.wrap .top .bar:last-child{align-items:center !important}
@media (max-width:1100px){ .wrap .herorow{grid-template-columns:repeat(2,minmax(0,1fr)) !important} }
/* Churn band, read straight off the row: attempts in this stage by the agent holding it. */
/* Strong enough to read at a glance down a long list. A tint you have to look for is a
   tint nobody uses. */
.wrap tr.b-low td{background:#FBE4DE !important}
.wrap tr.b-avg td{background:#FBEED6 !important}
.wrap tr.b-bench td{background:#DCEFE6 !important}
.wrap tr.b-high td{background:#E6DEF8 !important}
.wrap tr.b-low td:first-child{box-shadow:inset 4px 0 0 #C0492A}
.wrap tr.b-avg td:first-child{box-shadow:inset 4px 0 0 #B8791A}
.wrap tr.b-bench td:first-child{box-shadow:inset 4px 0 0 #0A7C63}
.wrap tr.b-high td:first-child{box-shadow:inset 4px 0 0 #6D4AC4}
.wrap tr.rowlink:hover td{filter:brightness(.97)}
.wrap tr.done td{opacity:.72}
/* Sortable headers */
.wrap th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.wrap th.sortable:hover{color:#0091AE !important}
.wrap th.sortable .ar{opacity:.35;margin-left:3px;font-size:9px}
.wrap th.sortable.on{color:#0091AE !important}
.wrap th.sortable.on .ar{opacity:1}
.wrap a.wa{background:#15A34A !important;color:#fff !important;font-size:10px !important;font-weight:700 !important;
  padding:2px 7px !important;border-radius:4px !important;text-decoration:none !important;display:inline-block !important}
.wrap a.wa:hover{background:#0E8038 !important}
.wrap .r{color:#8C2D12}.wrap .a{color:#7A4A08}.wrap .g{color:#0A5346}.wrap .p{color:#4B2E9E}
/* theme.css sets td colour with !important, which turned the navy total row into dark
   text on a dark fill. These have to come after it and shout just as loudly. */
.wrap tr.tot.grand td,.wrap tr.tot.grand td b{color:#fff !important}
.wrap tr.tot.grand td .sub3,.wrap tr.tot.grand td .sub3 b{color:#AFC3D6 !important}
.wrap tr.tot.grand td.z{color:#5C728A !important}
.wrap td.cell.sel,.wrap td.cell.sel *{color:#fff !important}
/* Two columns for the header blocks, so controls and today's state cost one section of
   height between them rather than four stacked bars. */
.wrap .top{display:grid !important;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr) !important;
  gap:12px !important;align-items:start !important;margin-bottom:12px !important}
.wrap .top .bar,.wrap .top .sec{margin-bottom:9px !important}
.wrap .top .topcol > *:last-child{margin-bottom:0 !important}
.wrap .top .sec{padding:11px 13px !important}
.wrap .top .bar{padding:9px 12px !important}
.wrap .top select{padding:4px 8px !important;font-size:12.5px !important;min-width:112px !important}
.wrap .top .chipb{padding:2px 9px !important;font-size:11.5px !important}
@media (max-width:1200px){ .wrap .top{grid-template-columns:1fr !important} }

/* ---- view switcher, hero, board, lead card ---- */
.seg{display:inline-flex;background:#EFECF7;border-radius:10px;padding:3px;gap:2px;margin-left:4px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 17px;font-size:13px;font-weight:600;
  color:#7C7A8C;cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:#1A1A2E;box-shadow:0 1px 3px rgba(20,20,45,.13)}
.view{display:none}.view.on{display:block}
.herorow{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:12px;margin-bottom:12px}
.hero2{background:linear-gradient(135deg,#3B63E0,#4B3FCF 55%,#3E2FA8);border-radius:12px;padding:14px 16px;color:#fff}
.hero2 .k{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#C9D4FA;font-weight:700}

</style>
</head><body>

<div class="hdr">
  <h1>Call Now v2</h1>
  <span class="livebadge">PRIVATE</span>
  <span id="fxtag"></span>
  <p id="sub">Today's calling list is locked at midnight. Every lead sits in exactly one of the three groups, so the three always add up to the stage total.</p>
  <span id="vpnav" style="margin-left:auto;display:none;gap:13px;align-items:center;flex-wrap:wrap">
    <a class="ico" href="/callnow.html">Call Now &nearr;</a>
    <a class="ico" href="/vp.html">Revenue command &nearr;</a>
  </span>
</div>
<div class="wrap">
  <div id="loading"><div class="spin"></div>Loading</div>
  <div id="app" style="display:none"></div>
</div>
<script>

var J=null,A=null,L=null,LOADING=false,LEADS=false,PICK=null,OPEN={},LQ="",VIEW="matrix",SEL="",SORT={k:"",d:1};
var Q={team:"",agent:"",creator:"",source:"",ostate:"",intl:"",stages:""};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function fmt(n){return (n||0).toLocaleString("en-IN");}
function asJson(r){return r.text().then(function(t){try{return JSON.parse(t);}catch(e){
  if(r.status===403)throw new Error("This page is restricted.");
  if(r.status===502||r.status===504||/upstream/i.test(t))throw new Error("The server took too long to answer. Give it a minute and reload.");
  throw new Error("Server returned "+r.status+": "+String(t).slice(0,160));}});}
function qs(extra){var o=Object.assign({},Q,extra||{});
  return Object.keys(o).filter(function(k){return o[k]!==""&&o[k]!=null;})
    .map(function(k){return k+"="+encodeURIComponent(o[k]);}).join("&");}
function withTimeout(p,ms){return new Promise(function(res,rej){
  var t=setTimeout(function(){rej(new Error("The server did not answer within "+Math.round(ms/1000)+" seconds."));},ms);
  p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
function show(){var l=document.getElementById("loading"),a=document.getElementById("app");
  if(l)l.style.display="none"; if(a)a.style.display="block";}
var ASSIGN=null;
function load(){LOADING=true;
  withTimeout(Promise.all([fetch("/api/callnow2?"+qs()).then(asJson),
                           fetch("/api/callnow2/agents?"+qs()).then(asJson),
                           // Deliberately unfiltered by agent: a lead with no owner
                           // belongs to no agent, so the agent filter would empty it.
                           fetch("/api/callnow2/assign").then(asJson).catch(function(){return null;})]),60000)
    .then(function(r){LOADING=false;
      if(r[0]&&r[0].notReady){J={error:r[0].error,retry:true,building:true,progress:r[0].progress};show();draw();setTimeout(load,15000);return;}
      J=r[0];A=r[1];ASSIGN=r[2];show();draw();if(PICK)loadLeads();})
    .catch(function(e){LOADING=false;J={error:e.message,retry:true};show();draw();});}
function loadLeads(){if(!PICK)return;LEADS=true;draw();
  fetch("/api/callnow2/leads?"+qs(PICK)).then(asJson)
    .then(function(j){LEADS=false;L=j;draw();})
    .catch(function(e){LEADS=false;L={error:e.message};draw();});}
function setView(v){VIEW=v;if(v==="queue"&&!PICK)pick({sec:"n",col:"all"});else draw();}
function pick(o){VIEW="queue";SEL="";PICK=Object.assign({stage:"",sec:"",col:"all",t:"",worked:"",moved:"",notcounted:"",band:"",bandBy:""},o);L=null;OPEN={};LQ="";loadLeads();
  setTimeout(function(){var el=document.getElementById("drill");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},60);}
function unpick(){PICK=null;L=null;draw();}
function rebuild(btn){if(btn){btn.disabled=true;btn.textContent="Building...";}
  fetch("/api/callnow2/rebuild",{method:"POST"}).then(asJson).then(function(){setTimeout(load,8000);})
    .catch(function(e){alert(e.message);});}
function refreeze(){
  if(!confirm("Lock the list again using the leads as they are right now? Today's progress will then be measured from this moment instead of from midnight."))return;
  fetch("/api/callnow2/refreeze",{method:"POST"}).then(asJson).then(function(){load();}).catch(function(e){alert(e.message);});}

var TIMING=[["due","Due today"],["over","Overdue"],["nofu","No FU"],["newlead","Fresh"],["sched","Later date"]];
var COLS=[["form","Form"],["score","Score &ge;6"],["intl","Intl"],["fresh","Fresh"],
  ["refill","Refilled form"],["ifc","IFC due"],["needs","Needs owner"],
  ["any","Any priority"],["all","All in stage"]];
var SECS=[["n","Call today","Due today, overdue by a full working day, no follow-up marked, fresh, an IFC that has come due, or a form refilled since the last call. Click any number for the leads behind it."],
  ["a","Booked for a later date","The next call is set for a future day. Calls made on them still show, so no effort goes missing."],
  ["d","DNPs","Did not pick up, and carrying no reason to call: no form, no score of 6 or more, not international, not fresh. The DNP leads that do carry one are counted in Call today above, not here. Kept apart so they never make the call-today list look bigger."]];

// Lifted from the v1 page so the two cannot drift apart.
var STAGE_CHIP={counselled:"#DCEDF6|#0B4A66",program_pitched:"#DCEDF6|#0B4A66",discovery:"#DCEDF6|#0B4A66",
  pricing_pitched:"#DCEDF6|#0B4A66","Follow up":"#FAEBD7|#7A4A08",FU_DNP:"#FAEBD7|#7A4A08",FU_RCB:"#FAEBD7|#7A4A08",
  payment_prospect:"#EDE9FE|#4B2E9E",rcb_requested_callback:"#DDEFEA|#0A5346",
  __fresh:"#EAEFF4|#3F5163",IFC:"#EAEFF4|#3F5163",dnp_other:"#EAEFF4|#3F5163",
  dnp_did_not_pick:"#FBE2D8|#8C2D12",ghosted:"#FBE2D8|#8C2D12",ni_not_interested:"#FBE2D8|#8C2D12",
  disqualified:"#FADFDA|#99301C",deal_won:"#DFEFE6|#15613F"};
var STAGE_LABEL={counselled:"Counselled",program_pitched:"Program pitched",discovery:"Discovery",
  pricing_pitched:"Pricing pitched","Follow up":"Follow up",payment_prospect:"Payment prospect",
  FU_DNP:"FU - DNP",FU_RCB:"FU - RCB",rcb_requested_callback:"RCB - Requested callback",
  dnp_did_not_pick:"DNP",dnp_other:"DNP",__fresh:"Fresh leads",
  IFC:"Interested in future",ghosted:"Ghosted",ni_not_interested:"NI - Not interested",
  disqualified:"Disqualified",deal_won:"Deal won"};
function chip(stage,label){
  var c=(STAGE_CHIP[stage]||"#F2F2F4|#525252").split("|");
  return "<span class='st' style='background:"+c[0]+";color:"+c[1]+"'>"+esc(label||STAGE_LABEL[stage]||stage)+"</span>";
}
// Same shading v1 uses, so a big number reads as a big number at a glance.
function heats(rows,keys,sec){
  var mx={};
  keys.forEach(function(k){
    var m=0;
    rows.forEach(function(r){ var v=r[sec][k]||0; if(v>m)m=v; });
    mx[k]=m;
  });
  return mx;
}
// Four groups, each with its own tint and a band naming it, so timing, priority signals,
// new information and totals are told apart instead of read as one long row.
var GRP={due:"gA",over:"gA",nofu:"gA",newlead:"gA",sched:"gA",
  form:"gB",score:"gB",intl:"gB",
  fresh:"gC",refill:"gC",ifc:"gC",
  needs:"gD",any:"gD",all:"gD"};
var HEAT={gA:"47,111,228",gB:"184,121,26",gC:"28,107,78",gD:"90,107,125"};
var GRPHEAD=[["gA","Call today",5],["gB","Priority signals",3],["gC","New information",3],["gD","Totals",3]];
var EDGE={due:1,form:1,fresh:1,needs:1};
function head(){
  var g="<tr class='grp'><th class='gh'></th>";
  GRPHEAD.forEach(function(x){ g+="<th class='gh "+x[0]+" edge' colspan='"+x[2]+"'>"+x[1]+"</th>"; });
  var h="<tr class='colh'><th>Stage</th>";
  TIMING.concat(COLS).forEach(function(c){
    h+="<th class='n "+GRP[c[0]]+(EDGE[c[0]]?" edge":"")+"'>"+c[1]+"</th>";});
  return "<thead>"+g+"</tr>"+h+"</tr></thead>";}
function cellHtml(c,key,sec,stage,isT,i,mx){
  var on=PICK&&PICK.stage===stage&&PICK.sec===sec&&(isT?PICK.t===key:(PICK.col===key&&!PICK.t));
  var arg=isT?{stage:stage,sec:sec,t:key}:{stage:stage,sec:sec,col:key};
  var cls="cell "+GRP[key]+(EDGE[key]?" edge":"")+(on?" sel":"");
  var tot=c[key],w=c[key+"W"];
  var click=" onclick='pick("+JSON.stringify(arg).replace(/"/g,"&quot;")+")'";
  if(!tot)return "<td class='"+cls+" z'"+click+">0</td>";
  // The heatmap used one fixed blue, which painted straight over the group tint and left
  // only the empty cells showing their colour. Shade in the group's own hue instead, so
  // the band survives the shading.
  var heat=mx&&mx[key]?Math.sqrt(tot/mx[key]):0;
  var rgb=HEAT[GRP[key]]||HEAT.gA;
  var bg=(!on&&heat>0)?" style='background:rgba("+rgb+","+(0.06+0.26*heat).toFixed(3)+")'":"";
  var p=Math.round(100*w/tot);
  return "<td class='"+cls+"'"+bg+click+">"+fmt(tot)+
    "<div class='sub3'><b class='"+(p>=60?"c":(p>0?"d":"m"))+"'>"+fmt(w)+"</b> called &middot; "+p+"%</div></td>";}
function body(sec){
  var rows=J.stages.filter(function(s){return s[sec].all>0;});
  var span=1+TIMING.length+COLS.length;
  if(!rows.length)return "<tr><td colspan='"+span+"' class='z'>Nothing here.</td></tr>";
  var mx=heats(rows,TIMING.map(function(t){return t[0];}).concat(COLS.map(function(t){return t[0];})),sec);
  return rows.map(function(s){
    var c=s[sec],h="<tr><td>"+chip(s.stage,s.label)+"</td>";
    TIMING.forEach(function(t,i){h+=cellHtml(c,t[0],sec,s.stage,true,i,mx);});
    COLS.forEach(function(t,i){h+=cellHtml(c,t[0],sec,s.stage,false,i,mx);});
    return h+"</tr>";}).join("");}
// v1 puts the total inside the table body as a light row, not a dark sticky footer.
// The dark one was covering the last row and could not be clicked. These are clickable
// too: a column total opens that column across every stage.
function totRow(label,cells,secKey,cls){
  var h="<tr class='tot "+(cls||"")+"'><td><b>"+label+"</b></td>";
  var col=function(k,g,i,isT){
    var t=cells.reduce(function(a,c){return a+c[k];},0),
        w=cells.reduce(function(a,c){return a+(c[k+"W"]||0);},0);
    var arg=isT?{stage:"",sec:secKey,t:k}:{stage:"",sec:secKey,col:k};
    var on=PICK&&!PICK.stage&&PICK.sec===secKey&&(isT?PICK.t===k:(PICK.col===k&&!PICK.t));
    var cc="n cell "+g+(i===0?" edge":"")+(on?" sel":"");
    var click=" onclick='pick("+JSON.stringify(arg).replace(/"/g,"&quot;")+")'";
    if(!t)return "<td class='"+cc+" z'"+click+">0</td>";
    return "<td class='"+cc+"'"+click+">"+fmt(t)+"<div class='sub3'><b class='"+
      (w/t>=0.6?"c":(w?"d":"m"))+"'>"+fmt(w)+"</b> called &middot; "+Math.round(100*w/t)+"%</div></td>";};
  TIMING.forEach(function(t,i){h+=col(t[0],"gA",i,true);});
  COLS.forEach(function(t,i){h+=col(t[0],"gB",i,false);});
  return h+"</tr>";}
function baseNote(){
  if(!J.frozen)return "<div class='warn'>Today's calling list has not been locked yet, so these numbers are still moving. It locks automatically at "+esc(J.freezeHour)+" IST.</div>";
  return "<div class='sec mini'><div class='sub' style='margin:0'><b>Today's calling list locked at "+
    new Date(J.frozenAt).toLocaleString("en-IN")+"</b> with "+fmt(J.baseSize)+
    " leads. If a lead changes stage, gets a new follow-up date, or moves to another agent during the day, it still counts where it started this morning and against the agent who had it this morning."+
    // The one thing allowed to move, and only upward. Stated on the page so a manager who
    // sees the denominator grow has the reason in front of them rather than a suspicion.
    (J.promoted?" <b>"+fmt(J.promoted)+"</b> lead"+(J.promoted>1?"s":"")+" had no working owner this morning and "+
      (J.promoted>1?"have":"has")+" since been routed to an agent, so "+(J.promoted>1?"they are":"it is")+
      " now counted against whoever took "+(J.promoted>1?"them":"it")+". That is the only way the total can grow during the day.":"")+
    (J.isVP?" <a href='#' class='a2' onclick='refreeze();return false'>Lock again using right now</a>":"")+
    "</div></div>";}
function sel(id,label,opts,val){
  var h="<div><label>"+label+"</label><select onchange='Q."+id+"=this.value;load()'><option value=''>All</option>";
  opts.forEach(function(o){h+="<option value='"+esc(o.v)+"'"+(String(val)===String(o.v)?" selected":"")+">"+esc(o.l)+"</option>";});
  return h+"</select></div>";}
function bar(){
  var h="<div class='bar'>";
  // A scoped reader has nothing to choose between, so the picker is not drawn for them.
  if(!J.scoped){
    h+=sel("team","Manager",(J.teamOptions||[]).map(function(t){return {v:t.id,l:t.name};}),Q.team);
    h+=sel("agent","Agent",(J.agentOptions||[]).map(function(a){return {v:a.id,l:a.name+" · "+fmt(a.n)};}),Q.agent);
  }
  h+=sel("creator","Creator",(J.creatorOptions||[]).map(function(c){return {v:c.u,l:c.u+" · "+fmt(c.n)};}),Q.creator);
  h+=sel("source","Source",(J.sourceOptions||[]).map(function(c){return {v:c.u,l:srcLabel(c.u)+" · "+fmt(c.n)};}),Q.source);
  h+=sel("intl","Number",[{v:"yes",l:"International only"},{v:"no",l:"National only"}],Q.intl);
  h+="<div><button class='btn' onclick='load()'>Reload</button>"+
    ((Q.team||Q.agent||Q.creator||Q.source||Q.ostate||Q.intl||Q.stages)
      ? " <button class='btn' onclick='clearF()'>Clear</button>" : "")+
    "<div style='font-size:11px;color:#566575;margin-top:4px;white-space:nowrap'>"+
    (J.loadedAt==="fixtures"?"made-up test data":(J.loadedAt?"synced "+new Date(J.loadedAt).toLocaleTimeString("en-IN"):""))+
    (J.listBuiltAt?" &middot; built "+new Date(J.listBuiltAt).toLocaleTimeString("en-IN"):"")+"</div></div>";
  h+="</div>";
  // Second row of chips, the same controls v1 puts under its dropdowns.
  h+="<div class='bar' style='padding-top:8px;padding-bottom:8px'>";
  h+="<span style='font-size:11px;color:#4A5A6A;font-weight:600;letter-spacing:.03em;flex:0 0 auto'>Stages</span>"+
    "<div class='chips'>"+
    "<button class='chipb"+(Q.stages===""?" on":"")+"' onclick='setStages(\"\")'>All stages</button>"+
    (J.stageOptions||[]).map(function(o){
      var on=String(Q.stages).split(",").indexOf(o.stage)>=0;
      return "<button class='chipb"+(on?" on":"")+"' onclick='toggleStage("+JSON.stringify(o.stage).replace(/"/g,"&quot;")+")'>"+
        esc(o.label)+"</button>";}).join("")+"</div>";
  h+="<span style='font-size:11px;color:#4A5A6A;font-weight:600;letter-spacing:.03em;margin-left:10px;flex:0 0 auto'>Owner</span>"+
    "<div class='chips'>"+
    [["","All"],["active","Active agents"],["inactive","Deactivated agents"],
     ["needs","Needs owner"],["unassigned","Unassigned"]].map(function(o){
      return "<button class='chipb"+(Q.ostate===o[0]?" on":"")+"' onclick='setF(\"ostate\","+
        JSON.stringify(o[0]).replace(/"/g,"&quot;")+")'>"+o[1]+"</button>";}).join("")+"</div>";
  return h+"</div>";}
function setF(k,v){ Q[k]=v; load(); }
function clearF(){ Q={team:"",agent:"",creator:"",source:"",ostate:"",intl:"",stages:""}; load(); }
function setStages(v){ Q.stages=v; load(); }
function toggleStage(st){
  var cur=String(Q.stages||"").split(",").filter(Boolean);
  var i=cur.indexOf(st);
  if(i>=0)cur.splice(i,1); else cur.push(st);
  Q.stages=cur.join(","); load();
}
// actual_source arrives as machine values like "digital product" or "marketing webinar".
function srcLabel(v){
  if(!v)return "(not set)";
  return String(v).replace(/_/g," ").replace(/^\w/,function(m){return m.toUpperCase();});
}
function tm(ms){if(!ms)return "<span class='z'>never</span>";var d=new Date(ms);
  return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});}
function tmp(ms){return ms?tm(ms).replace(/<[^>]+>/g,""):"";}
function hsl(id){var p=(L&&L.portal)||{};return "https://"+(p.uiDomain||"app.hubspot.com")+"/contacts/"+(p.portalId||"")+"/contact/"+id;}
function toggleDet(id){OPEN[id]=!OPEN[id];draw();}
// What the lead told us on the form, laid out as question and answer the way they saw it.
function formBlock(subs){
  if(!subs||!subs.length)return "";
  return subs.map(function(sub){
    var qa=(sub.answers||[]).map(function(x){
      return "<div class='qa'><div class='q'>"+esc(x.q)+"</div>"+
        (x.a||[]).map(function(v){return "<div class='a'>"+esc(v)+"</div>";}).join("")+"</div>";
    }).join("");
    return "<div class='fsub'><div class='fhd'>"+esc(sub.form)+
      (sub.at?" &middot; submitted "+esc(tmp(sub.at)):"")+"</div>"+
      (qa||"<div class='z'>No answers captured on this submission.</div>")+"</div>";
  }).join("");}
function detRow(r,cols){
  var bits=[],h="";
  if(r.source)bits.push("<b>Source:</b> "+esc(srcLabel(r.source)));
  if(r.formSubs&&r.formSubs.length)h+=formBlock(r.formSubs);
  else if(r.forms&&r.forms.length)bits.push("<b>Form:</b> "+esc(r.forms.join(", "))+
    (r.formN>1?" &middot; "+r.formN+" submissions":"")+(r.formLast?" &middot; last "+esc(tmp(r.formLast)):"")+
    "<br><span class='z'>Answers not captured for this submission.</span>");
  else if(r.convRecent)bits.push("<b>Came in through:</b> "+esc(r.convRecent));
  if(r.bookTitle)bits.push("<b>Last booking:</b> "+esc(r.bookTitle)+
    (r.bookType?" ("+esc(r.bookType.replace(/_/g," "))+")":"")+
    (r.bookAt?" on "+esc(tmp(r.bookAt)):"")+(r.bookN>1?" &middot; "+r.bookN+" bookings":""));
  if(r.aiSummary)bits.push("<b>AI call summary:</b> "+esc(r.aiSummary));
  if(r.outcome)bits.push("<b>Last call outcome:</b> "+esc(r.outcome));
  if(r.whyText)bits.push("<b>Why the score:</b> "+esc(r.whyText));
  if(r.coldReason)bits.push("<b>Reason given:</b> "+esc(r.coldReason));
  if(!h&&!bits.length)bits.push("<span class='z'>Nothing recorded on this lead beyond the basics.</span>");
  return "<tr class='det'><td colspan='"+cols+"'>"+h+bits.join("<br>")+"</td></tr>";}
function bandOf(k){ return ((J&&J.effortBands)||[]).filter(function(b){return b.key===k;})[0]||null; }
function bandCls(k){ var b=bandOf(k); return b?b.cls:"z"; }
function bandTitle(k){ var b=bandOf(k); return b?esc(b.label):""; }
function days(ms){ return ms ? Math.max(0, Math.round((Date.now()-ms)/86400000)) : ""; }
function whyTags(r){

  if(r.bookTitle)t.push("<span class='tag src' title='Last Topmate booking'>"+esc(String(r.bookTitle).slice(0,30))+"</span>");
  return t.join(" ");
}

  // Already called sinks to the bottom: the top of the list is always what is left.

      switch(SORT.k){

      }};

  } else {

    COLDEF.map(function(c,i){

      var on=SORT.k===c[0];

        JSON.stringify(c[0]).replace(/"/g,"&quot;")+")'>"+esc(c[1])+
        "<span class='ar'>"+(on?(SORT.d>0?"\u25b2":"\u25bc"):"\u21c5")+"</span></th>";
    }).join("")+"</tr></thead><tbody>";
  rows.forEach(function(r,i){
    var digits=String(r.phone||"").replace(/[^0-9]/g,"");
    var moved=r.movedStage?"<div class='sub3'>now "+esc(STAGE_LABEL[r.nowStage]||r.nowStage)+"</div>":"";
    h+="<tr class='rowlink b-"+esc(r.bandOwner||"low")+(r.worked?" done":"")+(SEL===r.id?" sel":"")+"' onclick='pickLead("+JSON.stringify(r.id).replace(/"/g,"&quot;")+")'>"+
      "<td class='exp' onclick='event.stopPropagation();toggleDet("+JSON.stringify(r.id).replace(/"/g,"&quot;")+")'>"+
        (OPEN[r.id]?"&minus;":"+")+"</td>"+
      "<td class='z'>"+(i+1)+"</td>"+
      "<td>"+(r.worked?"<span class='tick' title='Called today'>&#10003;</span>":"")+
        "<a class='a2' href='"+hsl(r.id)+"' target='_blank' rel='noopener' onclick='event.stopPropagation()'>"+esc(r.name)+" &nearr;</a>"+
        (r.gone?" <span class='tag p' title='Was on this morning list, has since left the tracked pool'>left the list</span>":"")+"</td>"+
      "<td class='n'>"+(r.phone?"<span class='ph'>"+esc(r.phone)+"</span>":"<span class='z'>none</span>")+"</td>"+
      "<td>"+(digits?"<a class='wa' href='https://wa.me/"+digits+"' target='_blank' rel='noopener' title='Open WhatsApp' onclick='event.stopPropagation()'>WA</a>":"")+"</td>"+
      "<td>"+chip(r.openStage)+moved+"</td>"+
      "<td>"+(whyTags(r)||"<span class='z'>–</span>")+"</td>"+
      "<td>"+tm(r.fu)+"</td><td>"+tm(r.last)+"</td>"+
      "<td>"+esc(r.ownerName)+(r.ownerInactive?" <span class='tag o'>INACTIVE</span>":"")+
        (r.counted===false?" <span class='tag p'>not counted</span>":"")+"</td>"+
      "<td>"+esc(r.creator||"–")+"</td>"+
      "<td class='n'><b class='"+bandCls(r.band)+"' title='"+bandTitle(r.band)+", counting every agent'>"+fmt(r.calls)+"</b></td>"+
      "<td class='n'><b class='"+bandCls(r.bandOwner)+"' title='"+bandTitle(r.bandOwner)+", this agent only'>"+fmt(r.own)+"</b></td>"+
      "<td class='n'>"+(r.stageEntered?days(r.stageEntered)+"d":"<span class='z'>–</span>")+"</td></tr>";
    if(OPEN[r.id])h+="<tr class='det'><td colspan='14'><div class='detbox'>"+detBody(r)+"</div></td></tr>";
  });
  if(!rows.length)h+="<tr><td colspan='14' class='z'>Nothing matches that search.</td></tr>";
  h+="</tbody></table></div></div>"+leadCard(rows)+"</div></div>";
  return h;}

function whyBody(r){

/* The tracked creator list scopes this whole page, so it has to be manageable from here,

var OUT=null,OUTBUSY=false,CSYNC=false;
function loadOutside(force){
  if(OUTBUSY)return; OUTBUSY=true; draw();
  fetch("/api/callnow2/outside"+(force?"?force=1":"")).then(asJson)
    .then(function(j){OUTBUSY=false;OUT=j;draw();})
    .catch(function(e){OUTBUSY=false;OUT={error:e.message};draw();});}
function addCreator(u,btn){
  if(!u)return;
  if(btn){btn.disabled=true;btn.textContent="Syncing...";}
  CSYNC=true;
  fetch("/api/callnow/sync-creator?creator="+encodeURIComponent(u),{method:"POST"}).then(asJson)
    .then(function(j){
      CSYNC=false;
      if(j&&j.error){alert(j.error);draw();return;}
      if(j&&j.truncated)alert("Added "+u+", but only "+fmt(j.added)+" of "+fmt(j.hubspotTotal)+
        " leads could be pulled. HubSpot stops paging at 10,000 per query.");
      OUT=null; load();
    })
    .catch(function(e){CSYNC=false;alert(e.message);draw();});}
function dropCreator(u){
  if(!confirm("Stop tracking "+u+"? Their leads leave this page from the next list build."))return;
  fetch("/api/callnow/drop-creator?creator="+encodeURIComponent(u),{method:"POST"}).then(asJson)
    .then(function(){OUT=null;load();}).catch(function(e){alert(e.message);});}

var REC=null,RECBUSY=false;
function loadRec(){
  if(RECBUSY)return; RECBUSY=true; draw();
  fetch("/api/callnow2/reconcile?"+qs()).then(asJson)
    .then(function(j){RECBUSY=false;REC=j;draw();})
    .catch(function(e){RECBUSY=false;REC={error:e.message};draw();});}
// Every difference between the two pages, as a number and a sentence, before anyone's
// targets depend on it.
function reconcile(){
  var h="<div class='sec mini'><h2>Call Now v1 against v2 "+
    "<button class='btn' style='float:right' onclick='loadRec()'>"+
    (RECBUSY?"Checking...":(REC?"Re-check":"Compare now"))+"</button></h2>"+
    "<div class='sub'>Both sides counted from the same pool in the same request, so no gap can be blamed on timing. "+
    "Run this for a fortnight before moving any target onto v2.</div>";
  if(!REC)return h+"<div class='z' style='padding:6px 2px'>Not compared yet.</div></div>";
  if(REC.error)return h+"<div class='warn'>"+esc(REC.error)+"</div></div>";
  if(REC.fixtures)h+="<div class='warn'>Running on test data, so the v1 side reads zero. This is only meaningful against real leads.</div>";
  h+="<div class='tw'><table><thead><tr><th>Bucket</th><th class='n'>v1, live</th><th class='n'>v2, locked list</th>"+
    "<th class='n'>Difference</th><th>Why they differ</th></tr></thead><tbody>";
  h+=REC.rows.map(function(r){
    var cls=r.delta===0?"z":(r.delta>0?"c":"m");
    var sign=r.delta>0?"+":"";
    return "<tr><td><b>"+esc(r.label)+"</b></td>"+
      "<td class='n'>"+fmt(r.v1)+"</td><td class='n'>"+fmt(r.v2)+"</td>"+
      "<td class='n'><b class='"+cls+"'>"+(r.delta===0?"same":sign+fmt(r.delta))+"</b></td>"+
      "<td style='white-space:normal;font-size:12.5px;color:#566575;line-height:1.5'>"+esc(r.why)+"</td></tr>";
  }).join("");
  h+="</tbody></table></div>";
  if(REC.shown)h+="<div class='sub' style='margin-top:9px'>"+fmt(REC.shown.notCounted)+

      "</b> more leads were called today that were never on this list. They are in the fourth card above.</div>":"")+

/* The pool a manager can hand out: fresh leads nobody is working, split by creator.

function churnPanel(){
  // A manager coaches on this; an agent should be working their list, not ranking
  // themselves against it. Same reason they do not get the agent table.
  if(J.scoped&&J.role==="agent")return "";
  if(!A||!A.agents||!A.agents.length)return "";
  var B=A.effortBands||J.effortBands;
  if(!B)return "";
  var rows=A.agents.filter(function(a){return a.n.all>0;});
  if(!rows.length)return "";
  var range=function(b){ return b.max==null?(b.min+"+"):(b.min+" to "+b.max); };
  var share=function(a){
    var e=a.effort[CHURN_BY],t=B.reduce(function(x,b){return x+e[b.key];},0);
    return t?e.low/t:0;};
  // Working agents first, worst churn at the top, then parking buckets, then anyone
  // deactivated. A deactivated agent's untouched pile is a reassignment job, not a
  // coaching conversation, so it must not head the list.
  var rank=function(a){ return (a.active?0:2)+(a.counted?0:1); };
  rows=rows.slice().sort(function(x,y){
    return rank(x)-rank(y) || share(y)-share(x) || y.n.all-x.n.all; });
  var h="<div class='sec mini'><h2>Lead churn effort</h2>"+
    "<div class='sub'>Of the leads each agent is holding that need a call today, how many have barely been tried. "+
    "Sorted worst first. <b>By the agent who holds it</b> is the accountable number; <b>by anyone</b> tells you whether "+
    "the lead has had a go at all, which is how an inherited lead is told from a neglected one. Click any number for those leads.</div>"+
    "<div class='chips' style='margin-bottom:9px'>"+
    "<button class='chipb"+(CHURN_BY==="owner"?" on":"")+"' onclick='setChurnBy(\"owner\")'>By the agent who holds it</button>"+
    "<button class='chipb"+(CHURN_BY==="total"?" on":"")+"' onclick='setChurnBy(\"total\")'>By anyone, in the stage</button>"+
    "</div>"+
    "<div class='tw scrolly'><table><thead><tr><th>Agent</th><th class='n'>Call today</th>"+
    B.map(function(b){return "<th class='n'>"+esc(b.label)+"<div class='sub3'>"+range(b)+"</div></th>";}).join("")+
    "<th class='n'>Barely tried</th></tr></thead><tbody>";
  h+=rows.map(function(a){
    var e=a.effort[CHURN_BY];
    var t=B.reduce(function(x,b){return x+e[b.key];},0);
    var pc=t?Math.round(100*e.low/t):0;
    var flag=pc>=70?"m":(pc>=40?"d":"c");
    return "<tr class='rowlink"+(Q.agent===a.id?" on":"")+"'>"+
      "<td onclick=\"Q.agent='"+esc(a.id)+"';load()\">"+esc(a.name)+
        (a.counted?"":" <span class='tag p'>not counted</span>")+
        (a.active?"":" <span class='tag o'>INACTIVE</span>")+
        (a.team?"<div class='sub3'>"+esc(a.team)+"</div>":"")+"</td>"+
      "<td class='n'>"+fmt(a.n.all)+"</td>"+
      B.map(function(b){
        var n=e[b.key];
        var on=PICK&&PICK.band===b.key&&PICK.bandBy===CHURN_BY&&PICK.agent===a.id;
        if(!n)return "<td class='n cell z' onclick='pick({band:"+JSON.stringify(b.key).replace(/"/g,"&quot;")+
          ",bandBy:"+JSON.stringify(CHURN_BY).replace(/"/g,"&quot;")+",agent:"+JSON.stringify(a.id).replace(/"/g,"&quot;")+",sec:\"n\"})'>0</td>";
        return "<td class='n cell"+(on?" sel":"")+"' onclick='pick({band:"+JSON.stringify(b.key).replace(/"/g,"&quot;")+
          ",bandBy:"+JSON.stringify(CHURN_BY).replace(/"/g,"&quot;")+",agent:"+JSON.stringify(a.id).replace(/"/g,"&quot;")+",sec:\"n\"})'>"+
          "<b class='"+b.cls+"'>"+fmt(n)+"</b></td>";}).join("")+
      "<td class='n'><b class='"+flag+"'>"+pc+"%</b></td></tr>";}).join("");
  return h+"</tbody></table></div></div>";}

var ASORT={k:"",d:1};
function aHead(k,label,cls){

function aSort(k){ if(ASORT.k===k)ASORT.d=-ASORT.d; else {ASORT.k=k;ASORT.d=1;} draw(); }
function agentTable(){
  if(!A||!A.agents||!A.agents.length)return "";
  var mx=0; A.agents.forEach(function(a){ if(a.n.all>mx)mx=a.n.all; });
  // Working agents first, then parking buckets, then anyone deactivated. A deactivated
  // agent's pile is a reassignment job, not a calling job, so it does not belong on top.
  var list=A.agents.slice().sort(function(x,y){
    var rx=(x.active?0:2)+(x.counted?0:1), ry=(y.active?0:2)+(y.counted?0:1);
    return rx-ry || y.n.all-x.n.all;
  });
  var h="<div class='sec mini'><h2>Today's calling list by agent</h2>"+
    "<div class='sub'>Every lead on today's list, split by whoever held it this morning. Click a row to scope the whole page to that agent. "+
    "Rows marked <b>not counted</b> are parking buckets, shown for visibility but left out of every total above.</div>"+
    "<div class='tw scrolly'><table><thead><tr>"+
    aHead("name","Agent","")+aHead("all","Call today","n")+
    aHead("due","Due today","n gA edge")+aHead("over","Overdue","n gA")+aHead("nofu","No FU","n gA")+
    aHead("newlead","Fresh","n gA")+
    aHead("form","Form","n gB edge")+aHead("score","Score","n gB")+aHead("intl","Intl","n gB")+
    aHead("refill","Refilled","n gB")+
    aHead("called","Called","n")+aHead("later","Booked later","n")+aHead("dnp","DNP","n")+
    "</tr></thead><tbody>";
  var pill=function(v,cls){ return v?"<span class='pill"+(cls||"")+"'>"+fmt(v)+"</span>":"<span class='z'>0</span>"; };
  if(ASORT.k){
    var av=function(a){
      if(ASORT.k==="name")return String(a.name||"").toLowerCase();
      if(ASORT.k==="called")return a.n.dueW||0;
      if(ASORT.k==="later")return a.a.all||0;
      if(ASORT.k==="dnp")return a.d.all||0;
      return a.n[ASORT.k]||0;};
    list=list.slice().sort(function(x,y){
      var p=av(x),q=av(y); if(p<q)return -ASORT.d; if(p>q)return ASORT.d; return 0;});
  }
  list.forEach(function(a){
    var w=mx?Math.round(56*a.n.all/mx):0;
    var miss=a.n.due-a.n.dueW;
    h+="<tr class='rowlink"+(Q.agent===a.id?" on":"")+"' onclick=\"Q.agent='"+esc(a.id)+"';load()\">"+
      "<td>"+esc(a.name)+
        (a.counted?"":" <span class='tag p'>not counted</span>")+
        (a.active?"":" <span class='tag o'>INACTIVE</span>")+
        (a.team?"<div class='sub3'>"+esc(a.team)+"</div>":"")+"</td>"+
      "<td class='n'><span class='mbar' style='width:"+w+"px'></span><b>"+fmt(a.n.all)+"</b>"+
        "<div class='sub3'><b class='"+(a.n.allW?"c":"m")+"'>"+fmt(a.n.allW)+"</b> called</div></td>"+
      "<td class='n gA edge'>"+fmt(a.n.due)+"</td>"+
      "<td class='n gA'>"+pill(a.n.over)+"</td>"+
      "<td class='n gA'>"+pill(a.n.nofu," w")+"</td>"+
      "<td class='n gA'>"+fmt(a.n.newlead)+"</td>"+
      "<td class='n gB edge'>"+fmt(a.n.form)+"</td>"+
      "<td class='n gB'>"+fmt(a.n.score)+"</td>"+
      "<td class='n gB'>"+fmt(a.n.intl)+"</td>"+
      "<td class='n gB'>"+fmt(a.n.refill)+"</td>"+
      "<td class='n'>"+(miss>0?pill(miss)+"<div class='sub3'>missed of "+fmt(a.n.due)+" due</div>":fmt(a.n.dueW))+"</td>"+
      "<td class='n'>"+fmt(a.a.all)+"</td>"+
      "<td class='n'>"+fmt(a.d.all)+"</td></tr>";
  });
  return h+"</tbody></table></div></div>";}
function draw(){

        "<i style='display:block;height:7px;width:"+pcv+"%;background:#B8791A'></i></div>"+
        "<div style='margin-top:5px;font-size:11.5px'>"+(pr.phase?esc(pr.phase)+": ":"")+

        fmt(pr.leadsSoFar)+" leads so far"+(pr.syncError?" &middot; error: "+esc(pr.syncError):"")+"</div></div>";}

  var nav=document.getElementById("vpnav");
  if(nav)nav.style.display=J.isVP?"flex":"none";
  // Four full width bars stacked on top of each other pushed the tables below the fold.

  // A VP gets the machinery: what the list is, what is held aside, how it compares to v1,

    // A manager gets none of the machinery, but the pool they can hand out is their job,

  var matrix="";

    var last=i===SECS.length-1;
    matrix+="<div class='sec mini'><h2>"+s[1]+"</h2><div class='sub'>"+s[2]+"</div>"+
      "<div class='tw'><table>"+head()+"<tbody>"+body(s[0])+
      (J.stages.filter(function(x){return x[s[0]].all>0;}).length>1
        ? totRow(s[1],[J.totals[s[0]]],s[0],"sub") : "")+
      (last?totRow("Everything added up",[J.totals.n,J.totals.a,J.totals.d],"","grand"):"")+
      "</tbody></table></div></div>";});
  matrix+=churnPanel()+excludedNote()+creatorPanel()+(J.isVP?reconcile():"")+qualityPanel()+(J.scoped&&J.role==="agent"?"":agentTable());
  h+="<div class='view"+(VIEW==="matrix"?" on":"")+"'>"+matrix+"</div>"+
     "<div class='view"+(VIEW==="queue"?" on":"")+"'>"+queueView()+"</div>"+
     "<div class='view"+(VIEW==="board"?" on":"")+"'>"+boardView()+"</div>";
  el.innerHTML=h;}
load();
setInterval(function(){if(!LOADING&&!LEADS)load();},10*60*1000);

</script>
