<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Call Now - priority queue</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FBFBFC;color:#1A1A1E;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.hdr{background:#fff;border-bottom:1px solid #E9E9EC;padding:13px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.hdr p{font-size:12px;color:#8A8A94}
.livebadge{background:#FBE3D3;color:#7A2800;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.mebadge{background:#EEF1FE;color:#2740B8;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.wrap{max-width:1680px;margin:0 auto;padding:16px 22px 44px}
.bar{background:#fff;border:1px solid #E9E9EC;border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.bar label{font-size:11px;color:#8A8A94;font-weight:500;display:block;margin-bottom:5px}
select,input[type=search]{border:1px solid #E3E3E7;border-radius:7px;padding:6px 10px;font-size:13px;background:#fff;font-family:inherit;min-width:158px;color:#1A1A1E}
select:hover,input[type=search]:hover{border-color:#CFCFD6}
select:focus,input[type=search]:focus{outline:none;border-color:#3B5BFD;box-shadow:0 0 0 3px #EEF1FE}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid #E9E9EC;background:#fff;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:500;cursor:pointer;color:#5C5C66;transition:background .1s}
.chipb:hover{background:#F7F7F9}
.chipb.on{background:#1A1A1E;color:#fff;border-color:#1A1A1E}
.btn{border:1px solid #E9E9EC;background:#fff;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;color:#3F3F46}
.btn.p{background:#3B5BFD;color:#fff;border-color:#3B5BFD}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid #E9E9EC;border-radius:10px;padding:12px 14px}
.card .v{font-size:21px;font-weight:600;letter-spacing:-.02em;color:#1A1A1E}
.card .l{font-size:11.5px;color:#8A8A94;margin-top:1px}
.card.r .l,.card.r .v{color:#7A2800}.card.g .v{color:#00415F}.card.b .v{color:#2740B8}.card.a .v{color:#8A5A00}.card.v .v{color:#5B21B6}
.sec{background:#fff;border:1px solid #E9E9EC;border-radius:10px;margin-bottom:14px;padding:14px 16px}
.sec h2{font-size:13.5px;font-weight:600;margin-bottom:2px;letter-spacing:-.01em}
.sec .sub{font-size:12px;color:#8A8A94;margin-bottom:11px;line-height:1.55}
.tw{max-height:74vh;overflow:auto;border:1px solid #F0F0F2;border-radius:8px}
table{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
th{background:#FBFBFC;padding:9px 12px;text-align:left;font-size:11px;font-weight:500;color:#8A8A94;white-space:nowrap;position:sticky;top:0;z-index:3;border-bottom:1px solid #EDEDF0}
th:first-child{left:0;z-index:4}
td{padding:8px 12px;border-bottom:1px solid #F4F4F6;white-space:nowrap;color:#1A1A1E}
td:first-child{position:sticky;left:0;background:#fff;z-index:2}
tr:last-child td{border-bottom:none}
tr.tot td{background:#FBFBFC;font-weight:600}
tr.tot td:first-child{background:#FBFBFC}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.cell{text-align:right;cursor:pointer;font-variant-numeric:tabular-nums}
td.cell:hover{box-shadow:inset 0 0 0 1px #3B5BFD}
td.cell.sel{background:#3B5BFD;color:#fff;font-weight:600}
td.cell.sel *{color:#fff}
td.z{color:#C9C9D0}
.cg{color:#00415F}.cr{color:#B03A00}.ca{color:#8A5A00}.mut{color:#8A8A94}
.st{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.tag{font-size:11px;font-weight:500;padding:1px 7px;border-radius:6px;white-space:nowrap;margin-right:4px;display:inline-block}
.tag.f{background:#F1ECFD;color:#5B21B6}.tag.s{background:#DDEBF6;color:#00415F}.tag.i{background:#EEF1FE;color:#2740B8}.tag.o{background:#FBE3D3;color:#7A2800}
.a2{color:#2740B8;text-decoration:none;font-weight:500}
.a2:hover{text-decoration:underline}
#loading{padding:60px;text-align:center;color:#8A8A94}
.spin{width:26px;height:26px;border:2.5px solid #EDEDF0;border-top-color:#3B5BFD;border-radius:50%;margin:0 auto 12px;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:#FDF6EC;color:#8A5A00;border:1px solid #F5E4C8;border-radius:8px;padding:9px 13px;font-size:12.5px;margin-bottom:12px}
.rowlink{cursor:pointer}
.rowlink:hover td{background:#FBFBFC}
</style>
</head>
<body>
<div class="hdr">
  <h1>Call Now</h1>
  <span class="livebadge">MUST CALL</span>
  <span id="whobadge"></span>
  <p id="sub">Priority leads by stage: waitlist form submitters, conversion score, international</p>
  <a href="/" style="font-size:11px;color:#4338CA;margin-left:auto">&larr; dashboard</a>
</div>
<div class="wrap">
  <div id="loading"><div class="spin"></div>Loading priority queue...</div>
  <div id="app" style="display:none"></div>
</div>
<script>
var QS = new URLSearchParams(location.search);
var ME = QS.get("id") || "";
var S = {
  agent: ME || (localStorage.getItem("cn_agent") || ""),
  creator: QS.get("creator") || localStorage.getItem("cn_creator") || "",
  intl: localStorage.getItem("cn_intl") || "",
  ostate: "",
  stages: null,
  fu: "",
  cellStage: "", cellSeg: "",
  q: ""
};
var J = null, L = null, LOADING = false;

function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
function fmt(n){ return Math.round(n || 0).toLocaleString("en-IN"); }
function dt(x){ return x ? new Date(x).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "–"; }
function days(x){ return x ? Math.floor((Date.now() - x) / 86400000) : null; }
function qsStr(extra){
  var p = new URLSearchParams();
  if (S.agent) p.set("agent", S.agent);
  if (S.creator) p.set("creator", S.creator);
  if (S.intl) p.set("intl", S.intl);
  if (S.ostate) p.set("ostate", S.ostate);
  if (S.stages && S.stages.length) p.set("stages", S.stages.join(","));
  if (extra) Object.keys(extra).forEach(function(k){ if (extra[k]) p.set(k, extra[k]); });
  return p.toString();
}
function save(){
  if (!ME) localStorage.setItem("cn_agent", S.agent);
  localStorage.setItem("cn_creator", S.creator);
  localStorage.setItem("cn_intl", S.intl);
}

function load(){
  LOADING = true;
  fetch("/api/callnow?" + qsStr()).then(function(r){ return r.json(); }).then(function(j){
    J = j;
    if (!S.stages) S.stages = j.stageGroups.priority.slice();
    LOADING = false;
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "";
    draw();
    if (S.cellStage || S.cellSeg) loadLeads();
  }).catch(function(e){
    document.getElementById("loading").innerHTML = "<div class='warn'>Could not load: " + esc(e.message) + "</div>";
  });
}
var KIND = {
  needs:      { seg: "any", ostate: "needs" },
  fu_overdue: { seg: "any", fu: "overdue" },
  fu_none:    { seg: "any", fu: "none" },
  uncalled:   { seg: "any", uncalled: "1" }
};
function loadLeads(){
  var kind = S.cellSeg || "any";
  var base = KIND[kind] || { seg: kind };
  var extra = { stage: S.cellStage, limit: "1500" };
  Object.keys(base).forEach(function(k){ extra[k] = base[k]; });
  if (S.fu) extra.fu = S.fu;
  var u = "/api/callnow/leads?" + qsStr(extra);
  L = { loading: true };
  draw();
  fetch(u).then(function(r){ return r.json(); }).then(function(j){ L = j; draw(); });
}
function pick(stage, seg){
  if (S.cellStage === stage && S.cellSeg === seg) { S.cellStage = ""; S.cellSeg = ""; L = null; draw(); return; }
  S.cellStage = stage; S.cellSeg = seg; loadLeads();
}
function setF(k, v){ S[k] = v; S.cellStage = ""; S.cellSeg = ""; L = null; save(); load(); }
function toggleStage(s){
  var i = S.stages.indexOf(s);
  if (i >= 0) S.stages.splice(i, 1); else S.stages.push(s);
  S.cellStage = ""; S.cellSeg = ""; L = null; load();
}
function presetStages(which){
  if (which === "p") S.stages = J.stageGroups.priority.slice();
  else if (which === "a") S.stages = J.stageGroups.priority.concat(J.stageGroups.other);
  else S.stages = J.stageGroups.other.slice();
  S.cellStage = ""; S.cellSeg = ""; L = null; load();
}
function setFu(v){ S.fu = (S.fu === v ? "" : v); if (S.cellSeg) loadLeads(); else draw(); }
function setOstate(v){ S.ostate = (S.ostate === v ? "" : v); S.cellStage = ""; S.cellSeg = ""; L = null; load(); }

var STAGE_CHIP = {
  counselled: "#EEF1FE|#2740B8", program_pitched: "#EEF1FE|#2740B8", discovery: "#EEF1FE|#2740B8",
  pricing_pitched: "#EEF1FE|#2740B8", "Follow up": "#FBEFE2|#8A4B08", FU_DNP: "#FBEFE2|#8A4B08",
  FU_RCB: "#FBEFE2|#8A4B08", payment_prospect: "#F1ECFD|#5B21B6", rcb_requested_callback: "#E4F2F1|#0F5E56",
  __fresh: "#F2F2F4|#5C5C66", IFC: "#F2F2F4|#5C5C66", dnp_did_not_pick: "#FBE3D3|#7A2800",
  ghosted: "#FBE3D3|#7A2800", ni_not_interested: "#FBE3D3|#7A2800", disqualified: "#FBE3D3|#7A2800",
  deal_won: "#E7F3EC|#14663C"
};
function chip(stage, label){
  var c = (STAGE_CHIP[stage] || "#F2F2F4|#5C5C66").split("|");
  return "<span class='st' style='background:" + c[0] + ";color:" + c[1] + "'>" + esc(label) + "</span>";
}
function hsUrl(id){
  var p = (J && J.portal) || { uiDomain: "app-na2.hubspot.com", portalId: "244132076" };
  return "https://" + p.uiDomain + "/contacts/" + p.portalId + "/record/0-1/" + id;
}

function cell(v, stage, seg, cls, heat){
  var sel = (S.cellStage === stage && S.cellSeg === seg) ? " sel" : "";
  var z = v ? "" : " z";
  var bg = (!sel && heat > 0) ? " style='background:rgba(0,114,178," + (0.05 + 0.25 * heat).toFixed(3) + ")'" : "";
  return "<td class='cell" + sel + z + (cls && !sel ? " " + cls : "") + "'" + bg + " onclick=\"pick('" + stage.replace(/'/g, "\\'") + "','" + seg + "')\">" + fmt(v) + "</td>";
}
function heats(rows, keys){
  var mx = {};
  keys.forEach(function(k){ mx[k] = 0; rows.forEach(function(r){ if (r[k] > mx[k]) mx[k] = r[k]; }); });
  return function(r, k){ return mx[k] ? Math.sqrt(r[k] / mx[k]) : 0; };
}

function drawFilters(){
  var h = "<div class='bar'>";
  if (!ME) {
    h += "<div><label>Agent</label><select onchange=\"setF('agent',this.value)\"><option value=''>All agents</option>";
    J.agentOptions.forEach(function(a){
      h += "<option value='" + esc(a.id) + "'" + (S.agent === a.id ? " selected" : "") + ">" + esc(a.name) + (a.active ? "" : " (inactive)") + " · " + fmt(a.n) + "</option>";
    });
    h += "</select></div>";
  }
  h += "<div><label>Creator</label><select onchange=\"setF('creator',this.value)\"><option value=''>All creators</option>";
  J.creatorOptions.forEach(function(c){
    h += "<option value='" + esc(c.u) + "'" + (S.creator === c.u ? " selected" : "") + ">" + esc(c.u) + " · " + fmt(c.n) + "</option>";
  });
  h += "</select></div>";
  h += "<div><label>Number</label><select onchange=\"setF('intl',this.value)\">" +
    "<option value=''" + (S.intl === "" ? " selected" : "") + ">All</option>" +
    "<option value='no'" + (S.intl === "no" ? " selected" : "") + ">National</option>" +
    "<option value='yes'" + (S.intl === "yes" ? " selected" : "") + ">International</option></select></div>";
  h += "<div style='flex:1;min-width:280px'><label>Stages in view</label><div class='chips'>";
  h += "<button class='chipb" + (S.stages.length === J.stageGroups.priority.length ? " on" : "") + "' onclick=\"presetStages('p')\">Priority set</button>";
  h += "<button class='chipb' onclick=\"presetStages('a')\">All stages</button>";
  h += "<button class='chipb' onclick=\"presetStages('o')\">Churned only</button>";
  h += "</div><div class='chips' style='margin-top:5px'>";
  J.stageGroups.priority.concat(J.stageGroups.other).forEach(function(s){
    h += "<button class='chipb" + (S.stages.indexOf(s) >= 0 ? " on" : "") + "' onclick=\"toggleStage('" + s.replace(/'/g, "\\'") + "')\">" + esc(J.stageGroups.labels[s] || s) + "</button>";
  });
  h += "</div></div>";
  h += "<div style='flex:1;min-width:230px'><label>Owner state</label><div class='chips'>";
  h += "<button class='chipb" + (S.ostate === "" ? " on" : "") + "' onclick=\"setOstate('')\">All</button>";
  h += "<button class='chipb" + (S.ostate === "needs" ? " on" : "") + "' onclick=\"setOstate('needs')\">Needs owner</button>";
  h += "<button class='chipb" + (S.ostate === "unassigned" ? " on" : "") + "' onclick=\"setOstate('unassigned')\">Unassigned</button>";
  h += "<button class='chipb" + (S.ostate === "inactive" ? " on" : "") + "' onclick=\"setOstate('inactive')\">Deactivated owner</button>";
  h += "</div></div>";
  h += "</div>";
  return h;
}

function drawCards(){
  var t = J.totals;
  return "<div class='cards'>" +
    "<div class='card r'><div class='v'>" + fmt(t.any) + "</div><div class='l'>Must call (any priority)</div></div>" +
    "<div class='card v'><div class='v'>" + fmt(t.form) + "</div><div class='l'>Waitlist form leads</div></div>" +
    "<div class='card g'><div class='v'>" + fmt(t.score) + "</div><div class='l'>Conv score &ge; " + J.scoreMin + "</div></div>" +
    "<div class='card b'><div class='v'>" + fmt(t.intl) + "</div><div class='l'>International</div></div>" +
    "<div class='card r'><div class='v'>" + fmt(t.needs) + "</div><div class='l'>Needs owner</div></div>" +
    "<div class='card a'><div class='v'>" + fmt(t.overdue) + "</div><div class='l'>Follow-up overdue</div></div>" +
    "<div class='card a'><div class='v'>" + fmt(t.nofu) + "</div><div class='l'>No follow-up set</div></div>" +
    "<div class='card r'><div class='v'>" + fmt(t.uncalled) + "</div><div class='l'>Never called</div></div>" +
    "<div class='card'><div class='v'>" + fmt(t.total) + "</div><div class='l'>All leads in view</div></div>" +
    "</div>";
}

function drawMatrix(){
  var h = "<div class='sec'><h2>Stage × priority segment</h2><div class='sub'>Click any number to open that call list below. Segments overlap; <b>Any priority</b> is the deduped queue. <b>Needs owner</b> counts priority leads that are unassigned or held by a deactivated agent, so they can be reassigned before they are missed. The <b>DNP</b> row is a rescue row: it only contains DNP leads that submitted a waitlist form or score &ge;" + J.scoreMin + ", not the whole DNP bucket.</div>";
  h += "<div class='tw'><table><thead><tr><th>Stage</th><th style='text-align:right'>Form leads</th><th style='text-align:right'>Conv score &ge;" + J.scoreMin + "</th><th style='text-align:right'>International</th><th style='text-align:right'>Any priority</th><th style='text-align:right'>Needs owner</th><th style='text-align:right'>All in stage</th><th style='text-align:right'>FU overdue</th><th style='text-align:right'>No FU</th><th style='text-align:right'>Never called</th></tr></thead><tbody>";
  var hv = heats(J.matrix, ["form","score","intl","any","needs","total","overdue","nofu","uncalled"]);
  J.matrix.forEach(function(r){
    h += "<tr><td>" + chip(r.stage, r.label) + "</td>";
    h += cell(r.form, r.stage, "form", "", hv(r, "form"));
    h += cell(r.score, r.stage, "score", "", hv(r, "score"));
    h += cell(r.intl, r.stage, "intl", "", hv(r, "intl"));
    h += cell(r.any, r.stage, "any", "", hv(r, "any"));
    h += cell(r.needs, r.stage, "needs", "", hv(r, "needs"));
    h += cell(r.total, r.stage, "all", "", hv(r, "total"));
    h += cell(r.overdue, r.stage, "fu_overdue", r.overdue ? "cr" : "", hv(r, "overdue"));
    h += cell(r.nofu, r.stage, "fu_none", r.nofu ? "ca" : "", hv(r, "nofu"));
    h += cell(r.uncalled, r.stage, "uncalled", r.uncalled ? "cr" : "", hv(r, "uncalled")) + "</tr>";
  });
  var t = J.totals;
  h += "<tr class='tot'><td>TOTAL</td>";
  h += cell(t.form, "", "form") + cell(t.score, "", "score") + cell(t.intl, "", "intl") + cell(t.any, "", "any") + cell(t.needs, "", "needs") + cell(t.total, "", "all");
  h += cell(t.overdue, "", "fu_overdue") + cell(t.nofu, "", "fu_none") + cell(t.uncalled, "", "uncalled") + "</tr>";
  h += "</tbody></table></div></div>";
  return h;
}

function drawAgents(){
  if (ME || S.agent) return "";
  var h = "<div class='sec'><h2>Must-call load by agent</h2><div class='sub'>Click a row to filter the whole page to that agent.</div>";
  h += "<div class='tw'><table><thead><tr><th>Agent</th><th style='text-align:right'>Must call</th><th style='text-align:right'>Form</th><th style='text-align:right'>Score</th><th style='text-align:right'>Intl</th><th style='text-align:right'>All leads</th><th style='text-align:right'>Must call %</th><th>Agent link</th></tr></thead><tbody>";
  J.agents.forEach(function(a){
    if (!a.id) return;
    h += "<tr class='rowlink' onclick=\"setF('agent','" + esc(a.id) + "')\"><td><b>" + esc(a.name) + "</b></td>" +
      "<td class='n'><b>" + fmt(a.any) + "</b></td><td class='n'>" + fmt(a.form) + "</td><td class='n'>" + fmt(a.score) + "</td><td class='n'>" + fmt(a.intl) + "</td>" +
      "<td class='n mut'>" + fmt(a.total) + "</td><td class='n'>" + (a.total ? (100 * a.any / a.total).toFixed(1) : "0") + "%</td>" +
      "<td><a class='a2' href='/callnow.html?id=" + esc(a.id) + "' onclick='event.stopPropagation()'>open</a></td></tr>";
  });
  h += "</tbody></table></div></div>";
  return h;
}

function why(r){
  var h = "";
  r.forms.forEach(function(f){ h += "<span class='tag f'>" + esc(f) + "</span>"; });
  if (r.score >= J.scoreMin) h += "<span class='tag s'>score " + r.score + "</span>";
  if (r.intl) h += "<span class='tag i'>INTL</span>";
  return h || "<span class='mut'>–</span>";
}

function drawLeads(){
  if (!L) return "";
  if (L.loading) return "<div class='sec'><div class='sub'>Loading leads...</div></div>";
  var segName = { form: "Waitlist form leads", score: "Conv score ≥ " + J.scoreMin, intl: "International", any: "Any priority", needs: "Priority leads needing an owner", fu_overdue: "Follow-up overdue", fu_none: "No follow-up set", uncalled: "Never called", all: "All leads" }[S.cellSeg] || "Leads";
  var stName = S.cellStage ? (J.stageGroups.labels[S.cellStage] || S.cellStage) : "All stages in view";
  var rows = L.rows;
  if (S.q) {
    var q = S.q.toLowerCase();
    rows = rows.filter(function(r){ return (r.name + " " + r.creator + " " + r.ownerName).toLowerCase().indexOf(q) >= 0; });
  }
  var h = "<div class='sec' id='leadsec'><h2>" + esc(stName) + " · " + esc(segName) + "</h2>";
  h += "<div class='sub'>" + fmt(L.total) + " leads" + (L.total > L.shown ? " (showing first " + fmt(L.shown) + ")" : "") + " · ordered by form lead, then conversion score, then overdue follow-up, then longest since last call</div>";
  h += "<div class='chips' style='margin-bottom:9px'>";
  h += "<button class='chipb" + (S.fu === "overdue" ? " on" : "") + "' onclick=\"setFu('overdue')\">FU overdue</button>";
  h += "<button class='chipb" + (S.fu === "today" ? " on" : "") + "' onclick=\"setFu('today')\">FU today</button>";
  h += "<button class='chipb" + (S.fu === "none" ? " on" : "") + "' onclick=\"setFu('none')\">No FU set</button>";
  h += "<input type='search' placeholder='search name / creator / agent' value='" + esc(S.q) + "' oninput=\"S.q=this.value;draw()\" style='min-width:210px'>";
  h += "<button class='btn p' onclick='exportCsv()'>Export CSV</button>";
  h += "</div>";
  h += "<div class='tw'><table><thead><tr><th>#</th><th>Lead</th><th>Stage</th><th>Why call</th><th>Agent</th><th>Creator</th><th>Last call</th><th>Follow-up</th><th style='text-align:right'>Calls in stage</th><th style='text-align:right'>By owner</th><th style='text-align:right'>Days in stage</th><th>HubSpot</th></tr></thead><tbody>";
  rows.forEach(function(r, i){
    var od = r.fu && r.fu < Date.now();
    h += "<tr><td class='mut'>" + (i + 1) + "</td>" +
      "<td><a class='a2' href='" + hsUrl(r.id) + "' target='_blank'>" + esc(r.name) + "</a></td>" +
      "<td>" + chip(r.stage, J.stageGroups.labels[r.stage] || r.stage) + "</td>" +
      "<td>" + why(r) + "</td>" +
      "<td>" + (r.unassigned ? "<span class='tag o'>UNASSIGNED</span>" : (esc(r.ownerName) + (r.inactive ? " <span class='tag o'>INACTIVE</span>" : ""))) + "</td>" +
      "<td>" + esc(r.creator || "–") + "</td>" +
      "<td class='" + (r.last ? "" : "cr") + "'>" + (r.last ? dt(r.last) : "never called") + "</td>" +
      "<td class='" + (od ? "cr" : (r.fu ? "" : "ca")) + "'>" + (r.fu ? dt(r.fu) + (od ? " (overdue)" : "") : "not set") + "</td>" +
      "<td class='n'>" + fmt(r.calls) + "</td><td class='n'>" + fmt(r.own) + "</td>" +
      "<td class='n mut'>" + (r.entered ? fmt(days(r.entered)) : "–") + "</td>" +
      "<td><a class='a2' href='" + hsUrl(r.id) + "' target='_blank'>open ↗</a></td></tr>";
  });
  h += "</tbody></table></div></div>";
  return h;
}

function exportCsv(){
  if (!L || !L.rows) return;
  var head = ["Name","Stage","Forms","Conversion score","International","Agent","Owner state","Creator","Last call","Follow up","Calls in stage","Calls by owner","Days in stage","HubSpot URL"];
  var lines = [head.join(",")];
  L.rows.forEach(function(r){
    var v = [r.name, (J.stageGroups.labels[r.stage] || r.stage), r.forms.join(" | "), r.score || "", r.intl ? "Yes" : "No",
      r.ownerName, (r.unassigned ? "Unassigned" : (r.inactive ? "Deactivated owner" : "Active")), r.creator, r.last ? new Date(r.last).toISOString() : "", r.fu ? new Date(r.fu).toISOString() : "",
      r.calls, r.own, r.entered ? days(r.entered) : "", hsUrl(r.id)];
    lines.push(v.map(function(x){ return '"' + String(x == null ? "" : x).replace(/"/g, '""') + '"'; }).join(","));
  });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "call_now_" + (S.cellStage || "all") + "_" + (S.cellSeg || "any") + ".csv";
  a.click();
}

function draw(){
  var h = "";
  if (J.error) h += "<div class='warn'>Lead sync error: " + esc(J.error) + "</div>";
  if (J.formsError) h += "<div class='warn'>" + esc(J.formsError) + "</div>";
  if (J.syncing) h += "<div class='warn'>Lead sync running - numbers may be partial.</div>";
  h += drawFilters() + drawCards() + drawMatrix() + drawLeads() + drawAgents();
  var meta = "Leads synced " + (J.loadedAt ? new Date(J.loadedAt).toLocaleString("en-IN") : "-") +
    " · forms " + (J.formsLoadedAt ? new Date(J.formsLoadedAt).toLocaleString("en-IN") + " (" + esc(J.formsSource) + ")" : "pending");
  h += "<div class='mut' style='font-size:10.5px;margin-top:6px'>" + meta + "</div>";
  document.getElementById("app").innerHTML = h;
  var badge = "";
  if (ME) {
    var me = (J.agentOptions || []).filter(function(a){ return a.id === ME; })[0];
    badge = "<span class='mebadge'>" + esc(me ? me.name : "Owner " + ME) + "</span>";
    document.getElementById("sub").textContent = "Your priority call list - waitlist form leads, conversion score, international";
  }
  document.getElementById("whobadge").innerHTML = badge;
}
load();
setInterval(function(){ if (!LOADING) load(); }, 10 * 60 * 1000);
</script>
