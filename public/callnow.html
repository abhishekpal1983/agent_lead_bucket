<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Call Now - priority queue</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F6F9FC;color:#0A2540;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.hdr{background:#fff;border-bottom:1px solid #E3E8EE;padding:13px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:15px;font-weight:600;letter-spacing:-.01em;color:#0A2540}
.hdr p{font-size:12px;color:#697386}
.livebadge{background:#FF7A59;color:#fff;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px}
.mebadge{background:#E4F4F8;color:#005B6E;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px}
.wrap{max-width:1680px;margin:0 auto;padding:16px 22px 44px}
.bar{background:#fff;border:1px solid #E3E8EE;border-radius:8px;padding:9px 13px;margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.bar label{font-size:10.5px;color:#8B99A8;font-weight:500;display:block;margin-bottom:3px}
select,input[type=search]{border:1px solid #E3E8EE;border-radius:6px;padding:5px 9px;font-size:12.5px;background:#fff;font-family:inherit;min-width:132px;color:#0A2540}
select:hover,input[type=search]:hover{border-color:#C9D2DD}
select:focus,input[type=search]:focus{outline:none;border-color:#0091AE;box-shadow:0 0 0 3px #E4F4F8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid #E3E8EE;background:#fff;border-radius:16px;padding:4px 11px;font-size:11.5px;font-weight:500;cursor:pointer;color:#425B76}
.chipb:hover{background:#F7FAFC;border-color:#C9D2DD}
.chipb.on{background:#0A2540;color:#fff;border-color:#0A2540}
.btn{border:1px solid #E3E8EE;background:#fff;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#425B76}
.btn:hover{background:#F7FAFC}
.btn.p{background:#FF7A59;color:#fff;border-color:#FF7A59}
.btn.p:hover{background:#EE6A49}
.mstrip{display:grid;grid-template-columns:186px minmax(0,1fr);gap:10px;margin-bottom:12px}
@media(max-width:940px){.mstrip{grid-template-columns:1fr}}
.mhero{background:#0A2540;border-radius:8px;padding:12px 16px;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.mhero:hover{background:#123152}
.mhero .v{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.mhero .l{font-size:11px;color:#8FA6BF;margin-top:2px}
.mhero .s{font-size:11px;color:#C7D6E4;margin-top:7px;border-top:1px solid #1E3D5F;padding-top:6px}
.mgroups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:860px){.mgroups{grid-template-columns:1fr}}
.mgroup{background:#fff;border:1px solid #E3E8EE;border-radius:8px;padding:9px 13px 10px}
.mgroup.alert{border-color:#F8C6B4}
.mgroup h4{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#8B99A8;font-weight:600;margin-bottom:7px}
.prog{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.prog .big{font-size:19px;font-weight:600;color:#0A2540;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.prog .of{font-size:12px;color:#697386}
.prog .pc{margin-left:auto;font-size:12px;font-weight:600;color:#005B6E;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:3px;background:#EDF1F5;overflow:hidden;margin-bottom:8px;display:flex}
.track i{display:block;height:6px}
.track i.done{background:#0091AE}
.track i.miss{background:#FF7A59}
.mrow{display:flex;gap:16px;flex-wrap:wrap}
.mitem{cursor:pointer;min-width:52px}
.mitem:hover .v{text-decoration:underline}
.mitem .v{font-size:17px;font-weight:600;letter-spacing:-.01em;color:#0A2540;line-height:1.15;font-variant-numeric:tabular-nums}
.mitem .l{font-size:10.5px;color:#697386;margin-top:1px}
.mitem.z .v{color:#C1C9D2}
.mitem.r .v{color:#C5401A}.mitem.c .v{color:#005B6E}.mitem.a .v{color:#B8791A}
.csync{background:#fff;border:1px solid #E3E8EE;border-radius:8px;padding:8px 13px;margin-bottom:12px;font-size:12px;color:#425B76}
.csync summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.csync summary::-webkit-details-marker{display:none}
.csync .cbody{margin-top:9px;padding-top:9px;border-top:1px solid #F0F3F7;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sec{background:#fff;border:1px solid #E3E8EE;border-radius:8px;margin-bottom:14px;padding:14px 16px}
.sec h2{font-size:14px;font-weight:600;margin-bottom:2px;letter-spacing:-.01em;color:#0A2540}
.sec .sub{font-size:12px;color:#697386;margin-bottom:11px;line-height:1.55}
.sec.hero{padding:15px 17px}
.sec.mini{padding:11px 14px}
.sec.mini .sub{font-size:11.5px;margin-bottom:8px}
.sec.mini table{font-size:12.5px;table-layout:fixed;width:100%}
.sec.mini td{padding:6px 6px;overflow:hidden;text-overflow:ellipsis}
.sec.mini th{padding:7px 6px;white-space:normal;line-height:1.25;vertical-align:bottom}
.sec.mini th:first-child,.sec.mini td:first-child{width:19%}
.sec.mini .sub3{font-size:10.5px;white-space:normal}
.sec.mini .tw{max-height:none}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;border-top:1px solid #F0F3F7;padding-top:8px;margin-top:2px}
.tw{max-height:76vh;overflow:auto;border:1px solid #E3E8EE;border-radius:8px}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
th{background:#F7FAFC;padding:9px 12px;text-align:left;font-size:10.5px;font-weight:600;color:#697386;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:3;border-bottom:1px solid #E3E8EE}
th:first-child{left:0;z-index:4}
td{padding:9px 12px;border-bottom:1px solid #F0F3F7;white-space:nowrap;color:#0A2540}
td:first-child{position:sticky;left:0;background:#fff;z-index:2;border-left:3px solid transparent}
tr:last-child td{border-bottom:none}
tr.tot td{background:#F7FAFC;font-weight:600;border-top:2px solid #E3E8EE;vertical-align:top}
tr.tot td:first-child{background:#F7FAFC}
tr.alert td:first-child{border-left-color:#FF7A59}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.cell{text-align:right;cursor:pointer;font-variant-numeric:tabular-nums}
td.cell:hover{box-shadow:inset 0 0 0 1px #0091AE}
td.cell.sel{background:#0A2540;color:#fff;font-weight:600}
td.cell.sel *{color:#fff !important}
td.z{color:#C1C9D2}
.cg{color:#005B6E}.cr{color:#C5401A}.ca{color:#8A5A00}.mut{color:#C1C9D2}
.sub3{font-size:10.5px;font-weight:400;color:#697386;margin-top:2px;letter-spacing:.01em;white-space:nowrap}
.sub3+.sub3{margin-top:1px}
.sub3 b{font-weight:600;cursor:pointer}
.sub3 b:hover{text-decoration:underline}
.sub3 .d{color:#425B76}.sub3 .c{color:#005B6E}.sub3 .m{color:#C5401A}
.st{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:4px;white-space:nowrap;display:inline-block}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;white-space:nowrap;margin-right:4px;display:inline-block}
.tag.p{background:#EFF2F5;color:#425B76}
.tag.rf{background:#FF7A59;color:#fff}
.tag.src{background:#fff;color:#697386;border:1px solid #E3E8EE}
.tag.paid{background:#00655A;color:#fff}
.tag.opt{background:#525252;color:#fff}
.ph{font-variant-numeric:tabular-nums;color:#0A2540}
.ico{color:#0091AE;text-decoration:none;font-weight:600;margin-left:6px}
.ico:hover{text-decoration:underline}
tr.det td{background:#F7FAFC;white-space:normal;font-size:12px;color:#425B76;padding:10px 14px;line-height:1.6}
tr.det b{color:#0A2540}
.exp{cursor:pointer;color:#697386;font-weight:600;user-select:none}
.tag.f{background:#EDE9FE;color:#4B2E9E}.tag.s{background:#E4F4F8;color:#005B6E}.tag.i{background:#E6EEF7;color:#1C4B7E}.tag.o{background:#FDEDE8;color:#8C2D12}
.pill{background:#FF7A59;color:#fff;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:4px;display:inline-block;font-variant-numeric:tabular-nums}
.pill.w{background:#B8791A}
.a2{color:#0091AE;text-decoration:none;font-weight:600}
.a2:hover{text-decoration:underline}
#loading{padding:60px;text-align:center;color:#697386}
.spin{width:26px;height:26px;border:2.5px solid #E3E8EE;border-top-color:#FF7A59;border-radius:50%;margin:0 auto 12px;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:#FDF3E7;color:#8A5A00;border:1px solid #F5DFBE;border-radius:6px;padding:9px 13px;font-size:12.5px;margin-bottom:12px}
.rowlink{cursor:pointer}
.rowlink:hover td{background:#F7FAFC}
.rowlink:hover td:first-child{background:#F7FAFC}
.mbar{display:inline-block;height:5px;border-radius:3px;background:#0091AE;vertical-align:middle;margin-right:7px;min-width:2px}
</style>
</head>
<body>
<div class="hdr">
  <h1>Call Now</h1>
  <span class="livebadge">MUST CALL</span>
  <span id="whobadge"></span>
  <p id="sub">Priority leads by stage: waitlist form submitters, conversion score, international</p>
  <a href="/" style="font-size:11px;color:#4338CA;margin-left:auto">&larr; dashboard</a>
</div>
<div class="wrap">
  <div id="loading"><div class="spin"></div>Loading priority queue...</div>
  <div id="app" style="display:none"></div>
</div>
<script>
var QS = new URLSearchParams(location.search);
var ME = QS.get("id") || "";
var WHO = null;
var S = {
  agent: ME || (localStorage.getItem("cn_agent") || ""),
  creator: QS.get("creator") || localStorage.getItem("cn_creator") || "",
  intl: localStorage.getItem("cn_intl") || "",
  ostate: "",
  scope: localStorage.getItem("cn_scope") || "tracked",
  stagesOpen: false,
  csyncOpen: false,
  stages: null,
  fu: "",
  cellStage: "", cellSeg: "",
  q: ""
};
var J = null, L = null, LOADING = false, SYNCING_OWNER = false, OWNER_MSG = "", SCROLL = false;

function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
function fmt(n){ return Math.round(n || 0).toLocaleString("en-IN"); }
function dt(x){ return x ? new Date(x).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "–"; }
function days(x){ return x ? Math.floor((Date.now() - x) / 86400000) : null; }
function ago(x){
  if (!x) return "";
  var m = Math.floor((Date.now() - x) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  if (m < 1440) return Math.floor(m / 60) + "h ago";
  return Math.floor(m / 1440) + "d ago";
}
function toggleDet(i){
  var el = document.getElementById("det" + i);
  if (el) el.style.display = el.style.display === "none" ? "" : "none";
}
function qsStr(extra){
  var p = new URLSearchParams();
  if (S.agent) p.set("agent", S.agent);
  if (S.creator) p.set("creator", S.creator);
  if (S.intl) p.set("intl", S.intl);
  if (S.ostate) p.set("ostate", S.ostate);
  if (S.scope) p.set("scope", S.scope);
  if (S.stages && S.stages.length) p.set("stages", S.stages.join(","));
  if (extra) Object.keys(extra).forEach(function(k){ if (extra[k]) p.set(k, extra[k]); });
  return p.toString();
}
function save(){
  if (!ME) localStorage.setItem("cn_agent", S.agent);
  localStorage.setItem("cn_creator", S.creator);
  localStorage.setItem("cn_intl", S.intl);
  localStorage.setItem("cn_scope", S.scope);
}

function refreshOwner(id, then){
  if (!id || SYNCING_OWNER) { if (then) then(); return; }
  SYNCING_OWNER = true; OWNER_MSG = "Pulling the latest leads for this agent from HubSpot...";
  if (J) draw();
  fetch("/api/callnow/refresh-owner/" + encodeURIComponent(id), { method: "POST" })
    .then(function(r){ return r.json(); })
    .then(function(j){
      SYNCING_OWNER = false;
      OWNER_MSG = j && j.error ? ("Could not refresh this agent: " + j.error)
        : (j && j.skipped ? "" : "Bucket refreshed just now" + (j && j.staged !== undefined ? " · " + j.staged + " staged, " + j.fresh + " fresh" : ""));
      if (then) then(); else load();
    })
    .catch(function(e){ SYNCING_OWNER = false; OWNER_MSG = "Could not refresh: " + e.message; if (then) then(); else load(); });
}

function load(){
  LOADING = true;
  fetch("/api/callnow?" + qsStr()).then(function(r){
    if (r.status === 401) { location.href = "/login.html"; return null; }
    if (r.status === 403) return r.json().then(function(x){ throw new Error(x.error || "access denied"); });
    if (!r.ok) throw new Error("server returned " + r.status);
    return r.json();
  }).then(function(j){
    if (!j) return;
    J = j;
    if (!S.stages) S.stages = j.stageGroups.priority.slice();
    LOADING = false;
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "";
    draw();
    if (S.cellStage || S.cellSeg) loadLeads();
  }).catch(function(e){
    document.getElementById("loading").innerHTML = "<div class='warn'>Could not load: " + esc(e.message) + "</div>" +
      (WHO && WHO.email ? "<div style='font-size:11.5px;color:#8B99A8;margin-top:8px'>Signed in as " + esc(WHO.email) +
        ", role " + esc(WHO.role) + ". <a href='/auth/logout' style='color:#0091AE'>Sign out</a></div>" : "");
  });
}
var KIND = {
  needs:      { seg: "any", ostate: "needs" },
  due:        { seg: "any", today: "due" },
  touched:    { seg: "any", today: "touched" },
  bwork:      { seg: "any", today: "bwork" },
  done:       { seg: "any", today: "done" },
  missed:     { seg: "any", today: "missed" },
  fu_overdue: { seg: "any", fu: "overdue" },
  fu_none:    { seg: "any", fu: "none" },
  uncalled:   { seg: "any", uncalled: "1" }
};
function loadLeads(){
  var kind = S.cellSeg || "any";
  var base = KIND[kind];
  if (!base) {
    if (kind.indexOf("|") > 0) {
      var pp = kind.split("|");
      base = pp[1] === "back" ? { seg: pp[0], backlog: "1" } : { seg: pp[0], today: pp[1] };
      if (pp[1] === "bwork") base = { seg: pp[0], today: "bwork" };
    } else { base = { seg: kind }; }
  }
  var extra = { stage: S.cellStage, limit: "1500" };
  Object.keys(base).forEach(function(k){ extra[k] = base[k]; });
  if (S.fu) extra.fu = S.fu;
  var u = "/api/callnow/leads?" + qsStr(extra);
  L = { loading: true };
  SCROLL = true;
  draw();
  fetch(u).then(function(r){
    if (r.status === 401) { location.href = "/login.html"; return null; }
    if (!r.ok) throw new Error("server returned " + r.status);
    return r.json();
  }).then(function(j){
    if (!j) return;
    L = j;
    draw();
  }).catch(function(e){
    L = { total: 0, shown: 0, rows: [], err: e.message };
    draw();
  });
}
function pick(stage, seg){
  if (S.cellStage === stage && S.cellSeg === seg) { S.cellStage = ""; S.cellSeg = ""; L = null; draw(); return; }
  S.cellStage = stage; S.cellSeg = seg; loadLeads();
}
function setF(k, v){ S[k] = v; S.cellStage = ""; S.cellSeg = ""; L = null; save(); load(); }
function toggleStage(s){
  var i = S.stages.indexOf(s);
  if (i >= 0) S.stages.splice(i, 1); else S.stages.push(s);
  S.cellStage = ""; S.cellSeg = ""; L = null; load();
}
function presetStages(which){
  if (which === "p") S.stages = J.stageGroups.priority.slice();
  else if (which === "a") S.stages = J.stageGroups.priority.concat(J.stageGroups.other);
  else S.stages = J.stageGroups.other.slice();
  S.cellStage = ""; S.cellSeg = ""; L = null; load();
}
function setFu(v){ S.fu = (S.fu === v ? "" : v); if (S.cellSeg) loadLeads(); else draw(); }
function syncCreator(){
  var el = document.getElementById("csel");
  var c = el ? el.value : "";
  if (!c || SYNCING_OWNER) return;
  SYNCING_OWNER = true; OWNER_MSG = "Pulling fresh leads for " + c + " from HubSpot...";
  draw();
  fetch("/api/callnow/sync-creator?creator=" + encodeURIComponent(c), { method: "POST" })
    .then(function(r){ return r.json(); })
    .then(function(j){
      SYNCING_OWNER = false;
      OWNER_MSG = j.error ? ("Creator sync failed: " + j.error) : (c + " synced: " + j.added + " fresh leads, " + j.creators.length + " creators tracked");
      load();
    })
    .catch(function(e){ SYNCING_OWNER = false; OWNER_MSG = "Creator sync failed: " + e.message; draw(); });
}
function dropCreator(c){
  if (SYNCING_OWNER) return;
  SYNCING_OWNER = true; OWNER_MSG = "Removing " + c + "...";
  draw();
  fetch("/api/callnow/drop-creator?creator=" + encodeURIComponent(c), { method: "POST" })
    .then(function(r){ return r.json(); })
    .then(function(){ SYNCING_OWNER = false; OWNER_MSG = c + " removed from creator fresh sync"; load(); })
    .catch(function(e){ SYNCING_OWNER = false; OWNER_MSG = e.message; draw(); });
}
function setOstate(v){ S.ostate = (S.ostate === v ? "" : v); S.cellStage = ""; S.cellSeg = ""; L = null; load(); }

var STAGE_CHIP = {
  payment_prospect: "#E3EEFB|#00447A", dnp_did_not_pick: "#FBE3D3|#7A2800", dnp_other: "#F2F2F4|#525252", ghosted: "#FBE3D3|#7A2800",
  ni_not_interested: "#FBE3D3|#7A2800",
  disqualified: "#FADFDA|#99301C", deal_won: "#DFEFE6|#15613F"
};
function chip(stage, label){
  var c = (STAGE_CHIP[stage] || "#F2F2F4|#525252").split("|");
  return "<span class='st' style='background:" + c[0] + ";color:" + c[1] + "'>" + esc(label) + "</span>";
}
function hsUrl(id){
  var p = (J && J.portal) || { uiDomain: "app-na2.hubspot.com", portalId: "244132076" };
  return "https://" + p.uiDomain + "/contacts/" + p.portalId + "/record/0-1/" + id;
}

function cell(v, stage, seg, cls, heat){
  var sel = (S.cellStage === stage && S.cellSeg === seg) ? " sel" : "";
  var z = v ? "" : " z";
  var bg = (!sel && heat > 0) ? " style='background:rgba(0,87,184," + (0.05 + 0.25 * heat).toFixed(3) + ")'" : "";
  return "<td class='cell" + sel + z + (cls && !sel ? " " + cls : "") + "'" + bg + " onclick=\"pick('" + stage.replace(/'/g, "\\'") + "','" + seg + "')\">" + fmt(v) + "</td>";
}
function totCell(v, seg, t){
  t = t || { due: 0, back: 0, done: 0, missed: 0, bwork: 0 };
  var b = function(cls, val, lbl, kind, tip){
    return "<b class='" + cls + "' title='" + tip + "' onclick=\"event.stopPropagation();pick('','" + seg + "|" + kind + "')\">" + fmt(val) + "</b> " + lbl;
  };
  var sub = "<div class='sub3'>" +
    b("d", t.due, "due", "due", "Follow-up falls today") + " · " +
    b("c", t.done, "called", "done", "Due today and called today") + " · " +
    b("m", t.missed, "missed", "missed", "Due today and not called yet") +
    "</div><div class='sub3'>" +
    b("m", t.back, "backlog", "back", "No follow-up set, or follow-up already past, or never called. Deduped.") + " · " +
    b("c", t.bwork, "worked", "bwork", "Calls made today on leads that were not scheduled for today, so backlog being burned down") +
    "</div>";
  var sel = (S.cellStage === "" && S.cellSeg === seg) ? " sel" : "";
  return "<td class='cell" + sel + "' onclick=\"pick('','" + seg + "')\">" + fmt(v) + sub + "</td>";
}
function heats(rows, keys){
  var mx = {};
  keys.forEach(function(k){ mx[k] = 0; rows.forEach(function(r){ if (r[k] > mx[k]) mx[k] = r[k]; }); });
  return function(r, k){ return mx[k] ? Math.sqrt(r[k] / mx[k]) : 0; };
}

function drawFilters(){
  var h = "<div class='bar'>";
  if (!ME) {
    h += "<div><label>Agent</label><select onchange=\"setF('agent',this.value)\"><option value=''>All agents</option>";
    J.agentOptions.forEach(function(a){
      h += "<option value='" + esc(a.id) + "'" + (S.agent === a.id ? " selected" : "") + ">" + esc(a.name) + (a.active ? "" : " (inactive)") + " · " + fmt(a.n) + "</option>";
    });
    h += "</select></div>";
  }
  h += "<div><label>Creator</label><select onchange=\"setF('creator',this.value)\"><option value=''>" +
    (S.scope === "tracked" ? "All tracked creators" : "All creators") + "</option>";
  J.creatorOptions.forEach(function(c){
    h += "<option value='" + esc(c.u) + "'" + (S.creator === c.u ? " selected" : "") + ">" + esc(c.u) + " · " + fmt(c.n) + "</option>";
  });
  h += "</select></div>";

    (r.formAfterStage ? ", most recently after this stage was set" : "") + "'>Refill ×" + r.formN + "</span>";

  if (r.score >= J.scoreMin) h += "<span class='tag s'>score " + r.score + "</span>";
  if (r.intl) h += "<span class='tag i'>INTL</span>";
  if (r.paid) h += "<span class='tag paid'>ALREADY PAID</span>";
  if (r.optout) h += "<span class='tag opt'>OPTED OUT</span>";

      (r.sp === "S" ? "Student" : r.sp === "P" ? "Professional" : ""),
      r.ownerName, (r.unassigned ? "Unassigned" : (r.inactive ? "Deactivated owner" : "Active")), r.creator, r.last ? new Date(r.last).toISOString() : "", r.fu ? new Date(r.fu).toISOString() : "",
      r.calls, r.own, r.entered ? days(r.entered) : "", hsUrl(r.id)];

  if (SYNCING_OWNER) h += "<div class='warn'>" + esc(OWNER_MSG) + "</div>";
  else if (OWNER_MSG) h += "<div class='warn' style='background:#F1F7FF;border-color:#CFE2F7;color:#00447A'>" + esc(OWNER_MSG) + "</div>";
  h += drawFilters() + drawCsync() + drawCards() + drawAgents() + drawMatrix() + drawLeads();
  var meta = "Leads synced " + (J.loadedAt ? new Date(J.loadedAt).toLocaleString("en-IN") : "-") +
    " · forms " + (J.formsLoadedAt ? new Date(J.formsLoadedAt).toLocaleString("en-IN") + " (" + esc(J.formsSource) + ")" : "pending") +
    " · creator fresh " + (J.pfreshLoadedAt ? fmt(J.pfreshCount) + " leads across " + (J.pfreshCreators || []).length + " creators" : "pending");
  h += "<div class='mut' style='font-size:10.5px;margin-top:6px'>" + meta + "</div>";
  document.getElementById("app").innerHTML = h;
  if (SCROLL) {
    SCROLL = false;
    setTimeout(function(){
      var el = document.getElementById("leadsec");
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 30);
  }
  var badge = "";
  if (WHO && WHO.authOn && WHO.email) {
    badge = "<span class='mebadge'>" + esc(WHO.name || WHO.email) + "</span>" +
      "<a href='/auth/logout' style='font-size:11px;color:#697386;text-decoration:none;margin-left:2px'>Sign out</a>";
  }
  if (ME) {
    var me = (J.agentOptions || []).filter(function(a){ return a.id === ME; })[0];
    if (!badge) badge = "<span class='mebadge'>" + esc(me ? me.name : "Owner " + ME) + "</span>";
    document.getElementById("sub").textContent = "Your priority call list - waitlist form leads, conversion score, international";
  }
  document.getElementById("whobadge").innerHTML = badge;
}
function boot(){
  load();
  // Refresh this owner's bucket in the background. It can take 30s on a large bucket,
  // so it must never gate the first paint.
  if (ME) setTimeout(function(){ refreshOwner(ME); }, 1200);
}
fetch("/api/me").then(function(r){ return r.json(); }).then(function(j){
  WHO = j;
  if (j && j.role === "agent" && j.ownerId) ME = j.ownerId;
  if (j && j.email) {
    var el = document.getElementById("loading");
    if (el) el.innerHTML += "<div style='font-size:11.5px;color:#8B99A8;margin-top:10px'>Signed in as " +
      esc(j.email) + " · role " + esc(j.role || "unknown") + " <a href='/auth/logout' style='color:#0091AE'>sign out</a></div>";
  }
  boot();
}).catch(function(){ boot(); });
setInterval(function(){ if (!LOADING && !SYNCING_OWNER) { if (ME) refreshOwner(ME, load); else load(); } }, 15 * 60 * 1000);
</script>
</body>
</html>
