<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Revenue command</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F6F9FC;color:#0A2540;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.hdr{background:#fff;border-bottom:1px solid #E3E8EE;padding:13px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:1500px;margin:0 auto;padding:16px 22px 60px}
.sec{background:#fff;border:1px solid #E3E8EE;border-radius:8px;margin-bottom:14px;padding:14px 16px}
.sec h2{font-size:14px;font-weight:600;margin-bottom:2px}
.sec .sub{font-size:12px;color:#697386;margin-bottom:11px}
select,input{border:1px solid #E3E8EE;border-radius:6px;padding:6px 9px;font-size:12.5px;background:#fff;font-family:inherit;color:#0A2540}
input:focus,select:focus{outline:none;border-color:#0091AE;box-shadow:0 0 0 3px #E4F4F8}
.btn{border:1px solid #E3E8EE;background:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#425B76}
.btn:hover{background:#F7FAFC}
.btn.p{background:#FF7A59;color:#fff;border-color:#FF7A59}
.btn.d{color:#99301C;border-color:#F8C6B4}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
th{background:#F7FAFC;padding:8px 11px;text-align:left;font-size:10.5px;font-weight:600;color:#697386;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid #E3E8EE}
td{padding:9px 11px;border-bottom:1px solid #F0F3F7;white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:none}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{border:1px solid #E3E8EE;border-radius:8px;overflow:auto}
.mut{color:#8B99A8}
tr.clik{cursor:pointer}
tr.clik:hover td{background:#F7FAFC}
tr.sub td{background:#FBFCFD;font-size:12px}
tr.sub2 td{background:#F5F8FB;font-size:11.5px}
.tw2{border:1px solid #E3E8EE;border-radius:6px;overflow:hidden;margin:2px 0 6px}
.car{display:inline-block;width:12px;color:#8B99A8;font-weight:600}.cg{color:#15613F}.cr{color:#99301C}.ca{color:#8A5A00}
.pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:4px;display:inline-block}
.pill.g{background:#DFEFE6;color:#15613F}.pill.r{background:#FADFDA;color:#99301C}.pill.a{background:#FBEFE2;color:#8A4B08}
.warn{background:#FDF3E7;color:#8A5A00;border:1px solid #F5DFBE;border-radius:6px;padding:9px 13px;font-size:12.5px;margin-bottom:12px}
.warn.bad{background:#FADFDA;border-color:#F0B5AA;color:#99301C}
.strip{display:flex;background:#fff;border:1px solid #E3E8EE;border-radius:8px;margin-bottom:14px;overflow:hidden}
.strip>div{flex:1;padding:11px 15px;border-right:1px solid #F0F3F7}
.strip>div:last-child{border-right:none}
.strip .v{font-size:18px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.strip .l{font-size:11px;color:#697386}
.track{height:6px;border-radius:3px;background:#EDF1F5;overflow:hidden;margin:7px 0 5px;display:flex}
.track i{display:block;height:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pane{border:1px solid #E3E8EE;border-radius:6px;height:158px;overflow:auto;background:#fff}
.ph{position:sticky;top:0;background:#F7FAFC;border-bottom:1px solid #E3E8EE;padding:4px 9px;font-size:9.5px;font-weight:600;color:#8B99A8;letter-spacing:.05em;text-transform:uppercase}
.it{padding:4px 9px;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center;border-bottom:1px solid #F7FAFC}
.it:hover{background:#F0F7FB}
.it .ar{color:#0091AE;font-weight:600;opacity:0;font-size:11px}
.it:hover .ar{opacity:1}
.it.off{color:#B7C0C9;cursor:not-allowed}
.it.off:hover{background:#fff}
.it.on{background:#F7FAFC}
.pane .none{padding:8px 9px;font-size:11.5px;color:#B7C0C9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
#loading{padding:60px;text-align:center;color:#697386}
</style>
</head>
<body>
<div class="hdr">
  <h1>Revenue command</h1>
  <span id="mon"></span>
  <a href="/callnow.html" style="font-size:11px;color:#0091AE;margin-left:auto;text-decoration:none;font-weight:600">Call Now &rarr;</a>
</div>
<div class="wrap">
  <div id="loading">Loading...</div>
  <div id="app" style="display:none"></div>
</div>
<script>
var J = null, EDIT = null, OPEN = {}, OPENC = {};
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function fmt(n){ return Math.round(n||0).toLocaleString("en-IN"); }
function inr(v){ v = Math.round(v||0); return v>=1e7 ? "₹"+(v/1e7).toFixed(2)+"Cr" : v>=1e5 ? "₹"+(v/1e5).toFixed(1)+"L" : "₹"+fmt(v); }
function post(url, body){
  return fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{}) })
    .then(function(r){ return r.json(); });
}
function fail(msg){
  document.getElementById("loading").innerHTML =
    "<div style='max-width:560px;margin:0 auto;text-align:left' class='warn bad'><b>Could not load.</b><br>" +
    esc(msg) + "</div>";
}
function load(month){
  fetch("/api/vp" + (month ? "?month=" + month : ""))
    .then(function(r){
      if (r.status === 401) { location.href = "/login.html"; return null; }
      if (r.status === 404) throw new Error("The /api/vp endpoint is missing, so this deploy does not have the VP build yet. Check the Railway Deployments tab.");
      if (!r.ok) throw new Error("Server returned " + r.status + ". Check the Railway deploy logs.");
      return r.text().then(function(t){
        try { return JSON.parse(t); }
        catch (e) { throw new Error("Server sent something that is not JSON: " + t.slice(0, 160)); }
      });
    })
    .then(function(j){
      if (!j) return;
      J = j;
      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display = "";
      draw();
    })
    .catch(function(e){ fail(e.message); });
}
function draw(){
  var h = "";
  if (!J.persistent) h += "<div class='warn bad'><b>Nothing is being saved.</b> No writable volume is mounted, so teams and targets vanish on the next deploy. In Railway add a Volume mounted at <b>/data</b>.</div>";
  if (!J.isVP) h += "<div class='warn'>Read only. Editing is limited to the emails in VP_EMAILS.</div>";
  h += drawStrip() + drawTeams() + drawDrift() + drawAdmin();
  document.getElementById("app").innerHTML = h;
  document.getElementById("mon").innerHTML = "<select onchange='load(this.value)' style='font-size:12px'>" + monthOpts() + "</select>" +
    "<span style='font-size:11px;color:#697386;margin-left:8px'>day " + J.dayOfMonth + " of " + J.daysInMonth + "</span>";
}
function monthOpts(){
  // Built from the month string the server reports, so IST is authoritative and
  // toISOString cannot shift the current month backwards. Six months either side,
  // because targets are set ahead of the month, not during it.
  var y = Number(J.month.slice(0, 4)), m = Number(J.month.slice(5, 7)) - 1;
  var out = "";
  for (var i = -6; i <= 6; i++) {
    var d = new Date(y, m + i, 1);
    var k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    var lbl = d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
    out += "<option value='" + k + "'" + (k === J.month ? " selected" : "") + ">" + lbl + (i > 0 ? " (future)" : "") + "</option>";
  }
  return out;
}
function drawStrip(){
  var t = 0, a = 0, e = 0, due = 0, done = 0, missed = 0;
  J.teams.forEach(function(x){ t += x.target; a += x.revenue; e += x.enrolments; due += x.due; done += x.done; missed += x.missed; });
  var pace = t * (J.dayOfMonth / J.daysInMonth);
  var att = t ? Math.round(1000 * a / t) / 10 : 0;
  var el = Math.round(1000 * J.dayOfMonth / J.daysInMonth) / 10;
  var gap = Math.round(a - pace);
  return "<div class='strip'><div style='flex:1.6'>" +
    "<div class='v'>" + inr(a) + " <span style='font-size:12px;color:#697386;font-weight:400'>of " + inr(t) + "</span></div>" +
    "<div class='track'><i style='width:" + Math.min(100, att) + "%;background:#0091AE'></i></div>" +
    "<div class='l'>" + att + "% attained · " + el + "% of month elapsed · " +
    (gap >= 0 ? "<span class='cg'>" + inr(gap) + " ahead</span>" : "<span class='cr'>" + inr(-gap) + " behind</span>") + "</div></div>" +
    "<div><div class='v'>" + fmt(e) + "</div><div class='l'>Enrolments</div></div>" +
    "<div><div class='v'>" + fmt(done) + " <span style='font-size:12px;color:#697386;font-weight:400'>of " + fmt(due) + "</span></div><div class='l'>Due calls made today</div></div>" +
    "<div><div class='v " + (missed ? "cr" : "") + "'>" + fmt(missed) + "</div><div class='l'>Missed today</div></div>" +
    "<div><div class='v " + (J.drift.length ? "cr" : "") + "'>" + fmt(J.drift.length) + "</div><div class='l'>Agents unmapped</div></div>" +
    "</div>";
}
function drawTeams(){
  var h = "<div class='sec'><h2>Managers</h2><div class='sub'>Target versus actual for " + J.month + ", with today's call progress. Click a manager to break it down by creator, then a creator to see the agents behind it.</div>";
  if (!J.teams.length) return h + "<div class='mut'>No teams yet. Create one below.</div></div>";
  h += "<div class='tw'><table><thead><tr><th>Manager</th><th class='n'>Target</th><th class='n'>Actual</th><th class='n'>Pace</th><th class='n'>Enrol</th><th class='n'>Queue</th><th class='n'>Due today</th><th class='n'>Called</th><th class='n'>Missed</th><th class='n'>Overdue</th><th class='n'>Never called</th></tr></thead><tbody>";
  J.teams.forEach(function(t){
    var p = t.gap >= 0 ? "<span class='pill g'>+" + inr(t.gap) + "</span>" : "<span class='pill r'>" + inr(-t.gap) + "</span>";
    var open = !!OPEN[t.id];
    h += "<tr class='clik' onclick=\"tog('" + t.id + "')\"><td><span class='car'>" + (open ? "▾" : "▸") + "</span><b>" + esc(t.name || "(unnamed)") + "</b>" +
      "<div class='mut' style='font-size:11px;padding-left:12px'>" + esc(t.managerEmail || "no manager email") + " · " +
      t.agents.length + " agents · " + t.creators.length + " creators</div></td>" +
      "<td class='n'>" + (t.target ? inr(t.target) : "<span class='mut'>not set</span>") + "</td>" +
      "<td class='n'><b>" + inr(t.revenue) + "</b>" + (t.attainment !== null ? "<div class='mut' style='font-size:11px'>" + t.attainment + "%</div>" : "") + "</td>" +
      "<td class='n'>" + (t.target ? p : "<span class='mut'>–</span>") + "</td>" +
      "<td class='n'>" + fmt(t.enrolments) + "</td><td class='n'>" + fmt(t.queue) + "</td><td class='n'>" + fmt(t.due) + "</td>" +
      "<td class='n cg'>" + fmt(t.done) + "</td>" +
      "<td class='n'>" + (t.missed ? "<span class='pill r'>" + fmt(t.missed) + "</span>" : "<span class='mut'>0</span>") + "</td>" +
      "<td class='n " + (t.overdue ? "cr" : "mut") + "'>" + fmt(t.overdue) + "</td>" +
      "<td class='n " + (t.uncalled ? "cr" : "mut") + "'>" + fmt(t.uncalled) + "</td></tr>";
    if (open) h += creatorRows(t);
  });
  h += "</tbody></table></div></div>";
  return h;
}
function tog(id){ OPEN[id] = !OPEN[id]; draw(); }
function togc(tid, u){ var k = tid + "||" + u; OPENC[k] = !OPENC[k]; draw(); }
function creatorRows(t){
  var h = "";
  if (!t.creatorRows.length) {
    return "<tr class='sub'><td colspan='11' class='mut'>No revenue or queue for this team yet.</td></tr>";
  }
  t.creatorRows.forEach(function(c){
    var k = t.id + "||" + c.u, open = !!OPENC[k];
    var gap = c.target ? Math.round(c.revenue - c.target * (J.dayOfMonth / J.daysInMonth)) : null;
    h += "<tr class='sub clik' onclick=\"togc('" + t.id + "','" + esc(c.u).replace(/'/g, "\\'") + "')\">" +
      "<td style='padding-left:26px'><span class='car'>" + (open ? "▾" : "▸") + "</span>" + esc(c.u) +
      (c.mapped ? "" : " <span class='pill a' title='This creator is not mapped to the team, revenue arrived through an agent'>unmapped</span>") + "</td>" +
      "<td class='n'>" + (c.target ? inr(c.target) : "<span class='mut'>not set</span>") + "</td>" +
      "<td class='n'>" + inr(c.revenue) + "</td>" +
      "<td class='n'>" + (gap === null ? "<span class='mut'>–</span>" : (gap >= 0 ? "<span class='pill g'>+" + inr(gap) + "</span>" : "<span class='pill r'>" + inr(-gap) + "</span>")) + "</td>" +
      "<td class='n'>" + fmt(c.enrolments) + "</td><td class='n'>" + fmt(c.queue) + "</td><td class='n'>" + fmt(c.due) + "</td>" +
      "<td class='n cg'>" + fmt(c.done) + "</td>" +
      "<td class='n " + (c.missed ? "cr" : "mut") + "'>" + fmt(c.missed) + "</td>" +
      "<td class='n " + (c.overdue ? "cr" : "mut") + "'>" + fmt(c.overdue) + "</td>" +
      "<td class='n " + (c.uncalled ? "cr" : "mut") + "'>" + fmt(c.uncalled) + "</td></tr>";
    if (open) {
      if (!c.agents.length) h += "<tr class='sub2'><td colspan='11' style='padding-left:48px' class='mut'>No agent activity for this creator.</td></tr>";
      c.agents.forEach(function(a){
        h += "<tr class='sub2'><td style='padding-left:48px'>" + esc(a.name) +
          (a.active ? "" : " <span class='pill a'>inactive</span>") + "</td>" +
          "<td class='n mut'>–</td><td class='n'>" + inr(a.revenue) + "</td><td class='n mut'>–</td>" +
          "<td class='n'>" + fmt(a.enrolments) + "</td><td class='n'>" + fmt(a.queue) + "</td><td class='n'>" + fmt(a.due) + "</td>" +
          "<td class='n cg'>" + fmt(a.done) + "</td>" +
          "<td class='n " + (a.missed ? "cr" : "mut") + "'>" + fmt(a.missed) + "</td>" +
          "<td class='n " + (a.overdue ? "cr" : "mut") + "'>" + fmt(a.overdue) + "</td>" +
          "<td class='n " + (a.uncalled ? "cr" : "mut") + "'>" + fmt(a.uncalled) + "</td></tr>";
      });
    }
  });
  return h;
}
function drawDrift(){
  if (!J.drift.length) return "";
  var h = "<details class='sec' style='padding:10px 14px'><summary style='cursor:pointer;list-style:none;display:flex;gap:9px;align-items:center'>" +
    "<b style='font-size:13px'>Unmapped agents</b><span class='pill r'>" + J.drift.length + "</span>" +
    "<span class='mut' style='font-size:11.5px'>hold " + fmt(J.drift.reduce(function(a, d){ return a + d.leads; }, 0)) + " leads and are missing from every number above</span>" +
    "<span style='margin-left:auto;color:#0091AE;font-weight:600;font-size:12px'>Assign</span></summary>";
  h += "<div class='tw' style='margin-top:9px;max-height:280px;overflow:auto'><table><thead><tr><th>Agent</th><th>Email</th><th class='n'>Leads</th><th>Status</th><th>Assign to</th></tr></thead><tbody>";
  J.drift.forEach(function(d){
    h += "<tr><td><b>" + esc(d.name) + "</b></td><td class='mut'>" + esc(d.email) + "</td>" +
      "<td class='n'>" + fmt(d.leads) + "</td>" +
      "<td>" + (d.active ? "<span class='pill g'>active</span>" : "<span class='pill a'>inactive</span>") + "</td>" +
      "<td><select onchange=\"assign('" + esc(d.id) + "', this.value)\"><option value=''>choose team...</option>" +
      J.teams.map(function(t){ return "<option value='" + t.id + "'>" + esc(t.name || "(unnamed)") + "</option>"; }).join("") +
      "</select></td></tr>";
  });
  h += "</tbody></table></div></details>";
  return h;
}
function assign(agentId, teamId){
  if (!teamId) return;
  SEL = {};
  var t = J.teams.filter(function(x){ return x.id === teamId; })[0];
  if (!t) return;
  var ids = t.agentIds.concat([agentId]);
  post("/api/vp/team", { id: teamId, agentIds: ids }).then(function(){ load(J.month); });
}
function drawAdmin(){
  var h = "<div class='sec'><h2>Teams and targets</h2><div class='sub'>A team is one manager. Agents map to exactly one team; creators can belong to one team each.</div>";
  h += "<div class='grid'>";
  J.teams.forEach(function(t){ h += teamCard(t); });
  h += teamCard({ id: "", name: "", managerEmail: "", agentIds: [], creators: [] });
  h += "</div></div>";
  return h;
}
var SEL = {}, TEAMS_BY_KEY = {};
function cardKey(t){ return t.id || "new"; }
function ensureSel(t){
  var k = cardKey(t);
  TEAMS_BY_KEY[k] = t;
  if (!SEL[k]) SEL[k] = {
    agents: (t.agentIds || []).slice(),
    creators: (t.creators || []).slice(),
    name: t.name || "",
    email: t.managerEmail || "",
    target: (((J.targets.teams || {})[t.id] || {}).revenue) || ""
  };
  return SEL[k];
}
function captureInputs(k){
  var n = document.getElementById("n_" + k), e = document.getElementById("e_" + k), g = document.getElementById("t_" + k);
  if (n) SEL[k].name = n.value;
  if (e) SEL[k].email = e.value;
  if (g) SEL[k].target = g.value;
}
function toggleItem(k, kind, val){
  captureInputs(k);
  var arr = SEL[k][kind], i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
  var el = document.getElementById("card_" + k);
  if (el) el.innerHTML = cardInner(TEAMS_BY_KEY[k]);
}
function pane(title, items, k, kind, side){
  var h = "<div class='pane'><div class='ph'>" + title + "</div>";
  if (!items.length) h += "<div class='none'>" + (side === "in" ? "nothing assigned yet" : "nothing left") + "</div>";
  items.forEach(function(it){
    if (it.off) {
      h += "<div class='it off' title='Already in " + esc(it.off) + "'>" + esc(it.label) + " <span style='font-size:10.5px'>(" + esc(it.off) + ")</span></div>";
    } else {
      h += "<div class='it" + (side === "in" ? " on" : "") + "' onclick=\"toggleItem('" + k + "','" + kind + "','" + esc(it.v).replace(/'/g, "\\'") + "')\">" +
        "<span>" + esc(it.label) + "</span><span class='ar' style='margin-left:auto'>" + (side === "in" ? "remove ✕" : "add →") + "</span></div>";
    }
  });
  return h + "</div>";
}
function teamCard(t){
  ensureSel(t);
  return "<div id='card_" + cardKey(t) + "' style='border:1px solid #E3E8EE;border-radius:8px;padding:12px 13px'>" + cardInner(t) + "</div>";
}
function cardInner(t){
  var k = cardKey(t), sel = SEL[k], isNew = !t.id;
  var h = "<div style='display:flex;gap:8px;margin-bottom:9px'>" +
    "<input id='n_" + k + "' placeholder='Team or manager name' value='" + esc(sel.name) + "' style='flex:1'>" +
    "<input id='e_" + k + "' placeholder='manager@topmate.io' value='" + esc(sel.email) + "' style='flex:1'></div>";

  var agents = allAgents(), inA = [], outA = [];
  agents.forEach(function(o){
    if (sel.agents.indexOf(o.id) >= 0) { inA.push({ v: o.id, label: o.name }); return; }
    var taken = agentTeam(o.id, t.id);
    outA.push({ v: o.id, label: o.name, off: taken });
  });
  h += "<div style='font-size:10.5px;color:#8B99A8;font-weight:600;margin-bottom:4px'>AGENTS · " + inA.length + " assigned</div>";
  h += "<div class='split'>" + pane("Available", outA, k, "agents", "out") + pane("In this team", inA, k, "agents", "in") + "</div>";

  var inC = [], outC = [];
  (J.creators || []).forEach(function(c){
    var label = c.u + "  " + fmt(c.n);
    if (sel.creators.indexOf(c.u) >= 0) { inC.push({ v: c.u, label: label }); return; }
    var taken = creatorTeam(c.u, t.id);
    outC.push({ v: c.u, label: label, off: taken });
  });
  h += "<div style='font-size:10.5px;color:#8B99A8;font-weight:600;margin:10px 0 4px'>CREATORS · " + inC.length + " assigned</div>";
  h += "<div class='split'>" + pane("Available", outC, k, "creators", "out") + pane("In this team", inC, k, "creators", "in") + "</div>";

  h += "<div style='display:flex;gap:8px;margin-top:10px;align-items:center'>" +
    "<span style='font-size:10.5px;color:#8B99A8;font-weight:600'>TARGET ₹</span>" +
    "<input id='t_" + k + "' type='number' placeholder='0' value='" + esc(sel.target) + "' style='width:120px'>" +
    "<button class='btn p' onclick=\"saveTeam('" + (t.id || "") + "')\">" + (isNew ? "Create team" : "Save") + "</button>" +
    (isNew ? "" : "<button class='btn d' onclick=\"delTeam('" + t.id + "')\">Delete</button>") +
    "</div>";
  return h;
}
function allAgents(){
  var m = {};
  J.teams.forEach(function(t){ t.agents.forEach(function(a){ m[a.id] = a; }); });
  (J.drift || []).forEach(function(d){ m[d.id] = { id: d.id, name: d.name, email: d.email, active: d.active }; });
  return Object.values(m).sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); });
}
function agentTeam(id, exceptId){
  var hit = J.teams.filter(function(t){ return t.id !== exceptId && t.agentIds.indexOf(id) >= 0; })[0];
  return hit ? (hit.name || "another team") : "";
}
function creatorTeam(u, exceptId){
  var hit = J.teams.filter(function(t){ return t.id !== exceptId && (t.creators || []).indexOf(u) >= 0; })[0];
  return hit ? (hit.name || "another team") : "";
}
function saveTeam(id){
  var k = id || "new";
  captureInputs(k);
  var body = { id: id, name: SEL[k].name, managerEmail: SEL[k].email, agentIds: SEL[k].agents, creators: SEL[k].creators };
  var target = SEL[k].target;
  post("/api/vp/team", body).then(function(r){
    if (r.error) { alert(r.error); return; }
    SEL = {};
    if (target !== "") {
      return post("/api/vp/target", { month: J.month, scope: "team", key: r.team.id, revenue: Number(target) });
    }
  }).then(function(){ load(J.month); });
}
function delTeam(id){
  if (!confirm("Delete this team? Agents become unmapped.")) return;
  post("/api/vp/team/delete", { id: id }).then(function(){ load(J.month); });
}
load();
</script>
</body>
</html>
