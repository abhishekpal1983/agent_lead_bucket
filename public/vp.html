<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Revenue command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --ink:#0E1220; --ink2:#4A5268; --ink3:#8A91A6; --ink4:#AEB4C6;
  --canvas:#F6F7FC; --surface:#FFFFFF; --line:#EAEBF2; --line2:#F2F3F8;
  --ind:#4F46E5; --ind-d:#3F37C9; --ind-soft:#EEEDFE; --ind-ink:#3730A3;
  --em:#0E9F6E; --em-soft:#E3F7EF; --em-ink:#04624A;
  --rose:#E02D3C; --rose-soft:#FDECEE; --rose-ink:#9B1220;
  --amb:#B45309; --amb-soft:#FEF4E4; --amb-ink:#7C3D06;
  --sh:0 1px 2px rgba(14,18,32,.04), 0 8px 24px -12px rgba(14,18,32,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F7FA;color:#0A2540;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
.nav{background:#0A2540;padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.nav h1{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.01em;padding:0 8px 4px}
.nav .who{font-size:11.5px;color:#7C93AD;padding:0 8px 14px;line-height:1.5}
.nav a,.nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:#A9BED2;font-family:inherit;font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:6px;cursor:pointer;text-decoration:none}
.nav button:hover{background:#12304F;color:#fff}
.nav button.on{background:#0091AE;color:#fff}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:600;background:#12304F;color:#9FB6CC;padding:1px 7px;border-radius:10px}
.nav button.on .cnt{background:#0B7A90;color:#fff}
.nav .cnt.bad{background:#C2410C;color:#fff}
.nav .tools{margin-top:14px;padding-top:11px;border-top:1px solid #12304F}
.nav .tools .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5E7A96;font-weight:600;padding:0 10px 6px}
.nav .tools a{color:#A9BED2;font-size:13px;padding:7px 10px;display:block;text-decoration:none;border-radius:6px}
.nav .tools a:hover{color:#fff;background:#12304F}
.main{padding:18px 22px 50px;max-width:1400px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:16px;cursor:pointer;border:1px solid transparent}
.sync .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sync.ok{background:#DDEFEA;color:#0A5346}.sync.ok .dot{background:#0A5346}
.sync.run{background:#FAEBD7;color:#7A4A08}.sync.run .dot{background:#B8791A;animation:pulse 1.1s infinite}
.sync.old{background:#FBE2D8;color:#8C2D12}.sync.old .dot{background:#8C2D12}
@keyframes pulse{50%{opacity:.25}}
.syncbox{background:#fff;border:1px solid #DCE4EC;border-radius:9px;padding:10px 13px;margin-bottom:12px;font-size:12.5px}
.syncbox .r{display:flex;gap:10px;padding:4px 0;border-top:1px solid #EFF3F7}
.syncbox .r:first-of-type{border-top:none}
.syncbox .r span:last-child{margin-left:auto;color:#566575}
.sec{background:#fff;border:1px solid #DCE4EC;border-radius:10px;margin-bottom:14px;padding:14px 16px}
.sec h2{font-size:15px;font-weight:600;margin-bottom:3px;color:#0A2540}
.sec .sub{font-size:12.5px;color:#566575;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:14px}
/* Six across, half the height: these are progress readings, not headlines. */
.tiles.compact{grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin-bottom:9px}
.tiles.compact .tile{padding:8px 10px;border-radius:9px}
.tiles.compact .tile .v{font-size:17px}
.tiles.compact .tile .l{font-size:11px}
.tiles.compact .tile .sb{font-size:10.5px;margin-top:4px;padding-top:4px}
/* Worked against total, in a table cell, without a second column for the bar. */
.pbar{height:3px;border-radius:3px;background:#EDEFF4;margin-top:3px;overflow:hidden}
.pbar i{display:block;height:3px;border-radius:3px;background:#2E9E7A}
.tile{border-radius:10px;padding:12px 14px}
.tile .v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{font-size:12px;margin-top:1px}
.tile .sb{font-size:11.5px;margin-top:6px;padding-top:5px;border-top:1px solid rgba(10,37,64,.09);opacity:.85}
.tile.hero{grid-column:1 / -1;background:#0A2540}
.tile.hero .v{color:#fff;font-size:26px}
.tile.hero .l{color:#93A7BC}
.tile.blue{background:#DCEDF6}.tile.blue .v{color:#0B4A66}.tile.blue .l{color:#3D6C86}
.tile.teal{background:#DDEFEA}.tile.teal .v{color:#0A5346}.tile.teal .l{color:#3B7568}
.tile.amber{background:#FAEBD7}.tile.amber .v{color:#7A4A08}.tile.amber .l{color:#98663A}
.tile.red{background:#FBE2D8}.tile.red .v{color:#8C2D12}.tile.red .l{color:#A9573A}
.tile.grey{background:#EAEFF4}.tile.grey .v{color:#2C4054}.tile.grey .l{color:#5A6B7D}
.track{height:7px;border-radius:4px;background:#1E3A57;overflow:hidden;margin:9px 0 7px;display:flex}
.track i{display:block;height:7px}
select,input{border:1px solid #DCE4EC;border-radius:6px;padding:6px 10px;font-size:13px;background:#fff;font-family:inherit;color:#0A2540}
input:focus,select:focus{outline:none;border-color:#0091AE;box-shadow:0 0 0 3px #DCEDF6}
.btn{border:1px solid #DCE4EC;background:#fff;border-radius:6px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:#37475A}
.btn:hover{background:#F4F7FA}
.btn.p{background:#0091AE;color:#fff;border-color:#0091AE}
.btn.d{color:#8C2D12;border-color:#F0C0B2}
table{border-collapse:separate;border-spacing:0;font-size:13.5px;width:100%}
th{background:#F4F7FA;padding:9px 11px;text-align:left;font-size:11.5px;font-weight:600;color:#4A5A6A;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid #DCE4EC}
td{padding:10px 11px;border-bottom:1px solid #EFF3F7;white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
table.rt td.n,table.rt th.n{text-align:right}
/* Sortable headers. The one being sorted on is filled rather than only arrowed, so the
   answer to "sorted by what" is visible without hunting for a small glyph. */
th.srt{cursor:pointer;user-select:none;white-space:nowrap}
th.srt:hover{background:#EDF1F6}
th.srt.on{background:#0A2540;color:#fff;border-radius:6px 6px 0 0}
.btn.on{background:#0A2540;color:#fff;border-color:#0A2540}
table.rt td:first-child,table.rt th:first-child{text-align:left}
.tw{border:1px solid #DCE4EC;border-radius:8px;overflow:auto}
.mut{color:#6B7A8A}.cg{color:#0A5346}.cr{color:#8C2D12}.ca{color:#7A4A08}
.pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:5px;display:inline-block}
.pill.g{background:#DDEFEA;color:#0A5346}.pill.r{background:#FBE2D8;color:#8C2D12}.pill.a{background:#FAEBD7;color:#7A4A08}
/* Daily review is a frozen report, not the live board, so it gets a paper skin: warm
   off-white ground, white cards with a coloured spine instead of filled pastel blocks.
   Nobody should mistake yesterday for today at a glance. */
.rv{background:#F8F6F2;border:1px solid #E7E1D7;border-radius:12px;padding:16px 18px 18px}
.rv h2{color:#1F2937;letter-spacing:-.01em}
.rv .sub,.rv .mut{color:#6F6A62}
.rv .tile{background:#fff;border:1px solid #E7E1D7;border-left:3px solid #9AA3AE;border-radius:6px;padding:11px 13px 12px;box-shadow:0 1px 1px rgba(31,41,55,.03)}
.rv .tile .v{color:#1F2937;font-size:23px}
.rv .tile .l{color:#6F6A62;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;margin-top:4px}
.rv .tile .sb{border-top:1px dashed #E7E1D7;color:#6F6A62}
.rv .tile.blue{border-left-color:#4F7FA8}.rv .tile.blue .v{color:#1F2937}.rv .tile.blue .l{color:#6F6A62}
.rv .tile.teal{border-left-color:#3F8C77}.rv .tile.teal .v{color:#1F2937}.rv .tile.teal .l{color:#6F6A62}
.rv .tile.amber{border-left-color:#C08A3E}.rv .tile.amber .v{color:#1F2937}.rv .tile.amber .l{color:#6F6A62}
.rv .tile.red{border-left-color:#B4553A}.rv .tile.red .v{color:#8C2D12}.rv .tile.red .l{color:#6F6A62}
.rv .tile.grey{border-left-color:#9AA3AE}.rv .tile.grey .v{color:#1F2937}.rv .tile.grey .l{color:#6F6A62}
.rv .tw{border-color:#E7E1D7;background:#fff}
.rv th{background:#F1ECE4;color:#6F6A62;border-bottom:1px solid #DED7CB}
.rv td{border-bottom:1px solid #F1ECE4}
.rv .warn{background:#FBF3E4;border:1px solid #E8D7B4;color:#6B5320;border-radius:8px;padding:10px 13px;font-size:12.5px;line-height:1.55}
.rv .rvh{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8A7B62;
  font-weight:700;margin:15px 0 7px}
.rv .mbar{height:4px;border-radius:3px;background:#EFE7DA;margin-top:3px;overflow:hidden}
.rv .mbar i{display:block;height:4px;background:#C25A3C;border-radius:3px}
.rvhead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;border-bottom:2px solid #1F2937;padding-bottom:9px;margin-bottom:13px}
.rvhead .d{font-size:25px;font-weight:600;color:#1F2937;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rvhead .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:#8A8378}
.warn{background:#FAEBD7;color:#7A4A08;border:1px solid #EFD3AE;border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.warn.bad{background:#FBE2D8;border-color:#F0C0B2;color:#8C2D12}
tr.clik{cursor:pointer}
tr.clik:hover td{background:#F4F7FA}
tr.sub td{background:#FAFCFE;font-size:13px}
tr.offmap td{background:#FFF8EC;border-top:1px solid #F0DCB8}
tr.sub2 td{background:#F2F6FA;font-size:12.5px}
.car{display:inline-block;width:13px;color:#6B7A8A;font-weight:600}
.mlink{color:#0A2540;font-weight:600;text-decoration:none;border-bottom:1px dashed #9DB2C6}
.mlink:hover{color:#0091AE;border-bottom-color:#0091AE}
.tin{width:112px;padding:4px 8px;font-size:13px;text-align:right;border:1px solid #DCE4EC;border-radius:5px;font-variant-numeric:tabular-nums}
.tin.saved{border-color:#0A5346;background:#F1FAF7}
.exc{display:block;padding:7px 0;border-top:1px solid #EFF3F7;font-size:12.5px;color:#37475A;line-height:1.5}
.exc .pill{margin-bottom:3px}
.exc:first-of-type{border-top:none}
.exc b.who{color:#0A2540;font-weight:600}
.excgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(174px,1fr));gap:9px;align-items:stretch}
.exccard{border:1px solid #DCE4EC;border-radius:9px;padding:10px 11px;background:#fff;min-height:170px;display:flex;flex-direction:column}
.exccard h5{font-size:12.5px}
.exccard .exc{font-size:12px;line-height:1.45;padding:6px 0}
.exccard .qline{font-size:11.5px;color:#566575;background:#F4F7FA;border-radius:6px;padding:5px 8px;margin:2px 0 6px;line-height:1.5}
.exccard.bad .qline{background:#FDF1ED}
.exccard.bad{border-color:#F0C0B2;background:#FEF8F6}
.exccard h5{font-size:13.5px;font-weight:600;color:#0A2540;display:flex;align-items:center;gap:7px;margin-bottom:2px}
.exccard .ok{font-size:12.5px;color:#0A5346;padding:5px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pane{border:1px solid #DCE4EC;border-radius:7px;height:200px;overflow:auto;background:#fff}
.ph{position:sticky;top:0;background:#F4F7FA;border-bottom:1px solid #DCE4EC;padding:5px 10px;font-size:10.5px;font-weight:600;color:#4A5A6A;letter-spacing:.05em;text-transform:uppercase}
.it{padding:5px 10px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;border-bottom:1px solid #F7FAFC}
.it:hover{background:#EDF6FA}
.it .ar{color:#0091AE;font-weight:600;opacity:0;font-size:11.5px}
.it:hover .ar{opacity:1}
.it.off{color:#A8B4C0;cursor:not-allowed}
.it.off:hover{background:#fff}
.it.on{background:#F4F7FA}
.pane .none{padding:9px 10px;font-size:12.5px;color:#A8B4C0}
.adminwrap{background:#E7EEF5;border:1px solid #D3DEE9;border-radius:10px;padding:13px}
.teamcard{background:#fff;border:1px solid #D3DEE9;border-top:3px solid #0091AE;border-radius:9px;padding:13px 14px}
.slab{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:#0A2540;letter-spacing:.04em;text-transform:uppercase;margin:12px 0 6px}
.slab .c{background:#E4F4F8;color:#005B6E;font-size:11px;padding:1px 8px;border-radius:10px;letter-spacing:0;text-transform:none}
.pane.sel{border-color:#B7DEE8}
.pane.sel .ph{background:#E4F4F8;color:#005B6E;border-bottom-color:#B7DEE8}
.it.on{background:#F5FBFD;border-left:3px solid #0091AE;padding-left:7px}
.ctgt{background:#F4F7FA;border:1px solid #DCE4EC;border-radius:8px;padding:9px 11px;margin-top:11px}
.ctgt h4{font-size:11.5px;font-weight:600;color:#0A2540;letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.ctgt .row{display:flex;align-items:center;gap:8px;padding:3px 0}
.ctgt .row span{flex:1;font-size:13px}
.ctgt .sum{border-top:1px solid #DCE4EC;margin-top:7px;padding-top:7px;font-size:12.5px;color:#566575;display:flex;justify-content:space-between}
.trow{display:flex;gap:9px;align-items:center;margin-top:11px;background:#0A2540;border-radius:8px;padding:9px 11px}
.trow span{font-size:11.5px;font-weight:600;color:#93A7BC;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1050px){.grid{grid-template-columns:1fr}}
#loading{padding:60px;text-align:center;color:#566575}

/* ==================== Revenue command skin ====================
   Self-contained rather than layered on theme.css, so tuning this page cannot
   drag Overview or Call Now around. Colour here is strictly semantic: green,
   amber and red only ever mean on track, slipping, off; indigo only ever means
   interactive; everything else is grey. That is what makes red mean something. */
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--canvas);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.008em;-webkit-font-smoothing:antialiased}
.nav{background:linear-gradient(180deg,#1B1936 0%,#13152A 100%)}
.nav h1{font-weight:600;letter-spacing:-.02em}
.nav .who{color:#7A81A3}
.nav button,.nav .tools a{border-radius:9px;font-weight:450;transition:background .13s,color .13s}
.nav button:hover,.nav .tools a:hover{background:#262B49;color:#fff}
.nav button.on{background:var(--ind);color:#fff;font-weight:500}
.nav .cnt{background:rgba(255,255,255,.09);color:#B8BDD6}
.nav button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.nav .cnt.bad{background:#7F1D1D;color:#FCA5A5}
.nav .tools{border-top:1px solid #262B49}
.nav .tools .lbl{color:#5E6488}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:16px 18px}
.sec h2{font-size:14px;font-weight:600;letter-spacing:-.016em}
.sec .sub{color:var(--ink3)}
th{background:#FCFCFE;color:var(--ink4);font-size:9.5px;font-weight:600;letter-spacing:.09em;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line2)}
tbody tr:hover td{background:#FBFBFE}
.btn{border-radius:10px;border-color:var(--line);color:var(--ink2);font-weight:500}
.btn:hover{background:#FBFBFE;border-color:#DCDEEA}
.btn.p{background:var(--ind);border-color:var(--ind);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.3)}
.btn.d{background:var(--rose-soft);border-color:#FAD4D9;color:var(--rose-ink)}
input,select{border-radius:10px;border-color:var(--line)}
input:focus,select:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 3.5px var(--ind-soft)}
.mut{color:var(--ink3)}
.cg{color:var(--em)}.cr{color:var(--rose)}.ca{color:var(--amb)}

/* hero */
.herorev{background:linear-gradient(135deg,#1E1B4B 0%,#312E81 55%,#3730A3 100%);border-radius:18px;padding:20px 22px;color:#fff;margin-bottom:16px}
.herorev .hl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#A5A3E8;font-weight:600}
.hrow{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-top:5px}
.hv{font-size:31px;font-weight:600;letter-spacing:-.032em}
.hof{font-size:14px;color:#A5A3E8}
.hchip{margin-left:auto;font-size:11.5px;font-weight:550;padding:5px 11px;border-radius:9px}
.hchip.good{background:rgba(110,231,183,.16);color:#6EE7B7}
.hchip.bad{background:rgba(253,186,116,.16);color:#FDBA74}
.htrack{margin-top:13px;height:8px;background:rgba(255,255,255,.12);border-radius:99px;position:relative}
.htrack i{display:block;height:8px;background:#67E8F9;border-radius:99px}
.htrack b{position:absolute;top:-3px;width:2px;height:14px;background:#FDBA74;border-radius:2px}
.hsub{font-size:11.5px;color:#B9B7EE;margin-top:8px}
.hwarn{margin-top:9px;font-size:11.5px;color:#FDBA74}
.hwarn a{color:#C7C3F5}

/* bands */
.bandl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);margin:11px 0 6px}
.bandl span{text-transform:none;letter-spacing:-.006em;font-weight:450;font-size:11.5px;color:var(--ink3);margin-left:8px}
/* Twelve cards at 216px each ate most of a screen for twelve numbers. Narrower minimum
   and tighter internals fit six across on a wide monitor and four on a laptop, so the
   whole Overview lands above the fold instead of taking three scrolls to read. */
.tiles2{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.t2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--sh);transition:box-shadow .16s,transform .06s}
.t2:hover{box-shadow:0 2px 6px rgba(14,18,32,.06),0 18px 40px -18px rgba(14,18,32,.22)}
.t2:active{transform:translateY(.5px)}
.t2.bad{border-color:#F7CFD4}
.t2h{display:flex;align-items:center;gap:7px}
.t2l{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch{margin-left:auto;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.ch.g{background:var(--em-soft);color:var(--em-ink)}
.ch.r{background:var(--rose-soft);color:var(--rose-ink)}
.ch.a{background:var(--amb-soft);color:var(--amb-ink)}
.ch.n{background:#F1F2F7;color:var(--ink2)}
.t2v{font-size:21px;font-weight:600;letter-spacing:-.03em;margin-top:4px;line-height:1.15}
.t2of{font-size:12px;font-weight:400;color:var(--ink3);letter-spacing:-.01em}
/* Two lines at most. The full sentence stays on hover, where it costs no height. */
.t2f{font-size:10.5px;color:var(--ink2);margin-top:6px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t2f a{color:var(--ind);text-decoration:none;font-weight:550}
.pb{margin-top:9px;height:6px;background:#F0F1F7;border-radius:99px;position:relative}
.pb i{display:block;height:6px;border-radius:99px}
.pb b{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:2px}
.seg3{display:flex;gap:2px;margin-top:10px}
.seg3 i{height:6px;display:block}

<body>
<div class="shell">
  <div class="nav">
    <h1>Revenue command</h1>
    <div class="who" id="who"></div>
    <div id="navlinks"></div>
    <div id="tools"></div>
  </div>
  <div class="main">
    <div id="loading">Loading...</div>
    <div id="app" style="display:none"></div>
  </div>
</div>
<script>
var J = null, EDIT = null, OPEN = {}, OPENC = {}, VIEW = localStorage.getItem("vp_view") || "overview";
var ONLY = new URLSearchParams(location.search).get("team") || "";
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function fmt(n){ return Math.round(n||0).toLocaleString("en-IN"); }
function inr(v){ v = Math.round(v||0); return v>=1e7 ? "₹"+(v/1e7).toFixed(2)+"Cr" : v>=1e5 ? "₹"+(v/1e5).toFixed(1)+"L" : "₹"+fmt(v); }
function post(url, body){
  return fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{}) })
    .then(asJson);
}
function fail(msg){
  document.getElementById("loading").innerHTML =
    "<div style='max-width:560px;margin:0 auto;text-align:left' class='warn bad'><b>Could not load.</b><br>" +
    esc(msg) + "</div>";
}
function load(month){
  fetch("/api/vp" + (month ? "?month=" + month : ""))
    .then(function(r){
      if (r.status === 401) { location.href = "/login.html"; return null; }
      if (r.status === 404) throw new Error("The /api/vp endpoint is missing, so this deploy does not have the VP build yet. Check the Railway Deployments tab.");
      if (!r.ok) throw new Error("Server returned " + r.status + ". Check the Railway deploy logs.");
      return r.text().then(function(t){
        try { return JSON.parse(t); }
        catch (e) { throw new Error("Server sent something that is not JSON: " + t.slice(0, 160)); }
      });
    })
    .then(function(j){
      if (!j) return;
      J = j;
      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display = "";
      draw();
    })
    .catch(function(e){ fail(e.message); });
}
function go(v){ VIEW = v; localStorage.setItem("vp_view", v); draw(); }
var SYNCOPEN = false;
function agoMin(at){ return at ? Math.round((Date.now() - Date.parse(at)) / 60000) : null; }
function toggleSync(){ SYNCOPEN = !SYNCOPEN; draw(); }
var REFRESHING = false;
// Railway answers with plain text when it gives up on a slow request, and JSON.parse on
// "upstream error" produces a message nobody can act on. Read the body once and say what
// actually happened.
function asJson(r){
  return r.text().then(function(t){
    try { return JSON.parse(t); }
    catch (e) {
      if (r.status === 502 || r.status === 504 || /upstream/i.test(t)) {
        throw new Error("The server took too long to answer. The sync is still running in the background, give it a minute and reload.");
      }
      throw new Error("Server returned " + r.status + ": " + String(t).slice(0, 160));
    }
  });
}
function hardRefresh(mode){
  if (REFRESHING) return;
  REFRESHING = true; draw();
  fetch("/api/sync/leads?mode=" + mode, { method: "POST" })
    .then(asJson)
    .then(function(j){
      if (j && j.error) { REFRESHING = false; alert(j.error); draw(); return; }
      if (j && j.skipped) { REFRESHING = false; load(J.month); return; }
      pollSync(0);
    })
    .catch(function(e){ REFRESHING = false; alert(e.message); draw(); });
}
// The work now runs past the end of the request, so follow it rather than assume.
function pollSync(n){
  if (n > 240) { REFRESHING = false; draw(); return; }
  setTimeout(function(){
    fetch("/api/sync/status").then(asJson).then(function(j){
      if (j && j.running) return pollSync(n + 1);
      REFRESHING = false;
      if (j && j.error) alert("Refresh failed: " + j.error);
      load(J.month);
    }).catch(function(){ pollSync(n + 1); });
  }, 3000);
}
function drawSync(){
  var sy = J.syncs || {};
  var keys = Object.keys(sy);
  var running = keys.filter(function(k){ return sy[k].running; });
  var never = keys.filter(function(k){ return !sy[k].at; });
  var stale = keys.filter(function(k){ var m = agoMin(sy[k].at); return m !== null && m > 90; });
  var cls = (running.length || never.length) ? "run" : (stale.length ? "old" : "ok");
  var txt = never.length ? "First sync running, numbers are incomplete"
    : running.length ? (running.length + " sync" + (running.length > 1 ? "s" : "") + " running, numbers may be partial")
    : stale.length ? "Data is stale"
    : "Data current, " + (agoMin(sy.leads && sy.leads.at) || 0) + "m ago";
  var el = document.getElementById("syncbadge");
  if (el) el.innerHTML = "<span class='sync " + cls + "' onclick='toggleSync()' title='Click for detail'>" +
    "<span class='dot'></span>" + esc(txt) + "</span>";
}
function syncPanel(){
  if (!SYNCOPEN) return "";
  var sy = J.syncs || {};
  var h = "<div class='syncbox'><div style='display:flex;align-items:center;gap:9px;margin-bottom:7px'>" +
    "<b>Data freshness</b>" +
    "<button class='btn p' style='margin-left:auto' " + (REFRESHING ? "disabled" : "") + " onclick=\"hardRefresh('delta')\">" +
    (REFRESHING ? "Refreshing..." : "Refresh calling data") + "</button>" +
    (J.isVP ? "<button class='btn' " + (REFRESHING ? "disabled" : "") + " onclick=\"hardRefresh('full')\">Full rebuild</button>" : "") +
    "</div>";
  Object.keys(sy).forEach(function(k){
    var x = sy[k], m = agoMin(x.at);
    h += "<div class='r'><span>" + esc(x.label) + "</span>" +
      "<span>" + (x.running ? "<b class='ca'>syncing now</b> · " : "") +
      (x.at ? fmt(x.n) + " records · " + m + "m ago" : "<b class='cr'>not loaded yet</b>") + "</span></div>";
  });
  h += "<div class='r'><span class='mut'>Leads re-sync every " + (J.syncMinutes || 30) +
    " minutes. Counselling, forms and creator fresh run hourly.</span></div></div>";
  return h;
}
var DAILY = null, DAILY_DATE = "";
function loadDaily(d){
  fetch("/api/vp/daily" + (d ? "?date=" + encodeURIComponent(d) : ""))
    .then(asJson)
    .then(function(j){ DAILY = j; DAILY_DATE = j.date; renderDaily(); })
    .catch(function(e){
      var el = document.getElementById("dailywrap");
      if (el) el.innerHTML = "<div class='warn bad'>Could not load: " + esc(e.message) + "</div>";
    });
}
function pcCell(done, total){
  // null means the number was never captured for that day, which is not the same as zero.
  if (total == null || done == null) return "<span class='mut' title='Not captured for this day'>–</span>";
  if (!total) return "<span class='mut'>0</span>";
  var p = Math.round(100 * done / total);
  return "<b>" + fmt(done) + "</b> <span class='mut'>of " + fmt(total) + " · " + p + "%</span>";
}
function nc(v){ return v == null ? "<span class='mut' title='Not captured for this day'>–</span>" : fmt(v); }
function dailyRows(map, label, back){
  var keys = Object.keys(map || {});
  if (back) return "<tr><td colspan='4' class='mut'>Not available for a rebuilt day.</td></tr>";
  if (!keys.length) return "<tr><td colspan='12' class='mut'>Nothing recorded.</td></tr>";
  var d = function(o, c){ return o == null ? c : o; };
  return keys.map(function(k){ return Object.assign({ k: k }, map[k]); })
    .sort(function(a, b){ return (b.calls || 0) - (a.calls || 0) || d(b.oPool, b.pool) - d(a.oPool, a.pool); })
    .map(function(x){
      return "<tr><td><b>" + esc(x.name || x.k) + "</b>" +
        (label === "agent" && x.team ? " <span class='mut'>" + esc(x.team) + "</span>" : "") + "</td>" +
        "<td class='n'>" + pcCell(x.calls, d(x.oPool, x.pool)) + "</td>" +
        "<td class='n'>" + pcCell(x.done, d(x.oDue, x.due)) + "</td>" +
        "<td class='n " + (x.missed ? "cr" : "mut") + "'>" + nc(x.missed) + "</td>" +
        "<td class='n'>" + pcCell(x.overdueC, d(x.oOverdue, x.overdue)) + "</td>" +
        "<td class='n'>" + pcCell(x.nofuC, x.nofu) + "</td>" +
        "<td class='n'>" + pcCell(x.freshC, d(x.oFresh, x.fresh)) + "</td>" +
        "<td class='n'>" + pcCell(x.formC, d(x.oForm, x.form)) + "</td>" +
        "<td class='n'>" + pcCell(x.scoreC, d(x.oScore, x.score)) + "</td>" +
        "<td class='n'>" + pcCell(x.intlC, d(x.oIntl, x.intl)) + "</td>" +
        "<td class='n'>" + pcCell(x.needsC, d(x.oNeeds, x.needs)) + "</td>" +
        "<td class='n'>" + fmt(x.counsellings || 0) + "</td>" +
        "<td class='n " + (x.counsDeep == null ? "mut" : "") + "'>" +
          (x.counsDeep == null ? "\u2013" : fmt(x.counsDeep)) + "</td>" +
        "<td class='n'>" + inr(x.revenue || 0) +
          (x.enrolments ? " <span class='mut'>· " + fmt(x.enrolments) + "</span>" : "") + "</td>" +
        "<td class='n'>" + auditCell(x.audits, x.auditTarget) + "</td></tr>";
    }).join("");
}
function auditTile(sn){
  var t = sn.auditTarget || 0, dn = sn.audits || 0;
  return tile(t && dn >= t ? "teal" : (dn ? "amber" : "red"),
    fmt(dn) + " <span style='font-size:14px;font-weight:400'>of " + fmt(t) + "</span>",
    "Call audits done",
    t ? Math.round(100 * dn / t) + "% of the cadence" : "no agents on rotation");
}
// Every tile answers the same question the Call Now queue asks, one day later: of the
// leads that sat in this bucket, how many were actually dialled.
function workedTile(cls, done, total, label){
  if (total == null || done == null) {
    return tile("grey", "<span style='font-size:20px'>–</span>", label, "not captured for this day");
  }
  var pc = total ? Math.round(100 * done / total) : 0;
  return tile(total && pc >= 60 ? "teal" : (pc > 0 ? cls : "red"),
    fmt(done) + " <span style='font-size:14px;font-weight:400'>of " + fmt(total) + "</span>",
    label, total ? pc + "% worked" : "nothing in this bucket");
}
function renderDaily(){
  var el = document.getElementById("dailywrap");
  if (!el) return;
  var j = DAILY, sn = j && j.snapshot;
  var h = "<div class='sec rv'>" +
    "<div class='rvhead'><span class='k'>Daily review</span><span class='d'>" + esc(j.date || "") + "</span>" +
    "<span class='k'>" + (sn && sn.backfilled ? "rebuilt from history" : "captured live") + "</span></div>" +
    "<div class='sub'>Call Now 2.0 as it stood that day, and how much of it was actually worked. Same buckets, same definitions, same denominators, one day later.</div>";
  h += "<div style='display:flex;gap:9px;align-items:center;margin-bottom:11px;flex-wrap:wrap'>" +
    "<select onchange='loadDaily(this.value)'>" +
    (j.dates || []).map(function(d){ return "<option value='" + d + "'" + (d === j.date ? " selected" : "") + ">" + d + (d === j.today ? " (today, still moving)" : "") + "</option>"; }).join("") +
    "</select>" +
    (DAILY && DAILY.isVP ? "<button class='btn' onclick='dailyCsv()'>Download CSV</button>" : "") +
    "<button class='btn' onclick='window.print()'>Print</button>" +
    (sn ? "<span class='mut' style='font-size:12px'>captured " + new Date(sn.at).toLocaleString('en-IN') + "</span>" : "") +
    "</div>";
  if (!sn) return void (el.innerHTML = h + "<div class='mut'>No snapshot stored for that date yet. The first one is written within 15 minutes of a deploy, and a full day appears from tomorrow.</div></div>");
  var back = !!sn.backfilled;
  if (back) {
    h += "<div class='warn' style='margin-bottom:12px'>This day was rebuilt from history, not captured live, so the cadence question cannot be answered for it. " +
      "Bucket sizes and who was dialled inside each bucket were point-in-time states that HubSpot has since overwritten. " +
      "What survives with its own date is below. Full cadence review runs from the first day captured live.</div>";
    var cr = sn.attempts ? Math.round(100 * (sn.connected || 0) / sn.attempts) : 0;
    h += "<div class='tiles' style='margin-bottom:4px'>" +
      tile("grey", fmt(sn.attempts || 0), "Call attempts logged") +
      tile("grey", fmt(sn.connected || 0), "Connected", sn.attempts ? cr + "% of attempts" : "") +
      tile("grey", fmt(sn.counsellings || 0), "Counsellings") +
      tile("grey", inr(sn.revenue || 0), "Revenue booked", fmt(sn.enrolments || 0) + " enrolments") +
      auditTile(sn) + "</div>";
    return void (el.innerHTML = h + "</div>");
  }
  var d = function(o, c){ return o == null ? c : o; };
  var pool = d(sn.oPool, sn.pool), due = d(sn.oDue, sn.due);
  var pushed = (due != null && sn.done != null && sn.missed != null) ? due - (sn.done + sn.missed) : 0;
  h += "<div class='sub' style='margin:-4px 0 10px'>" +
    (sn.openAt ? "Bucket sizes frozen at " + esc(hm24(sn.openAt)) + " IST. Work counts run to close of day, so pushing a follow-up to tomorrow does not shrink the denominator."
               : "Opening position was not captured for this day, so the bucket sizes are as they stood at the last capture.") + "</div>";
  /* Call Now 2.0's own buckets, in its own words, so a manager reviewing yesterday is
     reading the same page their agent worked. Timing first, because a lead has exactly
     one of those; then the reasons to call, which overlap on purpose. */
  h += "<h3 class='rvh'>Where the day stood, and what was worked</h3>";
  h += "<div class='tiles' style='margin-bottom:12px'>" +
    workedTile("amber", sn.calls, pool, "Call today, worked") +
    workedTile("amber", sn.done, due, "Due today, called") +
    workedTile("amber", sn.overdueC, d(sn.oOverdue, sn.overdue), "Overdue, called") +
    workedTile("amber", sn.nofuC, sn.nofu, "No next call set, called") +
    workedTile("amber", sn.freshC, d(sn.oFresh, sn.fresh), "Fresh leads, called") +
    tile(sn.missed ? "red" : "teal", nc(sn.missed), "Due today, missed",
      (due ? Math.round(100 * (sn.missed || 0) / due) + "% of the day's due" : "") +
      (pushed > 0 ? " · " + fmt(pushed) + " pushed out" : "") +
      (pushed < 0 ? " · " + fmt(-pushed) + " pulled in" : "")) +
    "</div>";
  h += "<h3 class='rvh'>Reasons to call, and how much of each was covered</h3>";
  h += "<div class='tiles' style='margin-bottom:12px'>" +
    workedTile("amber", sn.formC, d(sn.oForm, sn.form), "Filled the form") +
    workedTile("amber", sn.scoreC, d(sn.oScore, sn.score), "Score &ge; 6") +
    workedTile("amber", sn.intlC, d(sn.oIntl, sn.intl), "International") +
    workedTile("amber", sn.refillC, sn.refill, "Refilled the form") +
    workedTile("amber", sn.ifcC, sn.ifc, "IFC came due") +
    workedTile("amber", sn.needsC, d(sn.oNeeds, sn.needs), "Needs owner") +
    tile("blue", fmt(sn.counsellings), "Counsellings",
      (sn.counsDeep == null ? "not captured for this day" : fmt(sn.counsDeep) + " reached counselled or beyond")) +
    tile("blue", inr(sn.revenue), "Revenue booked", fmt(sn.enrolments) + " enrolments") +
    auditTile(sn) +
    "</div>";
  h += missedTable(sn.agents, back);
  var head = "<thead><tr><th>Name</th>" +
    "<th class='n'>Call today</th><th class='n'>Due today</th><th class='n'>Missed</th>" +
    "<th class='n' title='Follow-ups carried in from before that day'>Overdue</th>" +
    "<th class='n' title='No next call date was ever set'>No FU</th><th class='n'>Fresh</th>" +
    "<th class='n'>Form</th><th class='n'>Score &ge; 6</th><th class='n'>International</th>" +
    "<th class='n'>Needs owner</th>" +
    "<th class='n'>Counsellings</th>" +
    "<th class='n' title='The subset that reached counselled or beyond, which is what the Counselled QA tool counts.'>QA scope</th>" +
    "<th class='n'>Revenue</th><th class='n'>Audits</th></tr></thead>";
  h += "<h3 class='rvh'>By team</h3><div class='tw' style='margin-bottom:14px'><table class='rt'>" + head + "<tbody>" + dailyRows(sn.teams, "team", back) + "</tbody></table></div>";
  h += "<h3 class='rvh'>By agent</h3><div class='tw'><table class='rt'>" + head + "<tbody>" + dailyRows(sn.agents, "agent", back) + "</tbody></table></div>";
  el.innerHTML = h + "</div>";
}

/* Who missed what.

   Every other table here answers "how much was done". This one answers the question a
   manager actually opens the page with, which is who to talk to and about what. It is
   the same buckets, subtracted: what sat in front of the agent, minus what they dialled.
   Sorted by the biggest gap, so the conversation order is the row order. */
function missedTable(map, back){
  if (back) return "";
  var keys = Object.keys(map || {});
  if (!keys.length) return "";
  var BUCK = [["due", "done", "Due today"], ["overdue", "overdueC", "Overdue"],
    ["nofu", "nofuC", "No FU set"], ["fresh", "freshC", "Fresh"],
    ["form", "formC", "Form"], ["score", "scoreC", "Score"], ["needs", "needsC", "Needs owner"]];
  var rows = keys.map(function(k){
    var x = Object.assign({ k: k }, map[k]);
    var gaps = {}, total = 0;
    BUCK.forEach(function(b){
      var had = x[b[0]] || 0, did = x[b[1]] || 0;
      gaps[b[0]] = Math.max(0, had - did);
    });
    total = Math.max(0, (x.pool || 0) - (x.calls || 0));
    return { x: x, gaps: gaps, total: total };
  }).filter(function(r){ return (r.x.pool || 0) > 0; })
    .sort(function(a, b){ return b.total - a.total || (b.gaps.due - a.gaps.due); });
  if (!rows.length) return "";
  var worst = rows[0].total || 1;
  var h = "<h3 class='rvh'>Who missed what</h3>" +
    "<div class='sub' style='margin:-4px 0 8px'>What sat in front of each agent that day, minus what they dialled. " +
    "Biggest gap first, so the order of the rows is the order of the conversations.</div>" +
    "<div class='tw' style='margin-bottom:14px'><table class='rt'><thead><tr><th>Agent</th>" +
    "<th class='n'>Not worked</th><th class='n'>Of</th>" +
    BUCK.map(function(b){ return "<th class='n'>" + b[2] + "</th>"; }).join("") +
    "</tr></thead><tbody>";
  h += rows.map(function(r){
    var pc = r.x.pool ? Math.round(100 * r.total / r.x.pool) : 0;
    var bar = Math.round(100 * r.total / worst);
    return "<tr><td><b>" + esc(r.x.name || r.x.k) + "</b>" +
      (r.x.team ? " <span class='mut'>" + esc(r.x.team) + "</span>" : "") + "</td>" +
      "<td class='n'><b class='" + (pc >= 60 ? "cr" : (pc >= 30 ? "ca" : "cg")) + "'>" + fmt(r.total) + "</b>" +
      "<div class='mbar'><i style='width:" + bar + "%'></i></div></td>" +
      "<td class='n mut'>" + fmt(r.x.pool || 0) + " · " + pc + "%</td>" +
      BUCK.map(function(b){
        var g = r.gaps[b[0]];
        return "<td class='n " + (g ? "" : "mut") + "'>" + (g ? fmt(g) : "–") + "</td>";
      }).join("") + "</tr>";
  }).join("");
  return h + "</tbody></table></div>";
}
// Days captured before the midnight fix recorded the hour as 24 rather than 00.
function hm24(t){ return String(t || "").replace(/^24:/, "00:"); }
function dailyCsv(){
  var sn = DAILY && DAILY.snapshot;
  if (!sn) return;
  if (!DAILY.isVP) return;
  var lines = [];
  var src = sn.backfilled ? "rebuilt" : "live";
  var d = function(o, c){ return o == null ? c : o; };
  /* The header and the row are one list, paired, so they cannot drift apart. They did:
     the header was rewritten into Call Now 2.0's buckets and the row was left in the old
     order, so every column in the export was mislabelled. */
  var COLS = [
    ["CallToday", function(x){ return d(x.oPool, x.pool); }], ["CallTodayWorked", function(x){ return x.calls; }],
    ["Due", function(x){ return d(x.oDue, x.due); }], ["DueDone", function(x){ return x.done; }],
    ["Missed", function(x){ return x.missed; }],
    ["Overdue", function(x){ return d(x.oOverdue, x.overdue); }], ["OverdueWorked", function(x){ return x.overdueC; }],
    ["NoFU", function(x){ return x.nofu; }], ["NoFUWorked", function(x){ return x.nofuC; }],
    ["Fresh", function(x){ return d(x.oFresh, x.fresh); }], ["FreshWorked", function(x){ return x.freshC; }],
    ["Form", function(x){ return d(x.oForm, x.form); }], ["FormWorked", function(x){ return x.formC; }],
    ["Score", function(x){ return d(x.oScore, x.score); }], ["ScoreWorked", function(x){ return x.scoreC; }],
    ["Intl", function(x){ return d(x.oIntl, x.intl); }], ["IntlWorked", function(x){ return x.intlC; }],
    ["Refill", function(x){ return x.refill; }], ["RefillWorked", function(x){ return x.refillC; }],
    ["IFC", function(x){ return x.ifc; }], ["IFCWorked", function(x){ return x.ifcC; }],
    ["NeedsOwner", function(x){ return d(x.oNeeds, x.needs); }], ["NeedsOwnerWorked", function(x){ return x.needsC; }],
    ["NeverCalled", function(x){ return d(x.oUncalled, x.uncalled); }], ["NeverCalledWorked", function(x){ return x.uncalledC; }],
    ["Counsellings", function(x){ return x.counsellings; }],
    ["CounsellingsQAScope", function(x){ return x.counsDeep; }],
    ["Revenue", function(x){ return Math.round(x.revenue || 0); }],
    ["Enrolments", function(x){ return x.enrolments; }],
    ["Audits", function(x){ return x.audits; }], ["AuditTarget", function(x){ return x.auditTarget; }]
  ];
  var row = function(level, name, team, x){
    lines.push([level, name, team || "", src]
      .concat(COLS.map(function(c){ return c[1](x); }))
      .map(function(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }).join(","));
  };
  lines.push(["Level","Name","Team","Source"].concat(COLS.map(function(c){ return c[0]; })).join(","));
  row("company", "All teams", "", sn);
  Object.keys(sn.teams || {}).forEach(function(k){ row("team", sn.teams[k].name, "", sn.teams[k]); });
  Object.keys(sn.agents || {}).forEach(function(k){ row("agent", sn.agents[k].name, sn.agents[k].team, sn.agents[k]); });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "daily_review_" + DAILY.date + ".csv";
  a.click();
}
/* Creator targets, week by week.

   A monthly target is not something a manager can act on until the month is nearly over.
   Split across the weeks it becomes a Monday question: are we ahead or behind, and on
   which creator. The split is by working days, so a short last week is handed a small
   share rather than an equal one.

   Attribution here is by creator, not by agent. Rule 8 follows the agent when the
   question is who to credit; this question is whether a creator's pipeline is producing
   what it was expected to. */
var WEEKS = null;
function loadWeeks(){
  fetch("/api/vp/creator-weeks?month=" + encodeURIComponent(J.month))
    .then(asJson)
    .then(function(j){ WEEKS = j; renderWeeks(); })
    .catch(function(e){
      var el = document.getElementById("weekwrap");
      if (el) el.innerHTML = "<div class='warn bad'>Could not load: " + esc(e.message) + "</div>";
    });
}
function wkCell(w){
  if (!w.target && !w.actual) return "<td class='n mut'>–</td>";
  if (!w.started) return "<td class='n mut' title='This week has not started'>" +
    (w.target ? "<span class='mut'>" + inr(w.target) + "</span>" : "–") + "</td>";
  var pc = w.target ? Math.round(100 * w.actual / w.target) : null;
  var cls = pc === null ? "" : (pc >= 100 ? "cg" : (pc >= 60 ? "ca" : "cr"));
  return "<td class='n'><b class='" + cls + "'>" + inr(w.actual) + "</b>" +
    (w.target ? "<div class='mut' style='font-size:11px'>of " + inr(w.target) +
      (pc === null ? "" : " · " + pc + "%") + "</div>" +
      "<div class='pbar'><i style='width:" + Math.min(100, pc || 0) + "%'></i></div>" : "") +
    "</td>";
}
function renderWeeks(){
  var el = document.getElementById("weekwrap");

  var h = "<div class='sec'><h2>Creator targets, week by week</h2>" +
    "<div class='sub'>The monthly target for each creator, split across the weeks of " + esc(j.month) +
    " in proportion to the working days each week holds, against what actually came in. " +
    "A week that has not started yet shows its target in grey; it is not a miss until it is due. " +
    (j.scoped ? "Your team's creators only. " : "") +
    "Counted against the creator the payment names, which is the creator whose target it is.</div>";

  if (!j.rows.length) {
    return void (el.innerHTML = h + "<div class='mut'>No creator has a target for this month yet. " +
      "Set them under Teams and targets.</div></div>");
  }

  var t = j.totals;
  var gap = t.actual - t.dueSoFar;
  h += "<div class='tiles compact' style='margin-bottom:12px'>" +
    tile("grey", inr(t.actual), "Booked this month", "of " + inr(t.target)) +
    tile("grey", inr(t.dueSoFar), "Owed by now", "weeks started so far") +
    tile(gap >= 0 ? "teal" : "red", (gap >= 0 ? "+" : "") + inr(gap), "Against the weeks due",
      t.dueSoFar ? Math.round(100 * t.actual / t.dueSoFar) + "% of what is owed" : "") +
    tile("grey", fmt(t.enrolments), "Enrolments") +
    "</div>";

  h += "<div class='tw'><table class='rt'><thead><tr><th>Creator</th><th class='n'>Month</th>" +
    j.weeks.map(function(w){
      return "<th class='n" + (w.done ? "" : (w.started ? " on" : " mut")) + "'>W" + w.n +
        "<div class='mut' style='font-weight:400;font-size:10px'>" + esc(w.label) + " · " +
        w.workDays + "d</div></th>";
    }).join("") + "<th class='n'>Against pace</th></tr></thead><tbody>";

  j.rows.forEach(function(r){
    h += "<tr><td><b>" + esc(r.u) + "</b>" +
      (r.team ? "<div class='mut' style='font-size:11.5px'>" + esc(r.team) + "</div>" : "") + "</td>" +
      "<td class='n'><b>" + inr(r.actual) + "</b><div class='mut' style='font-size:11px'>of " +
      (r.target ? inr(r.target) : "no target") + "</div></td>" +
      r.weeks.map(wkCell).join("") +
      "<td class='n'>" + (r.dueSoFar
        ? (r.gap >= 0 ? "<span class='pill g'>+" + inr(r.gap) + "</span>"
                      : "<span class='pill r'>" + inr(-r.gap) + "</span>")
        : "<span class='mut'>–</span>") + "</td></tr>";
  });
  h += "</tbody></table></div></div>";
  el.innerHTML = h;
}

/* The counselling ledger: what each agent did on one day.

   Two questions on one screen because they answer each other. "Twelve counsellings" reads
   well until you see the talktime beside it, and "five minutes of talktime" looks like a
   wasted day until you see that the calls carry no duration at all.

   The flags are not accusations and the page says so. A lead can genuinely be counselled,
   go quiet and be counselled again. What the flags do is put the shape in front of a
   manager who can ask. */
var LG = null, LG_DATE = "", LG_TEAM = "", LG_AGENT = "", LG_CREATOR = "", LG_OPEN = {};
function lgSet(k, v){
  if (k === "team") { LG_TEAM = v; LG_AGENT = ""; }
  else if (k === "creator") LG_CREATOR = v;
  else LG_AGENT = v;
  renderLedger();
}
function lgToggle(id){ LG_OPEN[id] = !LG_OPEN[id]; renderLedger(); }
function lgMins(ms){
  ms = ms || 0;
  if (!ms) return "0";
  var m = Math.round(ms / 60000);
  return m >= 60 ? Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m" : m + "m";
}
function lgClock(ms){
  var d = new Date(ms + 5.5 * 3600000);
  return d.toISOString().slice(11, 16);
}
function lgRows(){
  return (LG && LG.rows ? LG.rows : []).filter(function(r){
    if (LG_TEAM && r.teamId !== LG_TEAM) return false;
    if (LG_AGENT && String(r.id) !== LG_AGENT) return false;
    if (LG_CREATOR) return lgLeads(r.id).length > 0;
    return true;
  });
}
function lgLeads(ownerId){
  return (LG && LG.leads ? LG.leads : []).filter(function(l){
    if (String(l.owner) !== String(ownerId)) return false;
    if (LG_CREATOR && l.creator !== LG_CREATOR) return false;
    return true;
  });
}
function lgCreators(){
  var seen = {};
  (LG && LG.leads ? LG.leads : []).forEach(function(l){ if (l.creator) seen[l.creator] = 1; });
  return Object.keys(seen).sort();
}
function loadLedger(d){
  var el = document.getElementById("lgwrap");
  if (el) el.innerHTML = "<div class='sec'>Reading the day...</div>";
  fetch("/api/vp/ledger" + (d ? "?date=" + encodeURIComponent(d) : ""))
    .then(asJson)
    .then(function(j){ LG = j; LG_DATE = j.date; renderLedger(); })
    .catch(function(e){
      if (el) el.innerHTML = "<div class='sec'><h2>Counselling day</h2>" +
        "<div class='warn bad'>Could not load: " + esc(e.message) + "</div></div>";
    });
}
/* A counselling with no length behind it is not a short counselling. Kept apart in the
   summary as well as on the row, because a tile that adds the two together is how the
   distinction gets quietly lost again. */
function lgTile(cls, k, v, s){
  return "<div class='tile " + cls + "'><div class='k'>" + esc(k) + "</div>" +
    "<div class='v'>" + v + "</div><div class='mut' style='font-size:11px'>" + esc(s) + "</div></div>";
}
function lgFlagPills(l){
  var h = "";
  if (l.repeat && l.repeat.length) h += "<span class='pill r' title='Entered a stage this lead had already been in'>repeat</span> ";
  if (l.reopened && l.reopened.length) h += "<span class='pill r' title='Came back into a counselling stage out of a follow-up stage'>reopened</span> ";
  if (l.dropped && l.dropped.length) h += "<span class='pill r' title='Moved to DNP or RCB after having been counselled'>dropped to " + esc(l.dropped[0].label) + "</span> ";
  /* Every lead reaching this list moved through a counselling stage today, so a missing
     next call is worth saying on all of them and not only on first counsellings. The
     tile above counts first counsellings alone and says so, because that denominator has
     to stay comparable day to day. */
  if (l.noFollowUp) h += "<span class='pill a'>no follow up</span> ";
  if (l.counselling && l.unknown) h += "<span class='pill' style='background:#F2EFE7;color:#6B5B37'>no duration</span> ";
  else if (l.counselling && l.short) h += "<span class='pill a'>under " + Math.round((LG.shortMs || 600000) / 60000) + " min</span> ";
  if (l.screenshot) {
    /* The image itself is not read, so the least this can do is take you to it. */
    var pid = LG.portal || {};
    var cid = (l.shotIds || [])[0];
    var tip = "The only record of length is an image the agent attached. Not read by the app.";
    h += cid && pid.uiDomain
      ? "<a class='pill' style='background:#EEF1F5;color:#42526B;text-decoration:none' target='_blank' rel='noopener' " +
        "title='" + tip + " Opens the call in HubSpot.' href='https://" + esc(pid.uiDomain) +
        "/calls/" + esc(String(pid.portalId)) + "/review/" + esc(String(cid)) + "'>screenshot &nearr;</a> "
      : "<span class='pill' style='background:#EEF1F5;color:#42526B' title='" + tip + "'>screenshot</span> ";
  }
  if (l.declaredMs) h += "<span class='pill' style='background:#E7EFEA;color:#1F5B42' title='Length the agent entered on the call record. Not verified.'>declared " + lgMins(l.declaredMs) + "</span> ";
  if (l.noteMs) h += "<span class='pill' style='background:#EEF1F5;color:#42526B' title='Length taken from what the agent typed in the call note'>note " + lgMins(l.noteMs) + "</span> ";
  return h || "<span class='mut'>clean</span>";
}
function lgLeadRows(ownerId){
  var rows = lgLeads(ownerId);
  if (!rows.length) return "<tr><td colspan='8' class='mut'>Nothing on this day.</td></tr>";
  rows.sort(function(a, b){
    var at = a.counselling ? a.counselling.at : (a.events && a.events[0] ? a.events[0].at : 0);
    var bt = b.counselling ? b.counselling.at : (b.events && b.events[0] ? b.events[0].at : 0);
    return bt - at;
  });
  return rows.map(function(l){
    var ev = l.counselling || (l.repeat[0] || l.reopened[0] || l.dropped[0] || l.progress[0]);
    var talk = l.unknown ? "<span class='mut' title='No call on this lead carried a duration'>not recorded</span>"
      : lgMins(l.callMs + l.meetMs + l.noteMs);
    /* Named, because the lead-level rule cannot tell a counselling from a group session
       that happens to have one lead attached. The title usually can. */
    var mt = (l.meetings || []).map(function(m){
      return "<div class='mut' style='font-size:11px'>meeting " + lgMins(m.durMs) + ": " +
        esc(m.title || "untitled") + "</div>"; }).join("");
    return "<tr>" +
      "<td>" + esc(l.name) + (l.counselling ? "" : " <span class='mut' style='font-size:11px'>not a first counselling</span>") + "</td>" +
      "<td class='mut'>" + esc(l.creator || "") + "</td>" +
      "<td>" + (ev ? esc(ev.label) : "") + "</td>" +
      "<td class='mut'>" + (ev ? lgClock(ev.at) : "") + "</td>" +
      "<td class='mut'>" + (ev ? esc(ev.fromLabel) : "") + "</td>" +
      "<td class='n'>" + fmt(l.calls) + "</td>" +
      "<td class='n'>" + talk + "</td>" +
      "<td>" + lgFlagPills(l) + mt + "</td>" +
      "</tr>";
  }).join("");
}
function renderLedger(){
  var el = document.getElementById("lgwrap");
  if (!el || !LG) return;
  var j = LG;
  var rows = lgRows();
  var t = { couns: 0, flag: 0, nofu: 0, short: 0, unknown: 0, talk: 0, calls: 0, meet: 0,
    measured: 0, declared: 0, missing: 0 };
  rows.forEach(function(r){
    t.couns += r.counsellings; t.flag += r.flagged; t.nofu += r.noFollowUp;
    t.short += r.short; t.unknown += r.unknown; t.talk += r.talkMs;
    t.calls += r.calls; t.meet += r.meetMs;
    t.measured += r.measuredMs; t.declared += r.declaredTotalMs; t.missing += r.lengthMissing;
  });
  var filtered = LG_TEAM || LG_AGENT || LG_CREATOR;

  var h = "<div class='sec'><h2>Counselling day <span class='mut' style='font-size:12.5px;font-weight:400'>" +
    esc(j.date) + (j.isToday ? ", still running" : "") + "</span></h2>" +
    "<div class='sub'>A counselling is the first time a lead reaches Discovery, Program pitched, " +
    "Pricing pitched or Counselled. One lead counts once, on the day it first got there, however " +
    "many of the four it climbs afterwards.</div>";

  h += "<div style='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0'>" +
    "<input type='date' value='" + esc(j.date) + "' onchange='loadLedger(this.value)'>" +
    "<select onchange=\"lgSet('team',this.value)\"><option value=''>All managers</option>" +
    (j.teams || []).map(function(tm){
      return "<option value='" + esc(tm.id) + "'" + (LG_TEAM === tm.id ? " selected" : "") + ">" +
        esc(tm.name) + "</option>"; }).join("") + "</select>" +
    "<select onchange=\"lgSet('agent',this.value)\"><option value=''>All agents</option>" +
    (j.rows || []).filter(function(r){ return !LG_TEAM || r.teamId === LG_TEAM; })
      .slice().sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); })
      .map(function(r){
        return "<option value='" + esc(String(r.id)) + "'" + (LG_AGENT === String(r.id) ? " selected" : "") + ">" +
          esc(r.name) + "</option>"; }).join("") + "</select>" +
    "<select onchange=\"lgSet('creator',this.value)\"><option value=''>All creators</option>" +
    lgCreators().map(function(c){
      return "<option value='" + esc(c) + "'" + (LG_CREATOR === c ? " selected" : "") + ">" +
        esc(c) + "</option>"; }).join("") + "</select>" +
    (filtered ? "<button class='btn' onclick=\"LG_TEAM='';LG_AGENT='';LG_CREATOR='';renderLedger()\">Clear</button>" : "") +
    "<span class='mut' style='margin-left:auto;font-size:12px'>read " + esc(String(j.readAt || "").slice(11, 16)) + " UTC" +
    (j.counted ? ", " + fmt(j.counted.contacts) + " stage changes walked" : "") + "</span>" +
    "</div>";

  if (j.error) h += "<div class='warn bad'><b>This day is incomplete.</b> " + esc(j.error) + "</div>";
  /* The declared column reads zero either because nobody filled it in or because the
     property does not exist. Those are completely different problems and the page has to
     say which. */
  if (j.declaredField && !j.declaredField.ready) {
    h += "<div class='warn'><b>The declared length field is not set up yet.</b> " +

      "labelled \"Call length (minutes)\", and add it to the call logging form. Until then the " +

  }
  if (j.truncated) h += "<div class='warn'>More leads changed stage than one read holds, so this day is partial.</div>";
  if (j.scoped) h += "<div class='warn'>Your team only.</div>";
  if (filtered) h += "<div class='sub'>" + fmt(rows.length) + " of " + fmt((j.rows || []).length) + " agents shown.</div>";

  h += "<div class='tiles' style='margin-top:4px'>" +
    lgTile("", "Counsellings", fmt(t.couns), "first entries") +
    lgTile(t.flag ? "bad" : "", "Flagged", fmt(t.flag), "repeat, reopened or dropped") +
    lgTile(t.nofu ? "warn" : "", "No follow up", fmt(t.nofu), "of " + fmt(t.couns)) +
    lgTile(t.short ? "warn" : "", "Under " + Math.round((j.shortMs || 600000) / 60000) + " min", fmt(t.short), "measured length") +
    lgTile(t.unknown ? "warn" : "", "Length unknown", fmt(t.unknown), "no duration held") +
    lgTile("", "Talktime", lgMins(t.talk),
      lgMins(t.measured) + " measured, " + lgMins(t.declared) + " declared") +
    lgTile(t.missing ? "warn" : "", "Length not logged", fmt(t.missing),
      "calls of " + fmt(t.calls) + " with no length at all") +
    "</div>";

  h += "<div class='tw' style='margin-top:12px'><table class='rt'><thead><tr>" +
    "<th>Agent</th><th class='n'>Couns</th>" +
    "<th class='n'>Repeat</th><th class='n'>Reopened</th><th class='n'>Dropped</th>" +
    "<th class='n'>No FU</th><th class='n'>Short</th><th class='n'>Unknown</th>" +
    "<th class='n' title='Counsellings logged with a screenshot instead of a dialled call. " +

    "<th class='n'>Calls</th>" +
    "<th class='n' title='Share of this agent&#39;s calls that carry a length from any source: " +

    "<th class='n' title='Timed by FreJun or by a meeting recording'>Measured</th>" +

  if (!rows.length) {

  rows.forEach(function(r){
    var open = !!LG_OPEN[r.id];
    h += "<tr style='cursor:pointer' onclick=\"lgToggle('" + esc(String(r.id)) + "')\">" +

      (r.active === false ? " <span class='pill' style='background:#EEF1F5;color:#42526B'>left</span>" : "") +
      "<div class='mut' style='font-size:11px'>" + esc(r.team || "no team") + " · " + (open ? "hide" : "show") + " leads</div></td>" +
      "<td class='n'><b>" + fmt(r.counsellings) + "</b></td>" +
      "<td class='n " + (r.repeat ? "cr" : "mut") + "'>" + fmt(r.repeat) + "</td>" +
      "<td class='n " + (r.reopened ? "cr" : "mut") + "'>" + fmt(r.reopened) + "</td>" +
      "<td class='n " + (r.dropped ? "cr" : "mut") + "'>" + fmt(r.dropped) + "</td>" +
      "<td class='n " + (r.noFollowUp ? "ca" : "mut") + "'>" + fmt(r.noFollowUp) + "</td>" +
      "<td class='n " + (r.short ? "ca" : "mut") + "'>" + fmt(r.short) + "</td>" +
      "<td class='n " + (r.unknown ? "ca" : "mut") + "'>" + fmt(r.unknown) + "</td>" +
      "<td class='n " + (r.screenshot ? "" : "mut") + "'>" + fmt(r.screenshot) + "</td>" +
      "<td class='n'>" + fmt(r.calls) + "</td>" +
      "<td class='n " + (r.logged == null ? "mut" : r.logged < 50 ? "cr" : r.logged < 90 ? "ca" : "cg") + "'>" +
        (r.logged == null ? "&ndash;" : r.logged + "%") +
        (r.lengthMissing ? "<div class='mut' style='font-size:11px'>" + fmt(r.lengthMissing) + " blank</div>" : "") +
      "</td>" +
      "<td class='n'>" + lgMins(r.measuredMs) +
        (r.meetings ? "<div class='mut' style='font-size:11px'>" + fmt(r.meetings) +
          (r.meetings === 1 ? " meeting" : " meetings") + ", " + lgMins(r.meetMs) + "</div>" : "") + "</td>" +
      "<td class='n " + (r.declaredTotalMs ? "" : "mut") + "'>" + lgMins(r.declaredTotalMs) + "</td>" +
      "<td class='n'><b>" + lgMins(r.talkMs) + "</b></td>" +
      "</tr>";
    if (open) {
      h += "<tr><td colspan='14' style='background:#F7F9FB;padding:0'><div style='padding:10px 12px'>" +
        (r.calls && !r.callMs ? "<div class='warn'><b>" + fmt(r.calls) + " calls carrying no duration between them.</b> " +
          "Either a day of dials nobody answered or conversations whose length never reached HubSpot. " +

        "<table class='rt'><thead><tr><th>Lead</th><th>Creator</th><th>Reached</th><th>At</th>" +
        "<th>From</th><th class='n'>Calls</th><th class='n'>Talk</th><th>Flags</th></tr></thead><tbody>" +
        lgLeadRows(r.id) + "</tbody></table></div></td></tr>";
    }
  });
  h += "</tbody></table></div>";

  h += "<div class='sub' style='margin-top:10px'>" +
    "Flags are for asking about, not for concluding with. A lead can genuinely be counselled, " +
    "go quiet and be counselled again. " +
    (j.screenshotsRead === false ? "Screenshots attached to a call log are marked but not read, so those " +
      "conversations show a length only where the agent typed one into the note. " : "") +
    "Measured time was timed by FreJun or by a meeting recording. Declared time was typed in " +
    "by the agent and is not verified, which is why the two are never added into one column " +
    "without being shown apart. " +
    "Follow up is the value on the lead now, not as it stood on the day." +

  h += "<div style='margin-top:10px'><button class='btn' onclick='lgCsv()'>Download CSV</button></div>";
  h += "</div>";
  el.innerHTML = h;

/* Header and value are one paired list, so the two cannot drift the way the daily review's
   export once did and mislabel every column. */
function lgCsv(){
  var cols = [
    ["Agent", function(r){ return r.name; }],
    ["Team", function(r){ return r.team || ""; }],
    ["Counsellings", function(r){ return r.counsellings; }],
    ["Repeat", function(r){ return r.repeat; }],
    ["Reopened", function(r){ return r.reopened; }],
    ["DroppedToPreStage", function(r){ return r.dropped; }],
    ["NoFollowUp", function(r){ return r.noFollowUp; }],
    ["UnderTenMinutes", function(r){ return r.short; }],
    ["LengthUnknown", function(r){ return r.unknown; }],
    ["LoggedWithScreenshot", function(r){ return r.screenshot; }],
    ["Calls", function(r){ return r.calls; }],
    ["CallTalkMinutes", function(r){ return Math.round(r.callMs / 60000); }],
    ["LengthNotLogged", function(r){ return r.lengthMissing; }],
    ["LoggedPercent", function(r){ return r.logged == null ? "" : r.logged; }],
    ["MeasuredMinutes", function(r){ return Math.round(r.measuredMs / 60000); }],
    ["DeclaredMinutes", function(r){ return Math.round(r.declaredTotalMs / 60000); }],
    ["Meetings", function(r){ return r.meetings; }],
    ["MeetingMinutes", function(r){ return Math.round(r.meetMs / 60000); }],
    ["NoteMinutes", function(r){ return Math.round(r.noteMs / 60000); }],
    ["TotalTalkMinutes", function(r){ return Math.round(r.talkMs / 60000); }]
  ];
  var out = [cols.map(function(c){ return c[0]; }).join(",")];
  lgRows().forEach(function(r){
    out.push(cols.map(function(c){ return '"' + String(c[1](r)).replace(/"/g, '""') + '"'; }).join(","));
  });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out.join("\n")], { type: "text/csv" }));
  a.download = "counselling-" + (LG ? LG.date : "day") + ".csv";
  a.click();
}

function drawNav(){
  var items = [["overview", "Overview", ""], ["managers", "Managers", String(J.teams.length)],
    ["ledger", "Counselling day", ""],
    ["weeks", "Creator weeks", ""], ["daily", "Daily review", ""]];
  if (J.isVP) {
    items.push(["admin", "Teams and targets", ""]);
    items.push(["mapping", "Mapping", String(J.drift.length)]);
  }
  var h = "";

function monthOpts(){

  // toISOString cannot shift the current month backwards. Six months either side,
  // because targets are set ahead of the month, not during it.
  var y = Number(J.month.slice(0, 4)), m = Number(J.month.slice(5, 7)) - 1;
  var out = "";
  for (var i = -6; i <= 6; i++) {
    var d = new Date(y, m + i, 1);
    var k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    var lbl = d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
    out += "<option value='" + k + "'" + (k === J.month ? " selected" : "") + ">" + lbl + (i > 0 ? " (future)" : "") + "</option>";
  }
  return out;
}

/* ---------- Overview strip ----------

function pctDelta(now, then){

function chip(delta, opts){

  const good = opts.lowerIsBetter ? delta < 0 : delta > 0;
  const flat = Math.abs(delta) < (opts.tol === undefined ? 2 : opts.tol);
  const cls = flat ? "n" : (good ? "g" : "r");
  const arrow = delta > 0 ? "&uarr;" : (delta < 0 ? "&darr;" : "");
  const unit = opts.pts ? " pts" : "%";
  return "<span class='ch " + cls + "'>" + arrow + " " + Math.abs(delta) + unit + (opts.suffix || " MoM") + "</span>";

  const p = Math.max(0, Math.min(100, pctDone));

  return "<div class='pb'><i style='width:" + p + "%;background:" + col + "'></i>" +
    "<b style='left:" + Math.max(0, Math.min(100, pctElapsed)) + "%'></b></div>";

function paceLine(pctDone, pctElapsed){
  const d = Math.round((pctDone - pctElapsed) * 10) / 10;
  if (d >= 0) return Math.round(pctDone) + "% done, " + Math.round(pctElapsed) + "% of month gone. <b class='cg'>" + d + " points ahead.</b>";
  return Math.round(pctDone) + "% done, " + Math.round(pctElapsed) + "% of month gone. <b class='cr'>" + Math.abs(d) + " points behind.</b>";

function drawExceptions(){

  // Grouped per team so a manager conversation is one column, not a scan of one list.
  var groups = {}, order = [];

  x.forEach(function(e){
    var k = e.team || "Company wide";

    groups[k].push(e);
  });

    (J.calloutHour || 12) + ":00 IST, so the morning is not full of false alarms. Ordered by severity within each team.</div><div class='excgrid'>";
  order.forEach(function(k){
    var items = (groups[k] || []).sort(function(a, b){ return (a.level === "bad" ? 0 : 1) - (b.level === "bad" ? 0 : 1); });
    var anyBad = items.some(function(e){ return e.level === "bad"; });
    h += "<div class='exccard" + (anyBad ? " bad" : "") + "'><h5>" + esc(k) +

      "<td class='n'>" + fmt(d.leads) + "</td>" +
      "<td>" + (d.active ? "<span class='pill g'>active</span>" : "<span class='pill a'>inactive</span>") + "</td>" +
      "<td><select onchange=\"assign('" + esc(d.id) + "', this.value)\"><option value=''>choose team...</option>" +
      J.teams.map(function(t){ return "<option value='" + t.id + "'>" + esc(t.name || "(unnamed)") + "</option>"; }).join("") +
      "</select></td></tr>";
  });
  h += "</tbody></table></div></div>";
  return h;
}
function assign(agentId, teamId){
  if (!teamId) return;
  SEL = {};
  var t = J.teams.filter(function(x){ return x.id === teamId; })[0];
  if (!t) return;
  var ids = t.agentIds.concat([agentId]);
  post("/api/vp/team", { id: teamId, agentIds: ids }).then(function(){ load(J.month); });
}
function drawAdmin(){
  var h = "<div class='sec'><h2>Teams and targets</h2><div class='sub'>A team is one manager. Agents map to exactly one team; creators can belong to one team each.</div>";
  h += "<div class='adminwrap'><div class='grid'>";
  // Stable creation order here. The Managers table sorts by revenue, but a card that
  // jumps position the moment you save is unusable.
  J.teams.slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); }).forEach(function(t){ h += teamCard(t); });
  h += teamCard({ id: "", name: "", managerEmail: "", agentIds: [], creators: [] });
  h += "</div></div></div>";
  return h;
}
var SEL = {}, TEAMS_BY_KEY = {};
function cardKey(t){ return t.id || "new"; }
function ensureSel(t){
  var k = cardKey(t);
  TEAMS_BY_KEY[k] = t;
  if (!SEL[k]) SEL[k] = {
    agents: (t.agentIds || []).slice(),
    creators: (t.creators || []).slice(),
    name: t.name || "",
    email: t.managerEmail || "",
    target: (((J.targets.teams || {})[t.id] || {}).revenue) || ""
  };
  return SEL[k];
}
function captureInputs(k){
  var n = document.getElementById("n_" + k), e = document.getElementById("e_" + k), g = document.getElementById("t_" + k);
  if (n) SEL[k].name = n.value;
  if (e) SEL[k].email = e.value;
  if (g) SEL[k].target = g.value;
}
function toggleItem(k, kind, val){
  captureInputs(k);
  var arr = SEL[k][kind], i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
  var el = document.getElementById("card_" + k);
  if (el) {
    el.innerHTML = cardInner(TEAMS_BY_KEY[k]);
    applyFind(k, "agents");
    applyFind(k, "creators");
  }
}
var FIND = {};
// Filter the rendered list in place. Re-rendering the card on every keystroke lost
// characters and scrambled their order, because each render replaced the input mid-type.
function setFind(k, kind, v){
  FIND[k + "|" + kind] = v;
  applyFind(k, kind);
}
function applyFind(k, kind){
  var q = (FIND[k + "|" + kind] || "").toLowerCase();
  var box = document.getElementById("pane_" + k + "_" + kind);
  if (!box) return;
  var items = box.querySelectorAll(".it");
  var shown = 0;
  for (var i = 0; i < items.length; i++) {
    var hit = !q || (items[i].getAttribute("data-l") || "").indexOf(q) >= 0;
    items[i].style.display = hit ? "" : "none";
    if (hit) shown++;
  }
  var none = document.getElementById("none_" + k + "_" + kind);
  if (none) none.style.display = shown ? "none" : "";
}
function creatorTargets(t, sel){
  if (!sel.creators.length) return "";
  var cur = {};
  (t.creatorRows || []).forEach(function(c){ cur[c.u] = c.target || 0; });
  var h = "<div class='ctgt'><h4>Creator targets for " + esc(J.month) + "</h4>";
  var sum = 0;
  sel.creators.forEach(function(u){
    sum += cur[u] || 0;
    h += "<div class='row'><span>" + esc(u) + "</span>" +
      "<input class='tin' type='number' placeholder='no target' value='" + (cur[u] || "") + "'" +
      " onkeydown=\"if(event.key==='Enter'){this.blur()}\" onblur=\"saveCreatorTarget('" + esc(u).replace(/'/g, "\\'") + "', this)\"></div>";
  });
  var tt = Number(sel.target || 0);
  var cls = (tt && Math.abs(sum - tt) > 1) ? "cr" : "cg";
  h += "<div class='sum'><span>Creator total</span><b class='" + cls + "'>" + inr(sum) +
    (tt ? " of " + inr(tt) : "") + "</b></div>";
  return h + "</div>";
}
function pane(title, items, k, kind, side, searchable){
  var h = "<div class='pane" + (side === "in" ? " sel" : "") + "' id='pane_" + k + "_" + kind + (side === "in" ? "_in" : "") + "'><div class='ph'>" + title + "</div>";
  if (searchable) {
    var q = FIND[k + "|" + kind] || "";
    h += "<div style='padding:5px 7px;position:sticky;top:24px;background:#fff;border-bottom:1px solid #F0F3F7;z-index:2'>" +
      "<input id='f_" + k + "_" + kind + "' placeholder='search...' value='" + esc(q) + "' style='width:100%;padding:4px 8px;font-size:12.5px'" +
      " oninput=\"setFind('" + k + "','" + kind + "', this.value)\"></div>";
  }
  if (!items.length) {
    var why = side === "in" ? "nothing assigned yet"
      : (kind === "creators" && !(J.creators || []).length
          ? (J.leadsSyncing || !J.leadsLoadedAt
              ? "creator list is still loading, the lead sync is running"
              : "no creators found in the lead data yet")
          : "nothing left");
    h += "<div class='none'>" + why + "</div>";
  }
  items.forEach(function(it){
    var dl = " data-l=\"" + esc(it.label.toLowerCase()) + "\"";
    if (it.off) {
      h += "<div class='it off'" + dl + " title='Already in " + esc(it.off) + "'>" + esc(it.label) + " <span style='font-size:11px'>(" + esc(it.off) + ")</span></div>";
    } else {
      h += "<div class='it" + (side === "in" ? " on" : "") + "'" + dl + " onclick=\"toggleItem('" + k + "','" + kind + "','" + esc(it.v).replace(/'/g, "\\'") + "')\">" +
        "<span>" + esc(it.label) + "</span><span class='ar' style='margin-left:auto'>" + (side === "in" ? "remove ✕" : "add →") + "</span></div>";
    }
  });
  if (searchable) h += "<div class='none' id='none_" + k + "_" + kind + "' style='display:none'>no match</div>";
  return h + "</div>";
}
function teamCard(t){
  ensureSel(t);
  return "<div class='teamcard' id='card_" + cardKey(t) + "'>" + cardInner(t) + "</div>";
}
function cardInner(t){
  var k = cardKey(t), sel = SEL[k], isNew = !t.id;
  var h = "<div style='display:flex;gap:8px;margin-bottom:9px'>" +
    "<input id='n_" + k + "' placeholder='Team or manager name' value='" + esc(sel.name) + "' style='flex:1'>" +
    "<input id='e_" + k + "' placeholder='manager@topmate.io' value='" + esc(sel.email) + "' style='flex:1'></div>";

  var agents = allAgents(), inA = [], outA = [];
  agents.forEach(function(o){
    if (sel.agents.indexOf(o.id) >= 0) { inA.push({ v: o.id, label: o.name }); return; }
    var taken = agentTeam(o.id, t.id);
    outA.push({ v: o.id, label: o.name, off: taken });
  });
  h += "<div class='slab'>Agents <span class='c'>" + inA.length + " assigned</span></div>";
  h += "<div class='split'>" + pane("Available", outA, k, "agents", "out", true) + pane("In this team", inA, k, "agents", "in") + "</div>";

  var inC = [], outC = [];
  var counts = {};
  (J.creators || []).forEach(function(c){ counts[c.u] = c.n; });
  (J.mainCreators || []).forEach(function(u){
    var label = u + "  " + fmt(counts[u] || 0);
    if (sel.creators.indexOf(u) >= 0) { inC.push({ v: u, label: label }); return; }
    var taken = creatorTeam(u, t.id);
    outC.push({ v: u, label: label, off: taken });
  });
  // A creator already assigned to this team but since removed from the main list
  // must stay visible, otherwise it silently disappears from the team.
  sel.creators.forEach(function(u){
    if ((J.mainCreators || []).indexOf(u) < 0) inC.push({ v: u, label: u + "  (not in main list)" });
  });
  h += "<div class='slab'>Creators <span class='c'>" + inC.length + " assigned</span></div>";
  h += "<div class='split'>" + pane("Available", outC, k, "creators", "out", true) + pane("In this team", inC, k, "creators", "in") + "</div>";
  h += creatorTargets(t, sel);

  h += "<div class='trow'>" +
    "<span>Team target ₹</span>" +
    "<input id='t_" + k + "' type='number' placeholder='0' value='" + esc(sel.target) + "' style='width:120px'>" +
    "<button class='btn p' onclick=\"saveTeam('" + (t.id || "") + "')\">" + (isNew ? "Create team" : "Save") + "</button>" +
    (isNew ? "" : "<button class='btn d' onclick=\"delTeam('" + t.id + "')\">Delete</button>") +
    "</div>";
  return h;
}
function allAgents(){
  var m = {};
  J.teams.forEach(function(t){ t.agents.forEach(function(a){ m[a.id] = a; }); });
  (J.drift || []).forEach(function(d){ m[d.id] = { id: d.id, name: d.name, email: d.email, active: d.active }; });
  return Object.values(m).sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); });
}
function agentTeam(id, exceptId){
  var hit = J.teams.filter(function(t){ return t.id !== exceptId && t.agentIds.indexOf(id) >= 0; })[0];
  return hit ? (hit.name || "another team") : "";
}
function creatorTeam(u, exceptId){
  var hit = J.teams.filter(function(t){ return t.id !== exceptId && (t.creators || []).indexOf(u) >= 0; })[0];
  return hit ? (hit.name || "another team") : "";
}
function saveTeam(id){
  var k = id || "new";
  captureInputs(k);
  var body = { id: id, name: SEL[k].name, managerEmail: SEL[k].email, agentIds: SEL[k].agents, creators: SEL[k].creators };
  var target = SEL[k].target;
  post("/api/vp/team", body).then(function(r){
    if (r.error) { alert(r.error); return; }
    SEL = {};
    if (target !== "") {
      return post("/api/vp/target", { month: J.month, scope: "team", key: r.team.id, revenue: Number(target) });
    }
  }).then(function(){ load(J.month); });
}
function delTeam(id){
  if (!confirm("Delete this team? Agents become unmapped.")) return;
  post("/api/vp/team/delete", { id: id }).then(function(){ load(J.month); });
}
load();
// Live page: the call-outs are only as current as the last fetch.
setInterval(function(){ if (!document.hidden) load(J ? J.month : null); }, 10 * 60 * 1000);
</script>
</body>
</html>
