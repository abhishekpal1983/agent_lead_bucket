<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily talktime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F6F9;color:#0A2540;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:21px;font-weight:600;margin:0}
.sub{color:#6B7A8A;font-size:12.5px;margin:2px 0 14px}
.sec{background:#fff;border:1px solid #DCE4EC;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.ctl,input[type=date]{border:1px solid #D6DEE7;background:#fff;border-radius:8px;
  padding:6px 10px;font-size:13px;color:#42526B;font-family:inherit}
.lock{background:#0A2540;color:#fff;border-color:#0A2540;font-weight:600;letter-spacing:.02em;font-size:12px}
.open{background:#EDF1F5;color:#42526B;border-color:#D6DEE7;font-weight:600;font-size:12px}
.who{background:#EAF0F6;border-color:#CBD8E6;color:#20415F;font-weight:600;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.tile{border:1px solid #E4EAF0;border-radius:9px;padding:9px 11px;background:#fff}
.tile .k{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#6B7A8A}
.tile .v{font-size:20px;font-weight:600;line-height:1.2;margin-top:1px}
.tile .s{font-size:10.5px;color:#6B7A8A}
.tile.bad{background:#FBECEC;border-color:#EFC9C9}
.tw{border:1px solid #DCE4EC;border-radius:9px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{text-align:left;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.03em;
  color:#6B7A8A;padding:8px;border-bottom:1.5px solid #D6DEE7;white-space:nowrap}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td{padding:9px 8px;border-bottom:1px solid #EDF1F5}
tr:last-child td{border-bottom:0}
.mut{color:#6B7A8A;font-size:11.5px}
.zero{color:#C3CBD4}
.hot{color:#B4232A;font-weight:700}
.amend{background:#FBECEC}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:600}
.p-red{background:#B4232A;color:#fff}
.p-gry{background:#E7EBF0;color:#42526B}
.bar2{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#EDF1F5;min-width:80px}
.warn{background:#FDF3E7;border:1px solid #F0D3AB;border-radius:9px;padding:10px 12px;
  margin-bottom:12px;font-size:12.5px}
.warn.bad{background:#FBECEC;border-color:#EFC9C9}
.log{border:1px solid #EFC9C9;background:#FDF6F6;border-radius:10px;padding:11px 13px;margin-top:14px}
.log h3{margin:0 0 7px;font-size:13px;font-weight:600;color:#8C2126}
.logrow{font-size:12px;color:#42526B;padding:5px 0;border-top:1px solid #F0DADA}
.logrow:first-of-type{border-top:0}
code{background:#EEF1F5;padding:0 4px;border-radius:3px;font-size:11.5px}
.btn{border:1px solid #D6DEE7;background:#fff;border-radius:8px;padding:6px 11px;
  font-size:13px;cursor:pointer;font-family:inherit}
tr.clik{cursor:pointer}
tr.clik:hover{background:#F7F9FB}
tr.exp td{background:#F7F9FB;padding:0}
.expin{padding:10px 12px 12px}
.dhead{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  color:#42526B;margin:6px 0 4px}
.dtab{background:transparent;font-size:12.5px}
.dtab td{padding:5px 7px;border-bottom:1px solid #E9EEF3}
.dtab tr:last-child td{border-bottom:0}
.signout{margin-left:8px;font-size:12px;color:#6B7A8A;text-decoration:none}
.signout:hover{color:#0A2540;text-decoration:underline}
.foot{color:#8794A3;font-size:11.5px;line-height:1.6;margin-top:12px}
a{color:#0A5A8C}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Daily talktime</h1><span id="who"></span></header>
  <div class="sub">Time on the phone, closed off each night and kept as it stood.</div>
  <div id="app"><div class="sec">Loading...</div></div>
</div>
<script>
var T = null, DATE = "", OPEN = {};
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function fmt(n){ return Math.round(n||0).toLocaleString("en-IN"); }
function mins(ms){
  ms = ms || 0;
  if (!ms) return "0";
  var m = Math.round(ms / 60000);
  return m >= 60 ? Math.floor(m/60) + "h " + String(m%60).padStart(2,"0") + "m" : m + "m";
}
/* IST, because every other time on this site is IST and a lock stamped 18:33 for a day
   that closed at 00:03 is worse than no stamp at all. */
function hhmm(iso){
  var t = Date.parse(iso);
  return isNaN(t) ? "" : new Date(t + 5.5 * 3600000).toISOString().slice(11, 16);
}
function hoursLate(m){
  m = Math.round(m || 0);
  if (m < 90) return m + " minutes";
  var h = Math.round(m / 60);
  return h < 36 ? h + " hours" : Math.round(h / 24) + " days";
}
function clock(ms){ return new Date((ms||0) + 5.5*3600000).toISOString().slice(11,16); }
function toggle(id){ OPEN[id] = !OPEN[id]; draw(); }
/* A declared figure invites the question "which calls", and a total cannot answer it. Each
   line links to the lead in HubSpot, and a WhatsApp call also links to the call itself,
   where the agent's own note and any screenshot are. */
function leadLink(contact, name){
  var p = T.portal || {};
  var label = esc(name || ("Lead " + contact));
  if (!contact || !p.uiDomain) return label;
  return "<a href='https://" + esc(p.uiDomain) + "/contacts/" + esc(String(p.portalId)) +
    "/record/0-1/" + esc(contact) + "' target='_blank' rel='noopener'>" + label + " &nearr;</a>";
}
function callLink(callId){
  var p = T.portal || {};
  if (!callId || !p.uiDomain) return "";
  return " <a class='mut' href='https://" + esc(p.uiDomain) + "/calls/" +
    esc(String(p.portalId)) + "/review/" + esc(String(callId)) +
    "' target='_blank' rel='noopener'>call &nearr;</a>";
}
function detailFor(id){
  var d = T.detail || { wa: [], meetings: [] };
  var wa = (d.wa || []).filter(function(x){ return String(x.owner) === String(id); });
  var mt = (d.meetings || []).filter(function(x){ return String(x.owner) === String(id); });
  if (!wa.length && !mt.length)
    return "<div class='mut' style='padding:9px 2px'>No WhatsApp calls or meetings on this day. " +
      "The FreJun time above is measured by the dialler and needs no checking.</div>";
  var h = "";
  if (wa.length) {
    h += "<div class='dhead'>WhatsApp calls <span class='mut'>length entered by the agent</span></div>" +
      "<table class='dtab'><tbody>";
    wa.forEach(function(x){
      h += "<tr><td style='width:58px' class='mut'>" + clock(x.at) + "</td>" +
        "<td>" + leadLink(x.contact, x.name) + callLink(x.callId) + "</td>" +
        "<td class='n' style='width:90px'>" +
          (x.ms ? mins(x.ms) : "<span class='hot'>no length</span>") + "</td>" +
        "<td style='width:96px'>" + (x.typed
          ? "<span class='pill p-gry'>typed WA</span>" : "<span class='mut'>from the note</span>") +
        "</td></tr>";
    });
    h += "</tbody></table>";
  }
  if (mt.length) {
    h += "<div class='dhead'>Meetings <span class='mut'>counted only where a transcript " +
      "proves somebody spoke</span></div><table class='dtab'><tbody>";
    mt.forEach(function(x){
      /* A recording duration on its own is not evidence of a conversation: a notetaker
         that joins an empty room still records about fifteen minutes of nothing. Shown
         anyway, struck through, so a meeting never simply disappears. */
      /* Three states, not two. A day locked before the transcript rule existed has entries
         with no flag at all, and calling those "transcript" asserts something we never
         checked. Unknown says unknown. */
      var out = x.counted === false;
      var unknown = x.counted === undefined;
      h += "<tr" + (out ? " style='opacity:.55'" : "") + ">" +
        "<td style='width:58px' class='mut'>" + clock(x.at) + "</td>" +
        "<td>" + leadLink(x.contact, x.name) +
          (x.title ? "<div class='mut'>" + esc(x.title) + "</div>" : "") + "</td>" +
        "<td class='n' style='width:90px'>" +
          (out ? "<s>" + mins(x.ms) + "</s>" : mins(x.ms)) + "</td>" +
        "<td style='width:190px' class='mut'>" +
          (out ? "no transcript, not counted"
               : unknown ? "counted before the transcript rule, re-lock to recheck"
               : "transcript") + "</td></tr>";
    });
    h += "</tbody></table>";
  }
  return h;
}
function load(d){
  document.getElementById("app").innerHTML = "<div class='sec'>Reading the day...</div>";
  fetch("/api/talktime" + (d ? "?date=" + encodeURIComponent(d) : ""))
    .then(function(r){
      if (r.status === 401) {
        /* Carry where we are, or signing in lands them on Call Now with an empty call
           list, which is what HR saw and reasonably read as broken. */
        location.href = "/auth/login?to=" + encodeURIComponent(location.pathname + location.search);
        throw new Error("signing in");
      }
      return r.text().then(function(t){
        try { return JSON.parse(t); }
        catch(e){ throw new Error("Server returned " + r.status); } });
    })
    .then(function(j){ if (j.error && !j.rows) throw new Error(j.error);
      T = j; DATE = j.date; draw(); })
    .catch(function(e){
      document.getElementById("app").innerHTML =
        "<div class='sec'><div class='warn bad'>Could not load: " + esc(e.message) + "</div></div>"; });
}
function draw(){
  var j = T, rows = j.rows || [], amended = {};
  (j.log || []).forEach(function(e){ amended[e.owner] = (amended[e.owner] || 0) + 1; });
  var one = j.you.role === "agent";

  /* Signing out has to be reachable from the page somebody is actually on. Without it the
     only way to change account is to clear a cookie, which nobody outside engineering is
     going to do, and HR arriving on the wrong session had no way back. */
  document.getElementById("who").innerHTML =
    "<span class='ctl who'>" + esc(j.you.email) + " &middot; " + esc(j.you.scope) + "</span>" +
    "<a class='signout' href='/auth/logout'>Sign out</a>";

  var h = "<div class='sec'>";
  h += "<div class='bar'>" +
    "<input type='date' value='" + esc(j.date) + "' max='" + esc(j.today) + "' onchange='load(this.value)'>" +
    /* The two days anybody actually wants, without going through the picker. Yesterday is
       the locked one, so it is the day to check; today is the one to watch. */
    (j.isToday ? "" : "<button class='btn' onclick=\"load('" + esc(j.today) + "')\">Today</button>") +
    (j.date === j.yesterday ? "" : "<button class='btn' onclick=\"load('" + esc(j.yesterday) +
      "')\">Yesterday</button>") +
    (j.locked
      ? "<span class='ctl lock' title='Closed at " + esc(hhmm(j.locked.at)) + " IST, " +
        esc(String(j.locked.lateMin || 0)) + " minutes after this day ended'>CLOSED " +
        esc(hhmm(j.locked.at)) + " IST</span>"
      : "<span class='ctl open'>OPEN until " + esc(j.lockAt) + "</span>") +
    /* Only when genuinely late. The check polls, so it always lands a few minutes over,
       and shouting about four of them makes the signal worthless. */
    (j.locked && j.locked.late
      ? "<span class='ctl' style='color:#8C2126'>closed " + esc(hoursLate(j.locked.lateMin)) +
        " after the day ended</span>" : "") +
    (j.locked && j.locked.relocked
      ? "<span class='ctl' style='color:#8C2126' title='" + esc(j.locked.relockReason || "") +
        "'>re-locked, see the log</span>" : "") +
    "<span class='mut' style='margin-left:auto'>" + fmt(rows.length) +
      (rows.length === 1 ? " agent" : " agents") + "</span></div>";

  if (!j.persistent)
    h += "<div class='warn bad'><b>Nothing is being saved.</b> No writable volume is mounted, " +
      "so locks vanish on the next deploy. Attach a Railway volume before relying on this.</div>";
  if (j.you.role === "none")
    h += "<div class='warn'>You are signed in, but no calls are recorded against this address " +
      "in HubSpot, so there is nothing to show. If that is wrong, the owner email in HubSpot " +
      "is the thing to check.</div>";
  if (j.isToday)
    h += "<div class='warn'>Today is still open. These numbers are live and will keep moving " +
      "until " + esc(j.lockAt) + ", when the day is closed and fixed.</div>";
  else if (!j.locked)
    h += "<div class='warn'>This day was never locked, so these numbers are being read live " +
      "and can still move.</div>";

  h += "<div class='tiles'>" +
    tile("", "Total", mins(j.totals.talkMs), one ? "your time" : fmt(rows.length) + " agents") +
    tile("", "FreJun", mins(j.totals.callMs), fmt(j.totals.calls) + " calls") +
    tile("", "Meetings", mins(j.totals.meetMs), fmt(j.totals.meetings) + " held") +
    tile("", "WhatsApp", mins(j.totals.declaredMs), fmt(j.totals.waCalls) + " calls, declared") +
    tile(j.totals.waMissing ? "bad" : "", "No length given", fmt(j.totals.waMissing), "WhatsApp calls") +
    (one ? "" : tile(j.totals.amended ? "bad" : "", "Amended after lock",
      fmt(j.totals.amended), "changes")) +
    "</div>";

  h += "<div class='tw'><table><thead><tr>" +
    (one ? "" : "<th>Agent</th><th>Team</th>") +
    "<th class='n'>FreJun</th><th class='n'>Calls</th><th class='n'>Meetings</th>" +
    "<th class='n'>WhatsApp</th><th class='n'>Total</th>" +
    "<th class='n' title='Calls nothing measured, so the length had to come from the agent. 8 of 11 means eleven such calls and eight with a length on them.'>Length given</th>" + (one ? "" : "<th></th>") +
    "</tr></thead><tbody>";
  if (!rows.length)
    h += "<tr><td colspan='9' class='mut' style='padding:14px'>Nothing on the phone this day.</td></tr>";
  rows.forEach(function(r){
    /* Whether there is anything behind the row, not whether the agent used the call type.
       An agent who writes "duration: 26" without setting the type has real calls to show,
       and gating on waCalls left their time in the total with no way to check it. */
    var can = (r.declaredCalls || r.waCalls || r.meetings);
    h += "<tr class='" + (amended[r.id] ? "amend" : "") + (can ? " clik" : "") + "'" +
      (can ? " onclick=\"toggle('" + esc(String(r.id)) + "')\"" : "") + ">" +
      (one ? "" : "<td><b>" + esc(r.name) + "</b>" +
        (can ? "<div class='mut'>" + (OPEN[r.id] ? "hide" : "show") + " the WhatsApp calls and meetings</div>" : "") +
        "</td><td class='mut'>" + esc(r.team || "no team") + "</td>") +
      "<td class='n'>" + mins(r.callMs) + "</td>" +
      "<td class='n mut'>" + fmt(r.calls) + "</td>" +
      "<td class='n " + (r.meetMs ? "" : "zero") + "'>" + mins(r.meetMs) +
        (r.meetings ? "<div class='mut'>" + fmt(r.meetings) + "</div>" : "") + "</td>" +
      "<td class='n " + (r.declaredMs ? "" : "zero") + "'>" + mins(r.declaredMs) +
        (r.declaredCalls ? "<div class='mut'>" + fmt(r.declaredCalls) +
          (r.declaredCalls === 1 ? " call" : " calls") +
          /* Worth seeing: time supplied without the call type set is the adoption gap. */
          (r.waCalls < r.declaredCalls ? ", " + fmt(r.declaredCalls - r.waCalls) + " untyped" : "") +
          "</div>" : "") + "</td>" +
      "<td class='n'><b>" + mins(r.talkMs) + "</b></td>" +
      "<td class='n " + (r.needLength > r.declaredCalls ? "hot" : "mut") + "'>" +
        (r.needLength ? r.declaredCalls + " of " + r.needLength : "&ndash;") + "</td>" +
      (one ? "<td>" + (can ? "<span class='mut'>" + (OPEN[r.id] ? "hide" : "show") +
        " calls</span>" : "") + "</td>" : "<td>" + (amended[r.id]
        ? "<span class='pill p-red'>amended after lock</span>" : "") + "</td>") +
      "</tr>";
    if (can && OPEN[r.id]) {
      h += "<tr class='exp'><td colspan='" + (one ? 6 : 9) + "'>" +
        "<div class='expin'>" + detailFor(r.id) + "</div></td></tr>";
    }
  });
  h += "</tbody></table></div>";

  if ((j.log || []).length) {
    h += "<div class='log'><h3>Changed after the day was locked</h3>";
    j.log.forEach(function(e){
      h += "<div class='logrow'><b>" + esc(e.name) + "</b> &middot; " +
        (e.kind === "total"
          ? esc(e.label || e.field)
          : "call <code>" + esc(e.callId) + "</code> " + esc(e.kind)) + " " +
        mins(e.from) + " to " + mins(e.to) +
        " &middot; " + esc(String(e.at).slice(0,10)) + " " + esc(hhmm(e.at)) + " IST" +
        (e.phase === "relock"
          ? "<div class='mut'>corrected by " + esc(e.by || "?") + ": " + esc(e.reason || "") + "</div>"
          : "") + "</div>";
    });
    h += "<div class='logrow' style='color:#6B7A8A'>The locked figure stands. " +
      "The table above shows the day as it was at " + esc(j.lockAt) + ".</div></div>";
  }

  h += "<div class='foot'>FreJun time is measured by the dialler. Meetings are measured by " +
    "their recording and count only when attached to a lead. WhatsApp time is the length the " +
    "agent entered and is never mixed into the measured columns. " +
    "A locked day is served exactly as it was closed and is not read from HubSpot again. " +
    "Editing a record afterwards cannot change the figure, and is recorded above." +
    "</div>";
  h += "<div style='margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap'>" +
    "<button class='btn' onclick='csv()'>Download CSV</button>" +
    /* A lock stops the data being edited after the fact. It must not stop a bug in the
       arithmetic being corrected, so long as the correction is on the record. */
    (j.locked && j.you.role === "vp"
      ? "<button class='btn' onclick='relock()'>Re-lock this day</button>" +
        "<span class='mut'>rebuilds the day and records what moved, and why</span>"
      : "") +
    "</div>";
  h += "</div>";
  document.getElementById("app").innerHTML = h;
}
function tile(cls, k, v, s){
  return "<div class='tile " + cls + "'><div class='k'>" + esc(k) + "</div>" +
    "<div class='v'>" + v + "</div><div class='s'>" + esc(s) + "</div></div>";
}
function relock(){
  var why = prompt("Why is this day being re-locked?\n\nThis is written into the change " +
    "log beside your name and the figures that move.",
    "Meeting time was counted from recordings with no transcript, which a notetaker " +
    "produces in an empty room. Rebuilt with the transcript rule.");
  if (why === null) return;
  why = String(why).trim();
  if (why.length < 8) { alert("Say why, in a sentence."); return; }
  fetch("/api/talktime/relock", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ date: T.date, reason: why }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.error) { alert("Could not re-lock: " + j.error); return; }
      alert("Re-locked " + j.day + ". " + j.moved +
        (j.moved === 1 ? " figure moved." : " figures moved.") +
        "\nThe change log below now shows what and why.");
      load(T.date);
    })
    .catch(function(e){ alert("Could not re-lock: " + e.message); });
}
function csv(){
  var cols = [
    ["Agent", function(r){ return r.name; }], ["Team", function(r){ return r.team || ""; }],
    ["FreJunMinutes", function(r){ return Math.round(r.callMs/60000); }],
    ["Calls", function(r){ return r.calls; }],
    ["MeetingMinutes", function(r){ return Math.round(r.meetMs/60000); }],
    ["Meetings", function(r){ return r.meetings; }],
    ["WhatsAppMinutesDeclared", function(r){ return Math.round(r.declaredMs/60000); }],
    ["WhatsAppCalls", function(r){ return r.waCalls; }],
    ["WhatsAppCallsWithNoLength", function(r){ return r.waMissing; }],
    ["TotalMinutes", function(r){ return Math.round(r.talkMs/60000); }]
  ];
  var out = [cols.map(function(c){ return c[0]; }).join(",")];
  (T.rows || []).forEach(function(r){
    out.push(cols.map(function(c){ return '"' + String(c[1](r)).replace(/"/g,'""') + '"'; }).join(","));
  });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out.join("\n")], { type: "text/csv" }));
  a.download = "talktime-" + (T ? T.date : "day") + ".csv";
  a.click();
}
load("");
</script>
</body>
</html>
